[project]
name = "sweatcast"
version = "0.17.0"
description = "Narrated workout podcasts, written by Claude Code and voiced on your own computer or by a cloud voice."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Everything but the local voices: the lint, research, build, delivery and cloud voices. Installs
    # on every supported system, an Intel Mac included.
    # Video transcripts for the deep dive and puzzle videos.
    "yt-dlp==2026.8.19",
    # TLS roots for tools/feeds.py on a python.org Python.
    "certifi",
    # ffmpeg (with libmp3lame and loudnorm) for computers that don't have it installed (tools/ffmpeg.py).
    "imageio-ffmpeg==0.6.0",
]

# The local voice, installed only where the readiness check says it runs (./sweatcast setup picks the
# extra and remembers it in .venv/.sweatcast-extra): Kyutai's Pocket TTS on PyTorch, and the take check's
# speech recognizer (Parakeet through ONNX). One engine on every computer: an Apple Silicon Mac's
# processor, a PC's processor, or an NVIDIA card. PyTorch 2.6 has no Intel Mac build, so none there.
[project.optional-dependencies]
# The processor: an Apple Silicon Mac (PyTorch from PyPI), or Windows or Linux (PyTorch's processor build).
cpu = [
    "pocket-tts==4.0.1; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "torch==2.6.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
    "onnx-asr[cpu,hub]==0.12.0; sys_platform != 'darwin' or platform_machine == 'arm64'",
]
# Windows or Linux with an NVIDIA card: PyTorch's CUDA 12.4 build.
cuda = [
    "pocket-tts==4.0.1; sys_platform != 'darwin'",
    "torch==2.6.0; sys_platform != 'darwin'",
    "onnx-asr[cpu,hub]==0.12.0; sys_platform != 'darwin'",
]

[tool.uv]
package = false
environments = ["sys_platform == 'darwin'", "sys_platform == 'win32'", "sys_platform == 'linux'"]
conflicts = [[{ extra = "cuda" }, { extra = "cpu" }]]

# PyTorch's CUDA 12.4 builds (NVIDIA cards from the RTX 20 series on), and its processor builds for
# Windows and Linux (a Mac takes PyPI's).
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", extra = "cuda" },
         { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" }]
