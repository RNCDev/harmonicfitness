# The ten shipped local coaches: how each was made, so any of them can be remade
# (tools/coachmaker/, maintainer only). Every coach reads the same clip script.
#
# who, sound, energy: the persona's [voice] table. description: the line the designer heard.
# design: filled in when a take is chosen (designer, model revision, seed, take).

# 63 words, about 24 s at a coaching pace (150 to 175 wpm).
script = """Alright, let's get to work. Set your feet about shoulder width, chest up, and breathe in. \
Lower down slow, two, three, and drive back up. Good. That's exactly the pace we want. Four more, stay \
with me. Last one, and rest. Shake it out, take a sip of water. Next we switch sides, left leg forward \
for thirty seconds, and we'll go again."""

# Added to every description, so every clip comes out clean and alike.
studio = "Speaks at a steady, natural pace, close to the microphone, in a quiet studio with no background noise or music."

