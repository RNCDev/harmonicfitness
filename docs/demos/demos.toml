# The demo clips on the web app's home page, heard before anyone signs in: seven clips of about two minutes, each
# the chosen segments of a full workout written for an invented listener from one ask in their own words. Nobody
# here is a real person. docs/demos/index.html is the plan; the `demos` skill builds them; ./harmonicfitness demos
# is the command.
#
# The whole workout is written and linted, which costs nothing; only the clip's segments are rendered
# (./harmonicfitness demos excerpt), about ten thousand characters for the seven instead of a hundred and seventy.
#
# Each [[demo]] names its listener (listeners/<slug>/, its own context folder: never in me/), the ask, the
# check-in's answers, the brief's flags, the coach, the clip (what it shows, the story told in it, and the segments
# the writer arranges so they fall together), and the card the home page shows with it. `from`, `to`, `moments` and
# `changed` are filled in at build.

version = 1            # raise by one each time the set is re-made; the web manifest carries it
built = "2026-11-04"   # the day the set was built
engine = "0.63.0"      # the engine's VERSION it was built with
service = "elevenlabs"
model = "eleven_v4"    # ElevenLabs's more natural model, never eleven_v4_turbo; `demos home` holds each coach to it
coaches = ["Coach Priya", "Coach Desmond", "Coach Bea"]   # ElevenLabs stock voices Lily, Charlie and Matilda: nothing designed
bucket = "harmonicfitness-media"   # the app's public Fly (Tigris) bucket: demos/v<version>/<slug>.mp3 and demos.json
keys = "me/.env"       # the listener's own key file, read only by the engine (demos run sets HARMONICFITNESS_KEYS)
clip_seconds = [90, 150]   # the clip's segments add up to about two minutes

# Given to the writer for every demo, beside the workout skill's rules: these clips play for a year or more.
writing_rules = [
  "No dates, days of the week, months, seasons, holidays, weather or news: every line must sound right in any month.",
  "Only evergreen stories, in the format the clip names; check every fact against two sources, kept in the day's research sheet.",
  "Never call it a first session together unless the ask says so: there is no log to look back on.",
  "Use the listener's name in the welcome, at the hardest set and at the sign-off, as for any listener.",
  "In the welcome, the coach says their own name once (\"I'm Priya\"): someone hearing a clip cold should know who's talking.",
  "Write the whole workout and lint it clean; arrange it so the clip's segments fall together and add up to about two minutes, and so they make sense heard alone.",
]

# What the seven show between them (index.html, The seven):
#   kits     a hotel room (chair, towel), one chair, dumbbells in pounds, a park, kettlebells in kilos, bands, a mini band
#   lengths  25, 30, 30, 35, 40, 40, 45 minutes
#   limits   a delicate knee on one side, a delicate lower back, an off-limits shoulder with a surgeon's rule, none
#   levels   novice (Ben, Ines), experienced (Jo, Ravi, Mo, Frank), advanced (Lena)
#   sessions general, strength, mobility, targeted
#   stories  number, myth or fact, how they trained, serial, brain teaser, profile, explainer

[[demo]]
slug = "jo"
order = 1
minutes = 30
coach = "Coach Priya"
coach_file = "coaches/priya.md"
ask = "Thirty minutes, hotel room, nothing to lift. My left knee's cranky after the flight."
shows = "A one-sided limit in a hotel room: the left knee named with its stop signs, the chair and towel put to work, a space-history number to start."
brief = '--goal general --minutes 30 --preset hotel-room --coach "Coach Priya"'

[demo.check_in]
today = "Stiff from a six-hour flight. The left knee aches on stairs; no swelling, fine walking."
sore = "Left knee, as in health.md. Nothing new."
energy = "Medium"

[demo.clip]
story = "number"       # a format id from knowledge/content.toml
segments = "The opening (the left knee named in the brief's words, the chair and the towel set out, the towel under the left knee for anything kneeling) and the warm-up's first steady movement, with a space-history number told through it. A one-sided limit's clip starts at segment 1."
from = 1
to = 2
moments = [
  { at = "0:00", label = "Priya introduces herself, and the left knee is named" },
  { at = "0:56", label = "The chair, the towel, and a number from Apollo" },
]

[demo.card]
who = "Jo, travels for work and trains three times a week"
kit = "Hotel room: a chair and a towel"
limit = "Left knee, delicate"
topics = ["Space history", "Jazz"]
changed = "The left knee stays light: no jumping or deep bends, the right leg alone does the lunges, and the hips and glutes work for the left knee."


