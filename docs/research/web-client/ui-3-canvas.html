<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweatcast Live Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Schibsted+Grotesk:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9EDF4;
  --surface:#FFFFFF;
  --surface-2:#F4F6FA;
  --ink:#172036;
  --ink-2:#3B4560;
  --muted:#667089;
  --line:#D3D9E5;
  --block:#24345C;
  --block-ink:#F2F5FB;
  --rest:#F7F3E3;
  --rest-line:#E1D6AE;
  --rest-ink:#6B5A1E;
  --focus:#2F5BEA;
  --t-time:#2F5BEA;
  --t-goal:#C92A64;
  --t-kit:#0B7F70;
  --t-coach:#6E45CF;
  --t-limit:#B26B00;
  --t-mood:#3F7F17;
  --danger:#B42318;
  --danger-bg:#FDECEA;
  --ok:#0B7F70;
  --shadow:0 1px 0 rgba(23,32,54,.06), 0 8px 24px -12px rgba(23,32,54,.25);
  --radius-s:6px;
  --radius-m:12px;
  --radius-l:20px;
  --font-ui:"Schibsted Grotesk", system-ui, sans-serif;
  --font-display:"Bricolage Grotesque", "Schibsted Grotesk", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#10172A;
    --surface:#18223B;
    --surface-2:#1F2A46;
    --ink:#E8EDF8;
    --ink-2:#C2CAE0;
    --muted:#8C97B3;
    --line:#2C3858;
    --block:#C9D6F5;
    --block-ink:#13203F;
    --rest:#2A2A2E;
    --rest-line:#4D4632;
    --rest-ink:#E3CF8E;
    --focus:#8FA8FF;
    --t-time:#86A2FF;
    --t-goal:#FF7EA6;
    --t-kit:#45CDB8;
    --t-coach:#B79BFF;
    --t-limit:#F4B850;
    --t-mood:#A3D66B;
    --danger:#FF8A7D;
    --danger-bg:#3A1E22;
    --ok:#45CDB8;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-ui);
  font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- frame ---------- */
.app{
  height:100dvh;display:grid;
  grid-template-columns:minmax(320px,410px) 1fr;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:"top canvas" "thread canvas" "composer canvas";
}
.top{grid-area:top;display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-right:1px solid var(--line);background:var(--surface)}
.brand{font-family:var(--font-display);font-weight:800;font-size:20px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand-mark{width:22px;height:14px;display:flex;gap:2px;align-items:flex-end}
.brand-mark i{display:block;flex:1;background:var(--ink);border-radius:1px}
.brand-mark i:nth-child(1){height:40%}.brand-mark i:nth-child(2){height:100%;background:var(--t-goal)}.brand-mark i:nth-child(3){height:65%}.brand-mark i:nth-child(4){height:30%;background:var(--t-time)}
.top .spacer{flex:1}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;font-size:11px;font-weight:600;color:var(--muted);background:var(--surface)}
.ghost-btn{background:none;border:1px solid var(--line);border-radius:999px;padding:5px 10px 5px 12px;display:inline-flex;gap:8px;align-items:center;color:var(--ink-2);font-size:13px}
.ghost-btn:hover{border-color:var(--ink-2)}
.viewtoggle{display:none}

.thread{grid-area:thread;overflow-y:auto;padding:8px 18px 18px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:14.5px}
.msg.agent{color:var(--ink)}
.msg.agent .who{font-size:12px;color:var(--muted);margin-bottom:2px;font-weight:600}
.msg.user{align-self:flex-end;background:var(--surface-2);border:1px solid var(--line);padding:8px 12px;border-radius:14px 14px 4px 14px}
.msg.user .tk{padding:0 2px}
.msg.sys{align-self:center;font-size:12.5px;color:var(--muted);text-align:center}
.msg p{margin:0 0 6px}
.msg p:last-child{margin:0}

/* ---------- composer (the memorable part) ---------- */
.composer{grid-area:composer;padding:12px 14px 16px;border-right:1px solid var(--line);border-top:1px solid var(--line);background:var(--surface)}
.field{position:relative;border:1.5px solid var(--line);border-radius:var(--radius-m);background:var(--surface-2);transition:border-color .15s}
.field:focus-within{border-color:var(--focus)}
.field.listening{border-color:var(--t-goal)}
.hl,.input{
  font-family:var(--font-ui);font-size:16px;line-height:1.5;padding:12px 88px 12px 14px;
  white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;margin:0;border:0;
  min-height:76px;max-height:180px;
}
.hl{position:absolute;inset:0;color:transparent;pointer-events:none;overflow:hidden}
.input{position:relative;display:block;width:100%;background:transparent;resize:none;outline:none;color:var(--ink);caret-color:var(--focus);overflow-y:auto}
.input::placeholder{color:var(--muted)}
.hl mark{color:transparent;border-radius:4px;padding:1px 0;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.tk-time{background:color-mix(in srgb,var(--t-time) 22%,transparent);box-shadow:inset 0 -2px 0 var(--t-time)}
.tk-goal{background:color-mix(in srgb,var(--t-goal) 20%,transparent);box-shadow:inset 0 -2px 0 var(--t-goal)}
.tk-kit{background:color-mix(in srgb,var(--t-kit) 22%,transparent);box-shadow:inset 0 -2px 0 var(--t-kit)}
.tk-coach{background:color-mix(in srgb,var(--t-coach) 22%,transparent);box-shadow:inset 0 -2px 0 var(--t-coach)}
.tk-limit{background:color-mix(in srgb,var(--t-limit) 24%,transparent);box-shadow:inset 0 -2px 0 var(--t-limit)}
.tk-mood{background:color-mix(in srgb,var(--t-mood) 22%,transparent);box-shadow:inset 0 -2px 0 var(--t-mood)}
.tools{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:17px;height:17px}
.icon-btn.send{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.icon-btn.send[disabled]{opacity:.35;cursor:default}
.listening .icon-btn.mic{background:var(--t-goal);border-color:var(--t-goal);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--t-goal) 50%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.heard{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;margin-top:8px;font-size:12.5px;color:var(--muted);align-items:center}
.heard .lbl{margin-right:2px}
.intent{display:inline-flex;gap:6px;align-items:center;font-weight:600;color:var(--ink)}
.hint-row{display:flex;justify-content:space-between;margin-top:6px;font-size:12px;color:var(--muted);gap:8px}

/* ---------- chips ---------- */
.chip{
  --c:var(--ink-2);
  display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px 4px 9px;
  font-size:13px;font-weight:600;border:1.5px solid var(--c);
  background:color-mix(in srgb,var(--c) 14%,var(--surface));color:var(--ink);white-space:nowrap
}
.chip .k{font-weight:500;color:var(--c);font-size:12px}
.chip.assumed{background:transparent;border-style:dashed;color:var(--ink-2)}
.chip.assumed .k::after{content:" (usual)";font-weight:400;color:var(--muted)}
button.chip:hover{background:color-mix(in srgb,var(--c) 26%,var(--surface))}
.chip.open{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.c-time{--c:var(--t-time)}.c-goal{--c:var(--t-goal)}.c-kit{--c:var(--t-kit)}.c-coach{--c:var(--t-coach)}.c-limit{--c:var(--t-limit)}.c-mood{--c:var(--t-mood)}
.chip.sm{font-size:12px;padding:2px 9px 2px 7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}

/* ---------- canvas ---------- */
.canvas{grid-area:canvas;overflow-y:auto;position:relative;padding:28px clamp(16px,4vw,56px) 64px}
.canvas-inner{max-width:1080px;margin:0 auto}
.view{animation:viewin .25s ease-out}
@keyframes viewin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h1.q{font-family:var(--font-display);font-weight:800;font-size:clamp(34px,5.4vw,64px);line-height:1;letter-spacing:-.035em;margin:8px 0 26px;max-width:14ch}
h2.t{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.05;letter-spacing:-.025em;margin:0 0 6px}
h3{font-size:15px;margin:0 0 8px;font-weight:700}
.sub{color:var(--muted);margin:0 0 20px;max-width:60ch}
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:16px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}

/* home */
.home-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(20px,4vw,56px);align-items:start}
.doors{list-style:none;margin:0;padding:0;border-top:1.5px solid var(--ink)}
.doors li{border-bottom:1px solid var(--line)}
.door{width:100%;background:none;border:0;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px 4px}
.door .name{font-family:var(--font-display);font-size:22px;font-weight:600;letter-spacing:-.015em}
.door .what{display:block;font-size:13px;color:var(--muted);font-family:var(--font-ui);letter-spacing:0;font-weight:400}
.door .sw{width:18px;height:18px;border-radius:5px;background:var(--c)}
.door:hover .name{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.tries{margin-top:4px}
.tries h3{color:var(--ink-2)}
.try{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:11px 14px;margin-bottom:8px;font-size:15px;color:var(--ink)}
.try:hover{border-color:var(--ink-2)}
.try .lead{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.nudge{margin-top:22px;background:var(--surface);border-radius:var(--radius-l);padding:18px;box-shadow:var(--shadow)}
.old{padding:12px 0;border-top:1px solid var(--line)}
.old:first-of-type{border-top:0}
.old .row{display:flex;justify-content:space-between;gap:8px;font-size:14px;font-weight:600}
.old .when{color:var(--muted);font-weight:400;font-size:12.5px}
.mini{display:flex;height:10px;gap:1px;margin:8px 0;border-radius:3px;overflow:hidden}
.mini i{display:block;background:var(--block)}
.mini i.r{background:var(--rest-line)}
.reacts{display:flex;flex-wrap:wrap;gap:6px}
.react{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 11px;font-size:13px}
.react:hover{border-color:var(--ink-2)}
.react.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.saved-note{font-size:12.5px;color:var(--ok);margin-top:6px}

/* build */
.build-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.total{text-align:right}
.total .n{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
.total .tol{font-size:12px;color:var(--muted)}
.tray{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.opts{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--surface);border-radius:var(--radius-m);margin-bottom:12px;border:1px solid var(--line);align-items:center}
.opts .q{font-size:13px;color:var(--muted);margin-right:6px;width:100%}
.opt{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:13.5px}
.opt:hover{border-color:var(--ink-2)}
.opt.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.tl-card{background:var(--surface);border-radius:var(--radius-l);padding:16px 16px 12px;box-shadow:var(--shadow);margin-bottom:14px}
.tl-scroll{overflow-x:auto;overflow-y:hidden;padding-bottom:6px;scrollbar-width:thin}
.tl{position:relative;min-width:100%}
.ruler{position:relative;height:18px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ruler span{position:absolute;top:0;transform:translateX(-50%)}
.ruler span:first-child{transform:none}
.ruler span:last-child:not(:first-child){transform:translateX(-100%)}
.lane{display:flex;height:118px;gap:2px;position:relative}
.blk{position:relative;flex:0 0 auto;border-radius:8px;border:0;padding:8px 8px;text-align:left;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;min-width:0;transition:filter .15s, outline-color .15s;outline:2px solid transparent;outline-offset:1px}
.blk .bn{font-weight:700;font-size:13px;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.blk .bs{font-size:11.5px;opacity:.8;font-variant-numeric:tabular-nums}
.blk.work{background:var(--block);color:var(--block-ink)}
.blk.warm,.blk.cool{background:color-mix(in srgb,var(--t-mood) 22%,var(--surface));color:var(--ink)}
.blk.fin{background:var(--t-goal);color:#fff}
.blk.rest{background:repeating-linear-gradient(135deg,var(--rest) 0 6px,color-mix(in srgb,var(--rest-line) 55%,var(--rest)) 6px 7px);color:var(--rest-ink);padding:8px 2px;align-items:center}
.blk.rest .bn{writing-mode:vertical-rl;transform:rotate(180deg);font-size:11.5px;font-weight:600;-webkit-line-clamp:unset;display:block;white-space:nowrap;max-height:100%;overflow:hidden;text-overflow:ellipsis}
.blk.rest .bs{display:none}
.blk:hover{filter:brightness(1.06)}
.blk.sel{outline-color:var(--focus)}
.blk.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 4px var(--t-limit)}100%{box-shadow:0 0 0 0 transparent}}
.blk .load{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--t-limit);box-shadow:0 0 0 2px var(--block)}
.grip{position:absolute;top:0;bottom:0;right:-5px;width:10px;cursor:ew-resize;touch-action:none;z-index:2;display:grid;place-items:center}
.grip::after{content:"";width:3px;height:26px;border-radius:2px;background:var(--surface);opacity:0;transition:opacity .15s;box-shadow:0 0 0 1px var(--ink-2)}
.blk:hover .grip::after,.grip.drag::after{opacity:1}
.body-lane{position:relative;height:38px;margin-top:6px}
.body-lane svg{width:100%;height:100%;display:block;overflow:visible}
.body-lane .bl-label{position:absolute;left:0;top:-1px;font-size:11px;color:var(--t-limit);font-weight:600;background:var(--surface);padding-right:6px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.playhead{position:absolute;top:18px;bottom:0;width:2px;background:var(--t-goal);z-index:3;pointer-events:none;display:none}
.playhead::before{content:"";position:absolute;top:-6px;left:-5px;width:12px;height:12px;border-radius:50%;background:var(--t-goal)}
.prog-mask{position:absolute;top:18px;left:0;height:118px;background:color-mix(in srgb,var(--bg) 70%,transparent);right:0;z-index:2;pointer-events:none;transition:left .4s linear;backdrop-filter:grayscale(1)}

.detail{background:var(--surface);border-radius:var(--radius-l);padding:16px 18px;border:1px solid var(--line);margin-bottom:14px}
.detail .dh{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.detail .cue{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
.swaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.swap{border:1px solid var(--line);background:var(--surface-2);border-radius:var(--radius-m);padding:9px 11px;text-align:left}
.swap:hover{border-color:var(--ink-2)}
.swap b{display:block;font-size:14px}
.swap span{font-size:12px;color:var(--muted)}
.swap.off{opacity:.5;text-decoration:line-through;cursor:not-allowed}
.planfacts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px 24px;font-size:13.5px;color:var(--ink-2);margin-bottom:18px}
.planfacts b{color:var(--ink);font-weight:600}
.removed{font-size:13px;color:var(--ink-2);background:color-mix(in srgb,var(--t-limit) 12%,var(--surface));border-left:3px solid var(--t-limit);padding:9px 12px;border-radius:0 8px 8px 0;margin-bottom:14px}
.removed s{color:var(--muted)}
.gobar{position:sticky;bottom:0;margin:0 -8px;padding:12px 8px 18px;background:linear-gradient(transparent,var(--bg) 30%);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.go{background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:13px 22px;font-weight:700;font-size:16px;display:inline-flex;gap:10px;align-items:center}
.go .kbd{background:transparent;color:var(--surface);border-color:color-mix(in srgb,var(--surface) 40%,transparent)}
.go:hover{filter:brightness(1.15)}
.go.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--ink)}
.fine{font-size:12.5px;color:var(--muted);max-width:48ch}

/* render */
.stages{list-style:none;padding:0;margin:0 0 18px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stage{padding:12px;border-radius:var(--radius-m);background:var(--surface);border:1px solid var(--line);font-size:13.5px}
.stage b{display:block;font-size:14px}
.stage .bar{height:4px;border-radius:2px;background:var(--surface-2);margin-top:10px;overflow:hidden}
.stage .bar i{display:block;height:100%;width:0;background:var(--t-time);transition:width .3s}
.stage.done .bar i{background:var(--ok)}
.stage.now{border-color:var(--t-time)}
.stage .st{color:var(--muted);font-size:12px}
.player{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--surface);border-radius:var(--radius-l);padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px}
.pbtn{width:56px;height:56px;border-radius:50%;border:0;background:var(--t-goal);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.pbtn svg{width:22px;height:22px}
.now{flex:1;min-width:180px}
.now b{display:block;font-size:16px}
.now span{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.expire{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);background:color-mix(in srgb,var(--t-limit) 12%,var(--surface));padding:10px 14px;border-radius:var(--radius-m);margin-bottom:14px}

/* coach */
.trait-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 18px}
.slot{border:1.5px dashed var(--line);border-radius:var(--radius-m);padding:10px 12px;min-height:66px;background:var(--surface)}
.slot.filled{border-style:solid;border-color:var(--c)}
.slot .sk{font-size:12px;color:var(--c);font-weight:600}
.slot .sv{font-size:15px;font-weight:600;margin-top:2px}
.slot .sv.empty{color:var(--muted);font-weight:400;font-size:13px}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-bottom:16px}
.cand{background:var(--surface);border-radius:var(--radius-l);padding:14px;border:1.5px solid var(--line);display:flex;flex-direction:column;gap:10px}
.cand.pick{border-color:var(--t-coach);box-shadow:0 0 0 3px color-mix(in srgb,var(--t-coach) 25%,transparent)}
.cand .ch{display:flex;justify-content:space-between;align-items:center}
.cand .letter{font-family:var(--font-display);font-size:30px;font-weight:800;line-height:1}
.cand .cost{font-size:12.5px;color:var(--muted)}
.wave{display:flex;gap:2px;align-items:center;height:36px}
.wave i{flex:1;background:var(--ink-2);border-radius:1px;opacity:.35}
.wave.playing i{opacity:1;background:var(--t-coach);animation:wv .7s ease-in-out infinite alternate}

const RULES = [
  {t:'time', re:/\b(\d{1,2})\s?(?:-\s?)?(?:minutes?|mins?|m)\b/gi, v:m=>+m[1]},
  {t:'time', re:/\b(twenty[ -]five|forty[ -]five|fifteen|twenty|thirty|ten|half an hour|quick one|quick)\b(?:\s?(?:minutes?|mins?))?/gi, v:m=>NUMW[m[1].toLowerCase()]},
  {t:'mood', re:/\b(slept (?:badly|terribly|poorly)|bad night|tired|knackered|exhausted|wiped|stressed|low energy|feeling (?:fresh|strong|great|good)|fresh|full of beans|last one was too (?:hard|easy)|too hard|too easy)\b/gi,
    v:m=>{const s=m[1].toLowerCase(); if(/hard/.test(s))return 'hard'; if(/fresh|strong|great|good|beans|easy/.test(s))return 'fresh'; return 'low';}},
  {t:'goal', re:/\b(strength|conditioning|cardio|hiit|sweaty|sweat|mobility|stretch(?:y|ing)?|breathing|general fitness|full[ -]body|legs|upper body|core)\b/gi,
    v:m=>{const s=m[1].toLowerCase(); if(/cardio|hiit|sweat|conditioning/.test(s))return 'Conditioning'; if(/mobil|stretch|breath/.test(s))return 'Mobility and breathing'; if(/general|full/.test(s))return 'General fitness'; return 'Strength';}},

function parse(text){
  const spans = [], b = {limits:[]}, low = text.toLowerCase();
  const take = (start,end,type) => {
    if (spans.some(s => start < s.end && end > s.start)) return false;
    spans.push({start,end,type}); return true;
  };
  for (const r of RULES){
    r.re.lastIndex = 0; let m;
    while ((m = r.re.exec(text))){
      if (r.t==='limit' && !/sore|hurt|tweak|achy|aching|stiff|off|bad|niggl|pain|twinge|fine|better|worse|careful|dodgy/.test(low)) continue;
      if (!take(m.index, m.index+m[0].length, r.t)) continue;
      const v = r.v(m);
      if (r.t==='limit'){
        const lv = /can't use|cannot use|no (?:knee|shoulder|back|ankle|wrist|hip)|off[- ]limits|really (?:bad|hurts)/.test(low) ? 'off-limits' : 'delicate';

        b.limits.push(Object.assign(v,{level:lv,trend}));
      } else if (b[r.t]===undefined) b[r.t] = v;
    }
  }
  if (b.time) b.time = Math.min(60, Math.max(10, b.time));
  // intents
  let intent = null, pref = null, traits = [];
  for (const p of PREF_RE){ const m = text.match(p.re); if (m && m[1].trim().length>1){ pref = {k:p.k, v:m[1].trim().replace(/\s+$/,'')}; break; } }
  const coachy = /\b(new coach|a coach (?:who|that|with)|coach (?:who|that)|voice|sounds? like|sounding)\b/i.test(text);
  if (coachy || (!b.time && !b.goal && !b.kit)){
    for (const t of TRAITS){ t.re.lastIndex=0; let m; while((m=t.re.exec(text))){ if (spans.some(s=>m.index<s.end&&m.index+m[0].length>s.start)) continue; spans.push({start:m.index,end:m.index+m[0].length,type:t.c}); traits.push({slot:t.slot,c:t.c,v:m[1]}); } }
  }
  const hurtWords = /\b(hurts?|hurting|pain|injur|tweaked|pulled|sprain|twinge)/i.test(text);
  if (pref && !b.time) intent = 'prefs';
  else if (coachy && traits.length) intent = 'coach';
  else if (hurtWords && !b.time && !b.goal && !b.kit) intent = 'hurt';
  else if (b.time || b.goal || b.kit || b.mood || b.coach || b.limits.length || /\b(workout|session|train|sweat)\b/i.test(text)) intent = 'build';
  else if (traits.length >= 2) intent = 'coach';
  spans.sort((a,b)=>a.start-b.start);
  return {spans, b, intent, pref, traits};
}

/* ================= plan builder ================= */
function effective(p){
  const m = S.manual, b = p ? p.b : {limits:[]};
  // health.md's limits always apply; what's said today can only add or tighten, never loosen
  const base = PROFILE.limits.map(x=>Object.assign({},x,{trend:'same'}));
  let lim = m.limit !== undefined ? m.limit : base.slice();
  if (m.limit === undefined) b.limits.forEach(l=>{ const i = lim.findIndex(x=>x.area===l.area); if (i>=0) lim[i] = Object.assign({}, lim[i], {trend:l.trend||'sore today', level: l.level==='off-limits'?'off-limits':lim[i].level}); else lim.push(Object.assign({}, l, {trend:l.trend||'sore today'})); });
  return {
    minutes: m.time || b.time || PROFILE.minutes,
    goal:    m.goal || b.goal || PROFILE.goal,
    kit:     m.kit || b.kit || PROFILE.kit,
    coach:   m.coach || b.coach || S.current,
    mood:    m.mood || b.mood || PROFILE.mood,
    limits:  lim,
    said: {time:!!(m.time||b.time), goal:!!(m.goal||b.goal), kit:!!(m.kit||b.kit), coach:!!(m.coach||b.coach), mood:!!(m.mood||b.mood), limit: m.limit!==undefined || b.limits.length>0},
    rawLimits: lim
  };
}
function allowed(mv, e){
  const kit = KITS[e.kit].has;
  if (!mv.k.some(x=>kit.includes(x))) return {ok:false, why:'not in this kit'};
  for (const l of e.limits){
    const area = l.area==='lower back' ? 'back' : l.area;
    const load = mv.l[area] || 0;
    if (l.level==='off-limits' && load>=1) return {ok:false, why:l.area+' is off-limits'};
    if (load>=2 || (mv.imp && (load>=1 || ['knee','ankle','hip','lower back'].includes(l.area)))) return {ok:false, why:'too much for your '+l.area};
  }
  return {ok:true};
}
function menu(e){ return MOVES.filter(m=>allowed(m,e).ok); }
function pick(pattern, e, used){
  const c = menu(e).filter(m=>m.p===pattern && !used.has(m.id));
  if (!c.length) return null;
  // prefer heavier tools when the kit has them
  c.sort((a,b)=> (b.k[0]!=='bw') - (a.k[0]!=='bw'));
  return c[0];
}
function buildPlan(e){
  const total = e.minutes*60, blocks = [], used = new Set();
  const warm = Math.round(total*0.14/5)*5, cool = Math.round(total*0.1/5)*5;
  const hasFin = e.minutes>=20 && e.goal!=='Mobility and breathing';
  const fin = hasFin ? Math.round(total*0.12/5)*5 : 0;
  const main = total - warm - cool - fin;
  blocks.push({type:'warm', sec:warm, name:'Warm-up', moves:['hip-circles','cat-cow','worlds'].filter(id=>allowed(MOVES.find(m=>m.id===id),e).ok)});
  const pats = {
    'Strength':['squat','push','hinge','pull','core','squat','push'],
    'General fitness':['squat','cond','push','hinge','cond','pull','core'],
    'Conditioning':['cond','squat','cond','push','cond','core','cond'],
    'Mobility and breathing':['mob','mob','core','mob','mob','core','mob']
  }[e.goal];
  let n = Math.max(3, Math.min(7, Math.floor(main/150)));
  if (e.mood==='low' || e.mood==='hard') n = Math.max(3, n-1);
  const share = e.mood==='low' ? .58 : e.mood==='fresh' ? .74 : e.mood==='hard' ? .6 : .68;
  const per = main / n;
  let acc = 0, ti = 0;
  for (let i=0;i<n;i++){
    let mv = pick(pats[i % pats.length], e, used) || pick('core', e, used) || pick('mob', e, used);
    if (!mv) mv = MOVES.find(m=>m.id==='box-breath');
    used.add(mv.id);
    const w = Math.round(per*share/5)*5;
    let r = Math.round(per/5)*5 - w;
    if (i===n-1) r = main - acc - w;
    acc += w + r;
    blocks.push({type:'work', sec:w, move:mv.id, name:mv.n});
    if (r>0) blocks.push({type:'rest', sec:r, topic:TOPICS[ti++ % TOPICS.length]});
  }
  if (hasFin){
    const fm = pick(e.goal==='Strength' ? 'cond' : 'core', e, used) || pick('cond', e, used) || MOVES.find(m=>m.id==='dead-bug');
    used.add(fm.id);
    blocks.push({type:'fin', sec:fin, move:fm.id, name:fm.n});
  }
  blocks.push({type:'cool', sec:cool, name:'Cool-down', moves:['thoracic','box-breath']});
  return blocks;
}
const sig = e => JSON.stringify([e.minutes,e.goal,e.kit,e.mood,e.limits.map(l=>l.area+l.level)]);
function ensurePlan(e){
  const s = sig(e);
  if (s !== S.planSig){ S.plan = buildPlan(e); S.planSig = s; S.sel = null; return true; }
  return false;
}

function slotOptions(e){

  let q='', o='';

  if (s==='goal'){ q='What kind of session?'; o=GOALS.map(g=>opt(g,g,e.goal===g)).join(''); }
  if (s==='kit'){ q='What have you got?'; o=Object.keys(KITS).map(k=>opt(k,KITS[k].label,e.kit===k)).join(''); }
  if (s==='mood'){ q='How are you coming in today?'; o=Object.keys(MOODS).map(k=>opt(k,MOODS[k],e.mood===k)).join(''); }

  return `<div class="opts"><span class="q">${q}</span>${o}</div>`;
}

function startRender(p){
  const e = effective(p && p.intent==='build' ? p : null);
  ensurePlan(e);
  S.render = {e, stage:0, pct:0, overall:0, done:false};
  S.manual = {}; S.playT = 0; S.playing = false;
  say('agent', `<p>On it: ${e.minutes} min ${esc(e.goal.toLowerCase())}, ${esc(KITS[e.kit].label.toLowerCase())}, with ${esc(e.coach)}.</p><p>Your script goes to ${esc(e.coach)}'s voice service. About six minutes; you can close the tab.</p>`);
  go('render');
  clearInterval(S.timer);
  S.timer = setInterval(()=>{
    const r = S.render; if (!r) return;
    r.pct += r.stage===3 ? 4 : 9;
    if (r.pct>=100){ r.stage++; r.pct=0; }
    r.overall = Math.min(100, ((r.stage*100 + r.pct)/400)*100);
    if (r.stage>=4){
      clearInterval(S.timer); r.done = true;
      say('agent','<p>Done. Press play on the right, or download it. It\'s kept for 24 hours.</p>');
      toast('Your workout is ready');
    }
    if (S.view==='render') renderView();
  }, 160);
}
function positionPlayhead(){
  const ph = $('#ph'), lane = $('#lane'); if (!ph||!lane||!S.render||!S.render.done) return;
  const total = S.plan.reduce((a,b)=>a+b.sec,0);
  ph.style.display = 'block';
  ph.style.left = (S.playT/total*lane.offsetWidth)+'px';
  ph.style.bottom = lane.parentElement.querySelector('.body-lane') ? '0' : '0';
  const cur = blockAt(S.playT); const idx = S.plan.indexOf(cur.b);
  lane.querySelectorAll('.blk').forEach((el,i)=>el.classList.toggle('sel', i===idx));
}
function togglePlay(){
  S.playing = !S.playing;
  clearInterval(S.playTimer);
  if (S.playing){
    const total = S.plan.reduce((a,b)=>a+b.sec,0);
    S.playTimer = setInterval(()=>{
      S.playT += 6; if (S.playT>=total){ S.playT = total; S.playing=false; clearInterval(S.playTimer); renderView(); return; }
      const n = $('#nowName'), t = $('#nowTime');
      if (n){ n.textContent = blockAt(S.playT).label; t.textContent = mmss(S.playT)+' of '+mmss(total); }
      positionPlayhead();
    }, 100);
  }
  renderView();
}

/* ================= drag to resize ================= */
let drag = null;
document.addEventListener('pointerdown', ev=>{
  const g = ev.target.closest('[data-grip]'); if (!g) return;
  ev.preventDefault(); ev.stopPropagation();
  const i = +g.dataset.grip, lane = $('#lane');
  const total = S.plan.reduce((a,b)=>a+b.sec,0);
  drag = {i, x:ev.clientX, a:S.plan[i].sec, b:S.plan[i+1].sec, pps: lane.offsetWidth/total, g};
  g.classList.add('drag'); g.setPointerCapture && g.setPointerCapture(ev.pointerId);
});
document.addEventListener('pointermove', ev=>{
  if (!drag) return;
  let d = Math.round(((ev.clientX - drag.x)/drag.pps)/5)*5;
  d = Math.max(10-drag.a, Math.min(drag.b-10, d));
  S.plan[drag.i].sec = drag.a + d; S.plan[drag.i+1].sec = drag.b - d;
  const total = S.plan.reduce((a,b)=>a+b.sec,0);
  const blks = document.querySelectorAll('#lane .blk');
  [drag.i, drag.i+1].forEach(k=>{ const el = blks[k]; if (!el) return; el.style.width = `calc(${S.plan[k].sec/total*100}% - 2px)`; const bs = el.querySelector('.bs'); if (bs) bs.textContent = mmss(S.plan[k].sec); });
});
document.addEventListener('pointerup', ()=>{ if (drag){ const i = drag.i; drag = null; S.justDragged = true; setTimeout(()=>S.justDragged=false, 50); S.sel = i; renderView(); } });

/* ================= clicks (delegated) ================= */
document.addEventListener('click', ev=>{
  const t = ev.target.closest('button,[data-go],label.flag'); if (!t) return;
  const d = t.dataset;
  if (d.pane){ setPane(d.pane); return; }
  if (d.act==='palette') return openPalette();
  if (d.act==='home'){ S.manual={}; input.value=''; paintComposer(); return go('home'); }
  if (d.go){ if (d.go==='build'){ S.manual={}; setText(''); go('build'); say('agent','<p>Here\'s your usual, built from your profile. Type to change anything, or tap a part.</p>'); } else if (d.go==='coaches'){ go('coaches'); } else { if (d.go==='hurt') S.hurt={area:null,side:null,sev:null,span:null,flags:[]}; go(d.go); } setPane('canvas'); return; }
  if (d.try){ setPane('canvas'); typeOut(d.try); return; }
  if (d.fb){ S.feedback[d.fb] = d.r; say('agent','<p>Thanks. Noted “'+esc(d.r)+'” for that one.</p>'); renderView(); return; }
  if (d.slot){ S.openSlot = S.openSlot===d.slot ? null : d.slot; S.live=false; renderView(); return; }
  if (d.set){
    const e = effective(P);
    if (d.set==='time') S.manual.time = +d.v;
    else if (d.set==='limit'){ S.manual.limit = d.v==='none' ? PROFILE.limits.map(x=>Object.assign({},x,{trend:'same'})) : [{area:'knee',side:'left',level:'delicate',trend:d.v.split(':')[1]}]; }
    else S.manual[d.set] = d.v;
    S.openSlot = null; renderView();
    if (d.set==='limit' || d.set==='kit') document.querySelectorAll('#lane .blk').forEach(b=>b.classList.add('flash'));
    return;
  }
  if (d.blk!==undefined && !S.justDragged){ if (S.view!=='build') return; S.sel = S.sel===+d.blk ? null : +d.blk; S.live=false; renderView(); return; }
  if (d.swap){ const b = S.plan[S.sel]; const m = MOVES.find(x=>x.id===d.swap); b.move = m.id; b.name = m.n; toast('Swapped in '+m.n); renderView(); return; }
  if (d.topic){ S.plan[S.sel].topic = d.topic; renderView(); return; }
  if (d.act==='go'){ const p = P, t = input.value.trim(); if (t){ userEcho(t); input.value=''; paintComposer(); } startRender(p); return; }
  if (d.act==='play') return togglePlay();
  if (d.act==='download'){ toast('Downloading 2026-10-27-'+S.render.e.goal.split(' ')[0].toLowerCase()+'-'+S.render.e.minutes+'.mp3'); return; }
  if (d.act==='audition'){ S.coachDesc = input.value; userEcho(input.value); input.value=''; paintComposer(); audition(); return; }
  if (d.play){ S.coach.playing = S.coach.playing===d.play ? null : d.play; renderView(); clearTimeout(S.wt); if (S.coach.playing) S.wt=setTimeout(()=>{S.coach.playing=null; S.view==='coach'&&renderView();},4000); return; }
  if (d.pick){ S.coach.picked = d.pick; S.coach.nameErr=''; renderView(); const n=$('#cname'); n&&n.focus(); return; }
  if (d.cname){ $('#cname').value = d.cname; return; }
  if (d.act==='keep'){
    const n = ($('#cname').value||'').trim();
    if (!/^coach \w+/i.test(n)){ S.coach.nameErr = 'Give them a person\'s name, like “Coach Hale”.'; return renderView(); }
    if (S.stable.some(c=>c.name.toLowerCase()===n.toLowerCase())){ S.coach.nameErr = n+' is taken. Pick another name.'; return renderView(); }
    S.stable.push({name:n, line:(S.coachDesc||'Your own coach').replace(/^a new coach:?\s*/i,''), col:'#3F7F17'});
    S.current = n; S.coach.kept = n;
    say('agent','<p>Kept candidate '+S.coach.picked+' as <b>'+esc(n)+'</b>, saved in your voice account. They\'ll coach your next workout.</p>');
    renderView(); return;
  }
  if (d.act==='build-with'){ S.coach = {cands:null}; S.manual={coach:S.current}; go('build'); return; }
  if (d.act==='newcoach'){ S.coach = {cands:null}; go('coach'); setText('a new coach: '); return; }
  if (d.use){ S.current = d.use; toast(d.use+' will coach your next workout'); renderView(); return; }
  if (d.untag){ S.prefs[d.untag].splice(+d.i,1); renderView(); checkMsg(); return; }
  if (d.addtag){ const v = prompt('Add to '+d.addtag); if (v){ S.prefs[d.addtag].push(v.trim()); S.hot=d.addtag+':'+v.trim(); renderView(); checkMsg(); } return; }
  if (d.toast){ toast(d.toast); return; }
  if (d.area){ S.hurt.area = d.area; S.hurt.side = ['neck','lower back'].includes(d.area)?null:S.hurt.side; renderView(); return; }
  if (d.side){ S.hurt.side = d.side; renderView(); return; }
  if (d.sev){ S.hurt.sev = d.sev; renderView(); return; }
  if (d.span){ S.hurt.span = d.span; renderView(); if (d.span==='lasting') say('agent','<p>Saved to your health notes, with your OK. It stays until you tell me it\'s better.</p>'); return; }
  if (d.unflag!==undefined){ S.hurt.flags=[]; renderView(); return; }
  if (d.act==='hurt-build'){ const h=S.hurt; S.manual={limit:[{area:h.area,side:h.side&&h.side!=='both'?h.side:'',level:h.sev==='cant'?'off-limits':'delicate',trend:''}]}; go('build'); return; }
});
document.addEventListener('change', ev=>{
  const f = ev.target.dataset && ev.target.dataset.flag;
  if (f){ if (ev.target.checked){ S.hurt.flags=[f]; say('agent','<p><b>Stop.</b> That\'s a red flag. Please get it looked at by a clinician before training on it.</p>'); renderView(); } }
});
document.addEventListener('focusout', ev=>{
  const k = ev.target.dataset && ev.target.dataset.val;
  if (k){ const v = ev.target.textContent.trim(); if (v && v!==S.prefs[k]){ S.prefs[k]=v; checkMsg(); toast('Saved'); } }
});
document.addEventListener('keydown', ev=>{
  if (ev.target.dataset && ev.target.dataset.val && ev.key==='Enter'){ ev.preventDefault(); ev.target.blur(); }
});
function checkMsg(){ const c=$('#checkmsg'); if(c){ c.textContent='Checking…'; setTimeout(()=>{ c.textContent='Checked: nothing to fill in.'; },500);} }

/* ================= dictation (simulated) ================= */
let typing = null;
function typeOut(text, cb){
  clearInterval(typing); input.value=''; paintComposer(); input.focus();
  let i=0; typing = setInterval(()=>{ input.value = text.slice(0, ++i); paintComposer(); if (i>=text.length){ clearInterval(typing); typing=null; cb&&cb(); } }, 26);
}
$('#mic').addEventListener('click', ()=>{
  const f = $('#field');
  if (f.classList.contains('listening')) return;
  f.classList.add('listening'); input.placeholder='Listening…';
  setTimeout(()=>typeOut('thirty minutes at home, shoulder\'s a bit stiff, feeling fresh', ()=>{ f.classList.remove('listening'); input.placeholder='25 minutes, hotel room, knee\'s a bit sore…  or type / to jump'; }), 600);
});

/* ================= palette ================= */
const CMDS = [
  ['Build a workout','build','B'],['Build my usual, right now','usual',''],['Edit my stuff (About me)','prefs','E'],['Something hurts','hurt','H'],
  ['Coaches','coaches','C'],['Make a new coach','newcoach',''],['Analytics','stats','A'],['Show me around','tour','T'],['Home','home','']
];
let palSel = 0;
function openPalette(){ $('#palBack').classList.add('on'); const i=$('#palIn'); i.value=''; palSel=0; drawPal(); i.focus(); }
function closePalette(){ $('#palBack').classList.remove('on'); }
function palItems(){ const q=$('#palIn').value.toLowerCase(); return CMDS.filter(c=>c[0].toLowerCase().includes(q)); }
function drawPal(){ const it=palItems(); palSel=Math.min(palSel,Math.max(0,it.length-1)); $('#palList').innerHTML = it.map((c,i)=>`<li class="${i===palSel?'on':''}" data-cmd="${c[1]}"><b>${c[0]}</b>${c[2]?'<span class="kbd">'+c[2]+'</span>':''}</li>`).join('') || '<li><small>Nothing matches. Type it in the box instead.</small></li>'; }
function runCmd(c){
  closePalette();
  if (c==='usual'){ S.manual={}; setText(''); go('build'); startRender(); return; }
  if (c==='newcoach'){ S.coach={cands:null}; go('coach'); setText('a new coach: '); return; }
  if (c==='home'){ go('home'); return; }
  const b = document.createElement('button'); b.dataset.go=c; document.body.appendChild(b); b.click(); b.remove();
}
$('#palIn').addEventListener('input', drawPal);
$('#palIn').addEventListener('keydown', e=>{
  const it = palItems();
  if (e.key==='ArrowDown'){ palSel=(palSel+1)%Math.max(1,it.length); drawPal(); e.preventDefault(); }
  if (e.key==='ArrowUp'){ palSel=(palSel-1+it.length)%Math.max(1,it.length); drawPal(); e.preventDefault(); }
  if (e.key==='Enter' && it[palSel]) runCmd(it[palSel][1]);
  if (e.key==='Escape') closePalette();
});
$('#palList').addEventListener('click', e=>{ const li=e.target.closest('li[data-cmd]'); li && runCmd(li.dataset.cmd); });
$('#palBack').addEventListener('click', e=>{ if (e.target.id==='palBack') closePalette(); });
document.addEventListener('keydown', e=>{
  if ((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); openPalette(); return; }
  if (e.key==='Escape') closePalette();
  const tag = (e.target.tagName||'').toLowerCase();
  if (tag==='input'||tag==='textarea'||e.target.isContentEditable||e.metaKey||e.ctrlKey||e.altKey) return;
  if (e.key==='/'){ e.preventDefault(); openPalette(); return; }
  if (S.view==='home'){ const m = {b:'build',e:'prefs',h:'hurt',c:'coaches',t:'tour',a:'stats'}[e.key.toLowerCase()]; if (m){ e.preventDefault(); runCmd(m); } }
  if (S.view==='build' && e.key==='Enter' && tag!=='button'){ e.preventDefault(); startRender(P); }
});

/* ================= misc ================= */
function setPane(p){
  $('#app').dataset.pane = p;
  document.querySelectorAll('.viewtoggle button').forEach(b=>b.classList.toggle('on', b.dataset.pane===p));
}
let tt; function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),2400); }
window.addEventListener('resize', ()=>{ if (S.view==='render') positionPlayhead(); });

/* ================= boot ================= */
say('agent','<p>Morning, Jordan. Last time was Thursday: strength, 25 minutes, with Coach Reed.</p><p>Say what you want in the box below. It takes shape on the right as you type, and <span class="kbd">Enter</span> makes it.</p>');
paintComposer();
renderView(true);
})();
</script>
</body>
