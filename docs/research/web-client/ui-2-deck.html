<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweatcast · The Deck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --table:#D7DEE6;
  --table-dot:#C3CCD7;
  --rail:#F6F7F9;
  --rail-line:#E1E5EA;
  --card:#FFFFFF;
  --card-edge:#CBD3DD;
  --ink:#18202C;
  --ink-2:#4A5568;
  --ink-3:#7A8697;
  --on-ink:#FFFFFF;
  --chip:#EEF1F5;
  --chip-on:#18202C;
  --strength:#D8402F;
  --conditioning:#E39A00;
  --mobility:#1E8C6E;
  --general:#3E4FC9;
  --new:#9A3FB5;
  --like:#1E8C6E;
  --nope:#C2372A;
  --stop-bg:#FFF1EE;
  --stop-ink:#8E2318;
  --shadow:0 1px 0 var(--card-edge), 0 10px 24px -14px rgba(24,32,44,.45);
  --radius-card:18px;
  --radius-chip:999px;
  --display:"Bricolage Grotesque", "Arial Narrow", sans-serif;
  --body:"Instrument Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --table:#151B24;
    --table-dot:#212A36;
    --rail:#1C232E;
    --rail-line:#2A3340;
    --card:#232C39;
    --card-edge:#344052;
    --ink:#EDF1F6;
    --ink-2:#B4BECB;
    --ink-3:#8392A5;
    --on-ink:#151B24;
    --chip:#2C3644;
    --chip-on:#EDF1F6;
    --strength:#F0604F;
    --conditioning:#F2B233;
    --mobility:#3DBB95;
    --general:#7A88F0;
    --new:#C77BE0;
    --like:#3DBB95;
    --nope:#F0604F;
    --stop-bg:#3A1F1C;
    --stop-ink:#FFC7BE;
    --shadow:0 1px 0 #0d1218, 0 12px 26px -14px rgba(0,0,0,.8);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--table);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--general);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);height:100vh;height:100dvh}

/* ---------- the rail (chat) ---------- */
.rail{background:var(--rail);border-right:1px solid var(--rail-line);display:flex;flex-direction:column;min-height:0}
.rail-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--rail-line)}
.mark{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;font-stretch:80%}
.rail-head .who{margin-left:auto;font-size:13px;color:var(--ink-3)}
.rail-toggle{display:none}
.log{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:92%;font-size:14.5px}
.msg.agent{align-self:flex-start}
.msg.agent p{margin:0 0 4px}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--on-ink);padding:8px 13px;border-radius:16px 16px 4px 16px}
.msg .note{display:inline-flex;gap:6px;align-items:center;margin-top:4px;font-size:12.5px;color:var(--ink-2);background:var(--chip);border-radius:8px;padding:3px 8px}
.msg .note b{font-weight:600;color:var(--ink)}
.compose{padding:12px;border-top:1px solid var(--rail-line);display:flex;gap:8px}
.compose input{flex:1;min-width:0;font:inherit;padding:11px 14px;border-radius:12px;border:1px solid var(--rail-line);background:var(--card);color:var(--ink)}
.compose button{border:0;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:0 14px;font-weight:600}
.hints{display:flex;gap:6px;flex-wrap:wrap;padding:0 12px 12px}
.hints button{border:1px dashed var(--card-edge);background:none;border-radius:var(--radius-chip);padding:4px 10px;font-size:12.5px;color:var(--ink-2)}

/* ---------- the table (panel) ---------- */
.table{position:relative;overflow-y:auto;min-height:0;
  background-image:radial-gradient(var(--table-dot) 1px, transparent 1.2px);background-size:18px 18px}
.table-inner{max-width:1040px;margin:0 auto;padding:28px 28px 90px}
.crumbs{display:flex;align-items:center;gap:10px;margin-bottom:18px;min-height:32px}
.back{border:0;background:var(--card);border-radius:10px;padding:6px 12px;box-shadow:var(--shadow);font-size:13.5px}
h1.say{font-family:var(--display);font-weight:700;font-stretch:85%;font-size:clamp(28px,4.2vw,44px);line-height:1.02;letter-spacing:-.025em;margin:0 0 6px}
.sub{color:var(--ink-2);margin:0 0 22px;max-width:60ch}

/* the hand */
.hand{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start;perspective:1400px}
.hand .slot{transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .25s}
.hand:not(.focus) .slot:nth-child(1){transform:rotate(-2.2deg) translateY(8px)}
.hand:not(.focus) .slot:nth-child(2){transform:rotate(-.7deg)}
.hand:not(.focus) .slot:nth-child(3){transform:rotate(.7deg)}
.hand:not(.focus) .slot:nth-child(4){transform:rotate(2.2deg) translateY(8px)}
.hand:not(.focus) .slot:hover{transform:translateY(-6px) rotate(0)}
.hand.focus{grid-template-columns:1fr}
.hand.focus .slot:not(.on){display:none}
.dealing .slot{animation:deal .5s cubic-bezier(.2,.9,.25,1.1) backwards}
.dealing .slot:nth-child(2){animation-delay:.06s}.dealing .slot:nth-child(3){animation-delay:.12s}.dealing .slot:nth-child(4){animation-delay:.18s}
@keyframes deal{from{opacity:0;transform:translate(-40px,60px) rotate(-12deg)}}

.card{position:relative;display:grid;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow);overflow:hidden}
.face.back{transform:rotateY(180deg)}
.front{display:flex;flex-direction:column;min-height:300px;text-align:left;border:0;padding:0;width:100%}
.suit{height:8px;background:var(--suit)}
.front .body{padding:14px 16px 0;flex:1;display:flex;flex-direction:column}
.kind{font-size:12.5px;font-weight:600;color:var(--suit);display:flex;align-items:center;gap:6px}
.kind::before{content:"";width:9px;height:9px;border-radius:2px;background:var(--suit);transform:rotate(45deg)}
.mins{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:84px;line-height:.9;letter-spacing:-.04em;margin:10px 0 2px;display:flex;align-items:baseline;gap:4px}
.mins small{font-size:17px;font-weight:600;font-stretch:100%;letter-spacing:0;color:var(--ink-3)}
.title{font-family:var(--display);font-weight:700;font-size:19px;line-height:1.15;letter-spacing:-.01em;margin:4px 0 6px}
.why{font-size:13px;color:var(--ink-2);line-height:1.4;margin:0}
.foot{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 12px 16px;align-items:center;margin-top:auto}
.foot .kit{font-size:12px;color:var(--ink-3);width:100%;margin-bottom:2px}
.foot .go{margin-left:auto}
.tweak{border:1px solid var(--card-edge);background:none;border-radius:10px;padding:6px 10px;font-size:13px}
.go{border:0;background:var(--ink);color:var(--on-ink);border-radius:10px;padding:7px 14px;font-weight:600;font-size:13.5px}
.new-badge{margin-left:6px;white-space:nowrap;font-size:11.5px;font-weight:600;background:var(--chip);border-radius:6px;padding:2px 7px;color:var(--ink-2)}
.slot.edited .face.front{outline:2px solid var(--suit);outline-offset:3px}

/* back of card */
.back-in{padding:18px 20px 20px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px 28px}
.back-in h3{font-family:var(--display);font-weight:700;font-size:22px;margin:0;grid-column:1/-1;display:flex;align-items:center;gap:10px}
.back-in h3 .kind{font-family:var(--body)}
.row{display:flex;flex-direction:column;gap:8px}
.row > label, .row > .lab{font-size:13px;font-weight:600;color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid transparent;background:var(--chip);border-radius:var(--radius-chip);padding:7px 13px;font-size:13.5px;line-height:1.2}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--on-ink)}
.chip.out[aria-pressed="true"]{background:var(--nope);color:#fff}
.back-actions{grid-column:1/-1;display:flex;gap:10px;justify-content:flex-end;align-items:center}
.back-actions .delta{margin-right:auto;font-size:13px;color:var(--ink-3)}

/* scrubber */
.scrub{position:relative;user-select:none;touch-action:none}
.scrub .big{font-family:var(--display);font-weight:800;font-stretch:75%;font-size:72px;line-height:.9;letter-spacing:-.04em;display:flex;align-items:baseline;gap:4px}
.scrub .big small{font-size:16px;font-stretch:100%;font-weight:600;color:var(--ink-3);letter-spacing:0}
.ticks{position:relative;height:44px;margin-top:8px;border-radius:10px;background:var(--chip);cursor:ew-resize;overflow:hidden}
.ticks .fill{position:absolute;inset:0 auto 0 0;background:var(--suit);opacity:.22}
.ticks .t{position:absolute;bottom:0;width:1px;background:var(--ink-3);opacity:.6}
.ticks .knob{position:absolute;top:4px;bottom:4px;width:6px;border-radius:3px;background:var(--suit);transform:translateX(-3px)}
.ticks .lbl{position:absolute;top:4px;font-size:10.5px;color:var(--ink-3);transform:translateX(-50%)}
.scrub-hint{font-size:12px;color:var(--ink-3)}

/* doors */
.doors{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.door{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px;display:flex;gap:8px;align-items:center}
.door .pip{width:8px;height:8px;border-radius:50%;background:var(--pipc,var(--ink-3))}
.deck-tools{display:flex;gap:8px;align-items:center;margin:-8px 0 18px;flex-wrap:wrap}
.deck-tools .shuffle{border:1px solid var(--card-edge);background:none;border-radius:10px;padding:6px 12px;font-size:13px}
.deck-tools .why-all{font-size:13px;color:var(--ink-3)}

/* nudge */
.nudge{margin-top:22px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.nudge .stack{position:relative;width:46px;height:40px;flex:none}
.nudge .stack span{position:absolute;width:30px;height:38px;border-radius:5px;background:var(--chip);border:1px solid var(--card-edge)}
.nudge .stack span:nth-child(1){left:0;transform:rotate(-8deg)}
.nudge .stack span:nth-child(2){left:12px;transform:rotate(6deg);background:var(--card)}
.nudge p{margin:0;flex:1;min-width:180px}
.nudge p b{font-family:var(--display);font-size:17px}

/* feedback mini-cards */
.minis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mini{background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow);overflow:hidden;transition:transform .4s,opacity .4s}
.mini .in{padding:14px 16px}
.mini h4{font-family:var(--display);font-size:19px;margin:6px 0 2px}
.mini .meta{font-size:13px;color:var(--ink-3);margin:0 0 12px}
.mini.gone{transform:translateX(60px) rotate(6deg);opacity:0}

/* big taps (check-in) */
.q{margin-bottom:26px}
.q h2{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.01em;margin:0 0 10px}
.taps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tap{border:2px solid transparent;background:var(--card);box-shadow:var(--shadow);border-radius:14px;padding:16px;text-align:left;min-height:76px;display:flex;flex-direction:column;gap:2px}
.tap b{font-family:var(--display);font-size:19px;font-weight:700}
.tap span{font-size:13px;color:var(--ink-2)}
.tap[aria-pressed="true"]{border-color:var(--ink)}
.tap.rec::after{content:"usual";align-self:flex-start;margin-top:4px;font-size:11px;font-weight:600;color:var(--ink-3);background:var(--chip);border-radius:5px;padding:1px 6px}
.limitrow{display:grid;grid-template-columns:minmax(0,150px) 1fr;gap:10px;align-items:center;margin-bottom:10px}
.limitrow .area{font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:12px 6px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.timer{height:4px;background:var(--chip);border-radius:2px;overflow:hidden;margin:-10px 0 24px;max-width:340px}
.timer i{display:block;height:100%;width:0;background:var(--ink);transition:width .3s}

/* the played card (plan, render, done) */
.played{display:grid;grid-template-columns:minmax(220px,300px) 1fr;gap:28px;align-items:start}
.played .card{pointer-events:none}
.played .foot button{display:none}
.plan{background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow);overflow:hidden}
.plan table{width:100%;border-collapse:collapse;font-size:14px}
.plan th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:12px 16px 8px}
.plan td{padding:10px 16px;border-top:1px solid var(--rail-line);vertical-align:top}
.plan td:first-child{font-weight:600;white-space:nowrap}
.plan td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.plan .notes{padding:12px 16px;border-top:1px solid var(--rail-line);font-size:13.5px;color:var(--ink-2);display:grid;gap:4px}
.timeline{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:14px 16px 4px;gap:2px}
.timeline span{display:block;height:100%}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.btn{border:0;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:12px 18px;font-weight:600}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.small{font-size:13px;color:var(--ink-3)}

.stages{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.stage{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;opacity:.55}
.stage.now,.stage.done{opacity:1}
.stage .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--card-edge);display:grid;place-items:center;font-size:12px}
.stage.now .dot{border-color:var(--suit);border-top-color:transparent;animation:spin 1s linear infinite}
.stage.done .dot{background:var(--suit);border-color:var(--suit);color:#fff}
.stage b{display:block}
.stage span{font-size:13px;color:var(--ink-2)}
.stage .pct{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-3)}
@keyframes spin{to{transform:rotate(360deg)}}
.leave{margin-top:14px;padding:12px 14px;border-radius:12px;background:var(--chip);font-size:13.5px}

.player{background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:18px}
.wave{display:flex;align-items:center;gap:2px;height:64px;margin:12px 0;cursor:pointer}
.wave i{flex:1;background:var(--card-edge);border-radius:2px}
.wave i.on{background:var(--suit)}
.prow{display:flex;align-items:center;gap:12px}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;flex:none}
.prow .time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--ink-2)}
.expiry{display:flex;gap:10px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:13.5px}
.expiry .clock{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}

/* coaches */
.coaches{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.coach{background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:6px;position:relative}
.coach h4{font-family:var(--display);font-size:20px;margin:0}
.coach p{margin:0;font-size:13px;color:var(--ink-2)}
.coach .bars{display:flex;gap:2px;height:22px;align-items:center;margin:6px 0}
.coach .bars i{flex:1;background:var(--card-edge);border-radius:1px}
.coach.playing .bars i{background:var(--suit);animation:bounce .7s ease-in-out infinite alternate}
@keyframes bounce{to{transform:scaleY(.35)}}
.coach .cur{position:absolute;top:14px;right:14px;font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--ink);color:var(--on-ink)}
.coach .cbtns{display:flex;gap:6px;margin-top:auto;padding-top:8px}
.coach.make{border:2px dashed var(--card-edge);background:transparent;box-shadow:none;align-items:flex-start;justify-content:center;text-align:left;min-height:170px}

/* voice pad */
.studio{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:26px;align-items:start}
.pad{position:relative;aspect-ratio:1;max-width:420px;width:100%;border-radius:22px;background:
  linear-gradient(90deg, color-mix(in srgb, var(--mobility) 28%, transparent), color-mix(in srgb, var(--strength) 30%, transparent)),
  var(--card);box-shadow:var(--shadow);touch-action:none;cursor:crosshair;overflow:hidden}
.pad::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg, color-mix(in srgb, var(--general) 25%, transparent), transparent 60%)}
.pad .ax{position:absolute;font-size:12.5px;font-weight:600;color:var(--ink-2);pointer-events:none}
.pad .gridl{position:absolute;background:var(--card-edge);opacity:.7;pointer-events:none}
.puck{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 6px color-mix(in srgb, var(--ink) 18%, transparent);display:grid;place-items:center;color:var(--on-ink);font-size:11px;font-weight:700;transition:left .15s,top .15s}
.pad.drag .puck{transition:none}
.readout{font-family:var(--display);font-size:22px;font-weight:700;line-height:1.2;margin:4px 0 14px;min-height:54px}
.aud{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.aud .coach{min-height:200px}
.letter{font-family:var(--display);font-weight:800;font-size:52px;line-height:.9;font-stretch:75%}
.coach.kept{outline:3px solid var(--like);outline-offset:2px}
.namebox{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.namebox input{font:600 22px var(--display);padding:12px 14px;border-radius:12px;border:1px solid var(--card-edge);background:var(--card);color:var(--ink);min-width:0;flex:1 1 220px}

/* prefs */
.tabs{display:flex;gap:4px;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:4px;margin-bottom:22px;max-width:520px;overflow-x:auto}
.tabs button{border:0;background:none;border-radius:9px;padding:9px 14px;font-weight:600;white-space:nowrap;flex:1}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--on-ink)}
.judge{display:flex;flex-wrap:wrap;gap:8px}
.jchip{border:1px solid var(--card-edge);background:var(--card);border-radius:var(--radius-chip);padding:8px 14px;font-size:14px;display:inline-flex;gap:8px;align-items:center}
.jchip .s{width:16px;text-align:center;font-weight:700}
.jchip[data-v="1"]{background:var(--like);border-color:var(--like);color:#fff}
.jchip[data-v="-1"]{background:var(--nope);border-color:var(--nope);color:#fff;text-decoration:line-through}
.legend{font-size:13px;color:var(--ink-3);margin:-10px 0 16px}
.kits{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.kitcard{background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:16px}
.kitcard h4{font-family:var(--display);font-size:20px;margin:0 0 10px}
.check{margin-top:18px;font-size:13.5px;color:var(--ink-2);display:flex;gap:8px;align-items:center}
.check::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--like)}

/* hurt */
.areas{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.stop{background:var(--stop-bg);color:var(--stop-ink);border-radius:var(--radius-card);padding:22px;border-left:8px solid var(--nope)}
.stop h2{font-family:var(--display);font-size:28px;margin:0 0 8px;line-height:1.1}
.stop p{margin:0 0 10px;max-width:58ch}
.stop .btn{background:var(--stop-ink);color:var(--stop-bg)}

/* analytics */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.panel-card{background:var(--card);border-radius:var(--radius-card);box-shadow:var(--shadow);padding:16px}
.panel-card h4{margin:0 0 10px;font-family:var(--display);font-size:18px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week div{aspect-ratio:1;border-radius:8px;background:var(--chip);display:grid;place-items:end center;font-size:11px;color:var(--ink-3);padding-bottom:3px}
.week div.s{background:var(--suit)} .week div.s{color:#fff}
.bar{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin-bottom:6px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--chip);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--general)}
.bar.low i b{background:var(--conditioning)}

/* tour */
.tour{position:fixed;inset:0;background:rgba(10,14,20,.55);display:grid;place-items:center;z-index:40;padding:16px}
.tour .tcard{background:var(--card);border-radius:22px;max-width:420px;width:100%;padding:24px;box-shadow:var(--shadow)}
.tour .tnum{font-family:var(--display);font-weight:800;font-size:64px;line-height:.85;font-stretch:75%;color:var(--suit)}
.tour h3{font-family:var(--display);font-size:24px;margin:8px 0 6px}
.tour .dots{display:flex;gap:6px;margin:16px 0}
.tour .dots i{width:22px;height:4px;border-radius:2px;background:var(--chip)}
.tour .dots i.on{background:var(--ink)}

.label{position:fixed;right:10px;bottom:10px;z-index:50;font-size:11.5px;font-weight:600;background:var(--ink);color:var(--on-ink);padding:5px 9px;border-radius:7px;opacity:.85;pointer-events:none}

/* ---------- phone ---------- */
@media (max-width: 820px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .rail,.table{min-width:0}
  .table{grid-row:1}
  .table-inner{padding:40px 16px 120px}
  .rail{grid-row:2;border-right:0;border-top:1px solid var(--rail-line);max-height:62dvh;transition:max-height .3s}
  .rail-head{padding:8px 16px}
  .rail-toggle{display:inline-block;margin-left:auto;border:1px solid var(--rail-line);background:var(--card);border-radius:8px;padding:4px 10px;font-size:12.5px}
  .rail-head .who{display:none}
  .rail.min .log{display:none}
  .rail.min .hints{display:none}
  .rail.min .peek{display:block}
  .peek{display:none;padding:0 16px 4px;font-size:13.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hand{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .hand:not(.focus) .slot:nth-child(n){transform:none}
  .front{min-height:250px}
  .mins{font-size:62px}
  .title{font-size:16.5px}
  .why{font-size:12.5px}
  .foot{flex-wrap:wrap;padding:10px}
  .foot .kit{width:100%}
  .back-in{grid-template-columns:1fr;padding:16px}
  .played,.studio{grid-template-columns:1fr}
  .played > .slot{max-width:260px}
  .aud{grid-template-columns:repeat(2,minmax(0,1fr))}
  .minis{grid-template-columns:1fr}
  .limitrow{grid-template-columns:1fr}
  .label{bottom:auto;top:8px;right:8px}
}
@media (min-width:821px){.peek{display:none}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail min" id="rail" aria-label="Chat with sweatcast">
    <div class="rail-head">
      <span class="mark">sweatcast</span>
      <span class="who">Jordan, with Coach Ellis</span>
      <button class="rail-toggle" id="railToggle" aria-expanded="false">Chat</button>
    </div>
    <div class="peek" id="peek"></div>
    <div class="log" id="log" aria-live="polite"></div>
    <div class="hints" id="hints"></div>
    <form class="compose" id="compose">
      <input id="say" autocomplete="off" placeholder="Say it: “shorter, and no jumping”" aria-label="Message">
      <button type="submit">Send</button>
    </form>
  </aside>
  <main class="table" id="table"><div class="table-inner" id="view"></div></main>
</div>
<div class="label">Concept 2 · The Deck — mockup</div>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const SUITS = {Strength:"var(--strength)", Conditioning:"var(--conditioning)", Mobility:"var(--mobility)", "General fitness":"var(--general)", New:"var(--new)"};
const KITS = ["Home: bells + band", "Hotel room", "Hotel gym", "Bodyweight"];
const OUTS = ["Jumping", "Floor work", "Overhead", "Lunges"];

/* ---------- state ---------- */
const S = {
  view: "home",
  focus: null,
  deck: [],
  played: null,
  limits: {"Left knee": "same"},
  readiness: null,
  coach: "Coach Ellis",
  myCoaches: [],
  pad: {x: .35, y: .4},
  padChips: {gender: "Any", age: "30s–40s", talks: "Patient teacher"},
  kept: null,
  feedback: 2,
  prefsTab: "Moves",
  moves: {"Kettlebell swing":1, "Goblet squat":1, "Push-up":0, "Burpees":-1, "Plank":0, "Band pull-apart":1, "Step-ups":0, "Mountain climbers":-1, "Dead bug":0, "Single-leg deadlift":0, "Jump squats":-1, "Bear crawl":0},
  topics: {"Space news":1, "Cycling results":1, "Word puzzles":1, "Food science":0, "History on this day":1, "Ocean life":0, "Football transfers":-1, "Stock markets":-1, "Old films":0, "Weird inventions":1},
  kitEq: {"Home: bells + band": {"Kettlebell 16 kg":1,"Kettlebell 12 kg":1,"Long band":1,"Mat":1,"Pull-up bar":0,"Bench":0},
          "Hotel room": {"Backpack":1,"Towel":1,"Chair":1,"Mini band":0},
          "Hotel gym": {"Dumbbells":1,"Bench":1,"Cable stack":0,"Treadmill":1,"Bike":1}},
  hurt: {area: null, how: null, lasting: null},
};
function baseDeck(){
  return [
    {id:"a", goal:"Strength", title:"Like Tuesday, but shorter", mins:20, kit:"Home: bells + band", why:"Same swings and rows you liked, five minutes trimmed, Tuesday was your longest this month.", outs:[], effort:"As planned"},
    {id:"b", goal:"Strength", title:"Hotel strength", mins:25, kit:"Hotel room", why:"You're away until Friday. Backpack rows, tempo push-ups, nothing that thumps the floor.", outs:["Jumping"], effort:"As planned"},
    {id:"c", goal:"Mobility", title:"Mobility reset", mins:15, kit:"Bodyweight", why:"Your legs did a lot this week: three lower-body days in five.", outs:[], effort:"Easier"},
    {id:"d", goal:"New", title:"Something new: intervals", mins:20, kit:"Hotel gym", why:"No conditioning in 12 days. Bike intervals, 30 on, 60 easy.", outs:[], effort:"As planned", fresh:true},
  ];
}
S.deck = baseDeck();

/* ---------- chat ---------- */
const log = $("#log");
function say(html, who = "agent"){
  const d = document.createElement("div");
  d.className = "msg " + who;
  d.innerHTML = who === "user" ? esc(html) : html;
  log.appendChild(d);
  log.scrollTop = log.scrollHeight;
  if (who === "agent") $("#peek").textContent = d.textContent;
}
function hints(list){
  $("#hints").innerHTML = list.map(h => `<button type="button">${esc(h)}</button>`).join("");
  [...$("#hints").children].forEach(b => b.onclick = () => { $("#say").value = b.textContent; $("#compose").requestSubmit(); });
}
$("#railToggle").onclick = () => {
  const r = $("#rail"); const min = r.classList.toggle("min");
  $("#railToggle").setAttribute("aria-expanded", String(!min));
  $("#railToggle").textContent = min ? "Chat" : "Hide";
};
$("#compose").onsubmit = e => {
  e.preventDefault();
  const t = $("#say").value.trim(); if (!t) return;
  $("#say").value = ""; say(t, "user");
  setTimeout(() => understand(t.toLowerCase()), 350);
};

/* free text → visible edits of the deck */
function understand(t){
  if (/hurt|pain|sore|tweak|injur/.test(t)) { say("<p>Let's sort that first. Tap where it is.</p>"); return go("hurt"); }
  if (/coach|voice/.test(t)) { say("<p>Here's your bench. Tap any coach to hear them.</p>"); return go("coaches"); }
  if (/around|tour|how does/.test(t)) return tour();
  if (/stat|history|analytic|week/.test(t)) return go("analytics");
  if (/prefer|setting|edit|kit|equipment/.test(t)) return go("prefs");
  const changes = [];
  if (S.view !== "home") go("home");
  let mutate = c => c;
  const m = t.match(/(\d+)\s*min/);
  if (m) { const n = clamp(+m[1]); mutate = chain(mutate, c => ({...c, mins:n})); changes.push(`${n} minutes`); }
  else if (/short|quick|less time/.test(t)) { mutate = chain(mutate, c => ({...c, mins:Math.max(10, c.mins - 5)})); changes.push("5 minutes shorter"); }
  else if (/long|more time/.test(t)) { mutate = chain(mutate, c => ({...c, mins:Math.min(60, c.mins + 10)})); changes.push("10 minutes longer"); }
  if (/jump|impact|quiet|neighbo/.test(t)) { mutate = chain(mutate, c => ({...c, outs:[...new Set([...c.outs, "Jumping"])]})); changes.push("no jumping"); }
  if (/floor/.test(t)) { mutate = chain(mutate, c => ({...c, outs:[...new Set([...c.outs, "Floor work"])]})); changes.push("no floor work"); }
  if (/easy|tired|gentle|slept/.test(t)) { mutate = chain(mutate, c => ({...c, effort:"Easier"})); changes.push("easier"); }
  if (/hard|fresh|push/.test(t)) { mutate = chain(mutate, c => ({...c, effort:"Harder"})); changes.push("harder"); }
  if (/hotel/.test(t)) { mutate = chain(mutate, c => ({...c, kit: c.goal === "New" ? "Hotel gym" : "Hotel room"})); changes.push("hotel kit"); }
  if (/mobility|stretch/.test(t)) { S.deck = [S.deck[2], ...S.deck.filter(c => c.id !== "c")]; changes.push("mobility first"); }
  if (!changes.length){
    say(`<p>I'm not sure what to change from that. Try a length, a kit, “easier”, or something to leave out.</p>`);
    return;
  }
  S.deck = S.deck.map(c => ({...mutate(c), edited:true}));
  say(`<p>Re-dealt your hand.</p><span class="note">Every card: <b>${esc(changes.join(", "))}</b></span>`);
  render(true);
}
const chain = (f, g) => c => g(f(c));
const clamp = n => Math.max(10, Math.min(60, Math.round(n / 5) * 5));

/* ---------- router ---------- */
function go(v){ S.view = v; S.focus = null; render(); $("#table").scrollTop = 0; }
function render(deal = false){
  const V = VIEWS[S.view]();
  $("#view").innerHTML = V.html;
  if (deal || S.view === "home") { const h = $(".hand"); if (h && deal) { h.classList.add("dealing"); setTimeout(() => h.classList.remove("dealing"), 800); } }
  V.wire && V.wire();
}
const crumbs = (label = "Back to your hand") => `<div class="crumbs"><button class="back" data-home>${esc(label)}</button></div>`;
function wireBack(){ document.querySelectorAll("[data-home]").forEach(b => b.onclick = () => go("home")); }

/* ---------- card markup ---------- */
function cardHTML(c, i){
  const suit = SUITS[c.goal];
  const outs = c.outs.length ? `, no ${c.outs.map(o => o.toLowerCase()).join(", no ")}` : "";
  const eff = c.effort !== "As planned" ? `, ${c.effort.toLowerCase()}` : "";
  return `<div class="slot ${S.focus === c.id ? "on" : ""} ${c.edited ? "edited" : ""}" style="--suit:${suit}" data-id="${c.id}">
    <div class="card ${S.focus === c.id ? "flipped" : ""}">
      <div class="face front">
        <div class="suit"></div>
        <div class="body">
          <span class="kind">${c.goal === "New" ? "Something new" : c.goal}${c.fresh ? `<span class="new-badge">new to you</span>` : ""}</span>
          <div class="mins">${c.mins}<small>min</small></div>
          <div class="title">${esc(c.title)}</div>
          <p class="why">${esc(c.why)}</p>
        </div>
        <div class="foot">
          <span class="kit">${esc(c.kit)}${esc(outs)}${esc(eff)}</span>
          <button class="tweak" data-tweak="${c.id}" aria-label="Tweak ${esc(c.title)}">Tweak</button>
          <button class="go" data-go="${c.id}" aria-label="Start ${esc(c.title)}">Go</button>
        </div>
      </div>
      <div class="face back">${S.focus === c.id ? backHTML(c) : ""}</div>
    </div>
  </div>`;
}
function backHTML(c){
  const goals = ["Strength","General fitness","Conditioning","Mobility"];
  const g = c.goal === "New" ? "Conditioning" : c.goal;
  return `<div class="back-in">
    <h3><span class="kind">Tweaking</span>${esc(c.title)}</h3>
    <div class="row">
      <span class="lab">Length (drag)</span>
      <div class="scrub" id="scrub">
        <div class="big"><span id="sv">${c.mins}</span><small>min</small></div>
        <div class="ticks" id="ticks" role="slider" tabindex="0" aria-label="Length in minutes" aria-valuemin="10" aria-valuemax="60" aria-valuenow="${c.mins}"></div>
        <span class="scrub-hint">Drag, or use arrow keys. Snaps to 5.</span>
      </div>
    </div>
    <div class="row" style="gap:16px">
      <div class="row"><span class="lab">Goal</span><div class="chips" data-group="goal">${goals.map(x => `<button class="chip" aria-pressed="${x === g}">${x}</button>`).join("")}</div></div>
      <div class="row"><span class="lab">Kit</span><div class="chips" data-group="kit">${KITS.map(x => `<button class="chip" aria-pressed="${x === c.kit}">${x}</button>`).join("")}</div></div>
      <div class="row"><span class="lab">Effort</span><div class="chips" data-group="effort">${["Easier","As planned","Harder"].map(x => `<button class="chip" aria-pressed="${x === c.effort}">${x}</button>`).join("")}</div></div>
      <div class="row"><span class="lab">Leave out today</span><div class="chips" data-group="outs">${OUTS.map(x => `<button class="chip out" aria-pressed="${c.outs.includes(x)}">${x}</button>`).join("")}</div></div>
    </div>
    <div class="back-actions">
      <span class="delta" id="delta"></span>
      <button class="tweak" data-unflip>Put it back</button>
      <button class="go" data-go="${c.id}">Go with this</button>
    </div>
  </div>`;
}

/* ---------- views ---------- */
const VIEWS = {
home(){
  return { html: `
    <h1 class="say">Morning, Jordan. Pick a card.</h1>
    <p class="sub">Dealt from your last two weeks, the left-knee limit and today's forecast. One tap starts the check-in; Tweak flips a card over.</p>
    <div class="deck-tools">
      <button class="shuffle" id="shuffle">Deal a fresh hand</button>
      <span class="why-all">Swipe a card away to say “less of this”.</span>
    </div>
    <div class="hand ${S.focus ? "focus" : ""}" id="hand">${S.deck.map(cardHTML).join("")}</div>
    ${S.feedback ? `<div class="nudge"><div class="stack"><span></span><span></span></div>
      <p><b>Got feedback on ${S.feedback} older workout${S.feedback > 1 ? "s" : ""}?</b><br><span class="small">Ten seconds, two taps each. It shapes the next hand.</span></p>
      <button class="btn ghost" id="fb">React</button></div>` : ""}
    <div class="doors">
      <button class="door" data-door="prefs" style="--pipc:var(--general)">Edit my stuff</button>
      <button class="door" data-door="hurt" style="--pipc:var(--nope)">Something hurts</button>
      <button class="door" data-door="coaches" style="--pipc:var(--conditioning)">Coaches</button>
      <button class="door" data-door="tour" style="--pipc:var(--mobility)">Show me around</button>
      <button class="door" data-door="analytics" style="--pipc:var(--new)">Analytics</button>
    </div>`,
  wire(){
    $("#shuffle").onclick = () => {
      S.deck = baseDeck().map((c, i) => i === 3 ? {...c, id:"e", goal:"General fitness", title:"Kettlebell + walk", mins:30, kit:"Home: bells + band", why:"A brisk outdoor walk with swings at every stop. Dry until noon.", fresh:false} : c).sort(() => .5 - Math.random());
      say("<p>Fresh hand. I swapped the intervals for a walk-and-swing card, since it's dry this morning.</p>");
      render(true);
    };
    document.querySelectorAll("[data-door]").forEach(b => b.onclick = () => b.dataset.door === "tour" ? tour() : go(b.dataset.door));
    const fb = $("#fb"); if (fb) fb.onclick = () => go("feedback");
    wireCards();
  }};
},
feedback(){
  const w = [{t:"Hotel strength 25", d:"Mon, with Coach Ellis", suit:"var(--strength)"},{t:"Bike intervals 20", d:"Last Thu, with Coach Ellis", suit:"var(--conditioning)"}].slice(2 - S.feedback);
  return { html: `${crumbs()}
    <h1 class="say">Quick reactions</h1><p class="sub">Tap one per workout. They go under Feedback in your log and tune the next hand.</p>
    <div class="minis">${w.map((x, i) => `<div class="mini" style="--suit:${x.suit}"><div class="suit"></div><div class="in">
      <span class="kind">${x.d}</span><h4>${x.t}</h4><p class="meta">Anything to keep or change?</p>
      <div class="chips">${["Just right","Too long","Too easy","Too hard","Loved a topic","Too chatty"].map(r => `<button class="chip" data-r="${r}" data-i="${i}">${r}</button>`).join("")}</div></div></div>`).join("")}</div>`,
  wire(){
    wireBack();
    document.querySelectorAll(".mini .chip").forEach(b => b.onclick = () => {
      const mini = b.closest(".mini"); mini.classList.add("gone");
      say(`<p>Noted: <b>${esc(b.dataset.r.toLowerCase())}</b> for ${esc(mini.querySelector("h4").textContent)}.</p>`);
      setTimeout(() => { S.feedback--; if (!S.feedback) { say("<p>All caught up. Your next hand leans on that.</p>"); go("home"); } else render(); }, 420);
    });
  }};
},
checkin(){
  const c = S.played; const lim = Object.keys(S.limits);
  return { html: `${crumbs("Pick another card")}
    <h1 class="say">Two taps and you can walk away.</h1>
    <div class="timer"><i id="tbar"></i></div>
    <div class="q"><h2>Your left knee today?</h2>
      ${lim.map(a => `<div class="limitrow"><span class="area">${a} <span class="small">(delicate)</span></span>
        <div class="seg" data-limit="${a}">${["Better","Same","Worse"].map(x => `<button aria-pressed="${S.limits[a] === x.toLowerCase()}">${x}</button>`).join("")}</div></div>`).join("")}
      <button class="chip" id="elsewhere" style="margin-top:4px">Sore somewhere else</button>
    </div>
    <div class="q"><h2>How are you coming in?</h2>
      <div class="taps" id="ready">
        <button class="tap rec" data-v="normal"><b>Normal</b><span>Last one about right</span></button>
        <button class="tap" data-v="low"><b>Low</b><span>Tired, short on sleep or stressed</span></button>
        <button class="tap" data-v="fresh"><b>Fresh</b><span>Last one felt easy</span></button>
        <button class="tap" data-v="hard"><b>Last one was too hard</b><span>Dial it back</span></button>
      </div>
    </div>
    <p class="small">Playing: ${esc(c.title)}, ${c.mins} min, ${esc(c.kit)}, with ${esc(S.coach)}.</p>`,
  wire(){
    wireBack();
    let t = 0; const bar = $("#tbar"); const iv = setInterval(() => { t++; if (bar) bar.style.width = Math.min(100, t * 10) + "%"; if (t >= 10 || S.view !== "checkin") clearInterval(iv); }, 1000);
    document.querySelectorAll("[data-limit]").forEach(seg => seg.querySelectorAll("button").forEach(b => b.onclick = () => {
      S.limits[seg.dataset.limit] = b.textContent.toLowerCase();
      seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      if (b.textContent === "Worse") say("<p>Knee's worse, so today it's off-limits: no knee-bending work at all. I'll ask before changing your health notes for good.</p>");
    }));
    $("#elsewhere").onclick = () => { say("<p>Let's look at that before we build.</p>"); go("hurt"); };
    $("#ready").querySelectorAll(".tap").forEach(b => b.onclick = () => {
      S.readiness = b.dataset.v;
      $("#ready").querySelectorAll(".tap").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
      clearInterval(iv);
      const line = {normal:"Normal day.", low:"Low day: fewer sets, longer rests.", fresh:"Fresh: I'll add a set and nudge the loads.", hard:"Easing off from last time."}[b.dataset.v];
      say(`<p>${line} Knee ${S.limits["Left knee"]}. Planning now.</p>`);
      setTimeout(() => go("plan"), 450);
    });
  }};
},
plan(){
  const c = S.played; const worse = S.limits["Left knee"] === "worse";
  const scale = c.mins / 25;
  const sec = n => { const s = Math.round(n * scale / 15) * 15; return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };
  const rows = c.goal === "Mobility" ? [
    ["Warm-up","Breathing on the back, cat–cow, hip circles",240],
    ["Flow","World's greatest stretch, thoracic rotation, 90/90 hips",720],
    ["Cool-down","Child's pose, long exhales",240]] :
    [["Warm-up","Arm circles, hip hinge drill, glute bridge",240],
     ["Main",`3 rounds: ${c.kit === "Hotel room" ? "backpack row 10" : "kettlebell row 8/side"}, tempo push-up 8, ${worse ? "single-leg glute bridge 10/side" : "box squat to chair 10"}, dead bug 8/side`,780],
     ["Finisher",c.outs.includes("Jumping") || worse ? "Plank shoulder taps, 30 on / 30 off ×4" : "Kettlebell swings, 30 on / 30 off ×4",240],
     ["Cool-down","Hamstring and hip flexor stretch, breathing",240]];
  const tot = rows.reduce((a, r) => a + r[2], 0);
  const cols = ["var(--mobility)","var(--suit)","var(--conditioning)","var(--general)"];
  return { html: `${crumbs()}
    <h1 class="say">Here's the plan.</h1>
    <p class="sub">Rendering starts on its own in a moment. Change anything in the chat first if you want.</p>
    <div class="played" style="--suit:${SUITS[c.goal]}">
      <div class="slot" style="--suit:${SUITS[c.goal]}">${cardHTML({...c, edited:false}).replace(/<div class="slot[^>]*>/, "").replace(/<\/div>\s*$/, "")}</div>
      <div>
        <div class="plan">
          <div class="timeline">${rows.map((r, i) => `<span style="flex:${r[2]};background:${cols[i % 4]}"></span>`).join("")}</div>
          <table><thead><tr><th>Block</th><th>Movements and dose</th><th>Time</th></tr></thead>
          <tbody>${rows.map(r => `<tr><td>${r[0]}</td><td>${esc(r[1])}</td><td>${sec(r[2] * 25 / tot * 60)}</td></tr>`).join("")}</tbody></table>
          <div class="notes">
            <span>Format: ${c.goal === "Mobility" ? "flow" : "circuit"}, in the ${esc(c.kit.toLowerCase())} kit</span>
            <span>Left knee ${worse ? "off-limits today: no squats, lunges or step-ups." : "delicate: no lunges, no jumping, squats only to a chair."}</span>

    let x0 = null, dx = 0;
    slot.addEventListener("pointerdown", e => { if (e.target.closest("button")) return; x0 = e.clientX; dx = 0; slot.style.transition = "none"; });
    slot.addEventListener("pointermove", e => { if (x0 === null) return; dx = e.clientX - x0; slot.style.transform = `translateX(${dx}px) rotate(${dx / 20}deg)`; slot.style.opacity = String(1 - Math.min(.7, Math.abs(dx) / 300)); });
    const end = () => {
      if (x0 === null) return; x0 = null; slot.style.transition = "";
      if (Math.abs(dx) > 110) {
        const c = S.deck.find(k => k.id === slot.dataset.id);
        S.deck = S.deck.filter(k => k !== c).concat({id:"r" + Date.now(), goal:"General fitness", title:"Easy full-body 20", mins:20, kit:"Bodyweight", why:"In place of " + c.title.toLowerCase() + ". Dealt less of that from now on.", outs:[], effort:"As planned", fresh:true});
        say(`<p>Less “${esc(c.title)}” from now on. Dealt you another.</p>`); render(true);
      } else if (Math.abs(dx) < 6) { play(S.deck.find(k => k.id === slot.dataset.id)); }
      else { slot.style.transform = ""; slot.style.opacity = ""; }
    };
    slot.addEventListener("pointerup", end); slot.addEventListener("pointercancel", () => { x0 = null; slot.style.transform = ""; slot.style.opacity = ""; });
  });
}
function wireBack_(c){
  const orig = {...c};
  const ticks = $("#ticks"), sv = $("#sv");
  const draw = () => {
    const pct = (c.mins - 10) / 50 * 100;
    ticks.innerHTML = `<div class="fill" style="width:${pct}%"></div>` + [10,20,30,40,50,60].map(m => `<span class="t" style="left:${(m - 10) / 50 * 100}%;height:${m % 30 ? 10 : 18}px"></span><span class="lbl" style="left:${Math.min(96, Math.max(4, (m - 10) / 50 * 100))}%">${m}</span>`).join("") + `<span class="knob" style="left:${pct}%"></span>`;
    sv.textContent = c.mins; ticks.setAttribute("aria-valuenow", c.mins);
    const d = []; if (c.mins !== orig.mins) d.push(`${c.mins > orig.mins ? "+" : ""}${c.mins - orig.mins} min`);
    if (c.kit !== orig.kit) d.push(c.kit); if (c.effort !== orig.effort) d.push(c.effort.toLowerCase());
    c.outs.filter(o => !orig.outs.includes(o)).forEach(o => d.push("no " + o.toLowerCase()));
    $("#delta").textContent = d.length ? "Changed: " + d.join(", ") : "";
  };
  const at = e => { const r = ticks.getBoundingClientRect(); c.mins = clamp(10 + (e.clientX - r.left) / r.width * 50); draw(); };
  ticks.onpointerdown = e => { ticks.setPointerCapture(e.pointerId); at(e); ticks.onpointermove = at; };
  ticks.onpointerup = () => ticks.onpointermove = null;
  ticks.onkeydown = e => { if (e.key === "ArrowRight" || e.key === "ArrowUp") c.mins = clamp(c.mins + 5); else if (e.key === "ArrowLeft" || e.key === "ArrowDown") c.mins = clamp(c.mins - 5); else return; e.preventDefault(); draw(); };
  document.querySelectorAll("[data-group]").forEach(g => g.querySelectorAll(".chip").forEach(b => b.onclick = () => {
    const k = g.dataset.group, v = b.textContent;
    if (k === "outs") { c.outs = c.outs.includes(v) ? c.outs.filter(x => x !== v) : [...c.outs, v]; b.setAttribute("aria-pressed", String(c.outs.includes(v))); }
    else { if (k === "goal") c.goal = v; else c[k] = v; g.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", String(x === b))); }
    if (k === "goal") document.querySelector(".slot.on").style.setProperty("--suit", SUITS[v]);
    draw();
  }));
  $(".back-actions [data-go]").onclick = () => { c.edited = true; c.fresh = false; play(c); };
  draw();
}
function play(c){
  if (!c) return;
  S.played = c;
  say(`<p>Playing <b>${esc(c.title)}</b>: ${c.mins} min, ${esc(c.kit.toLowerCase())}${c.outs.length ? ", no " + esc(c.outs.join(", no ").toLowerCase()) : ""}. Quick check-in, then you're free.</p>`);
  go("checkin");
}

/* ---------- tour ---------- */
function tour(){
  const steps = [
    ["Pick a card","Every morning you get a hand of workouts guessed from your week. Tap one to go, or Tweak to flip it and change the length, kit and effort."],
    ["Ten seconds of check-in","How's the knee, how are you coming in. Then close the tab: research, writing, safety checks and the voice run on their own."],
    ["Earbuds in","A coach talks you through it, on time, with news and a quiz in the rests. Download within 24 hours."],
  ];
  let i = 0; const el = document.createElement("div"); el.className = "tour"; document.body.appendChild(el);
  const draw = () => { const [h, p] = steps[i]; el.innerHTML = `<div class="tcard" role="dialog" aria-modal="true" aria-label="Tour" style="--suit:${["var(--strength)","var(--mobility)","var(--general)"][i]}">
    <div class="tnum">${i + 1}</div><h3>${h}</h3><p>${p}</p><div class="dots">${steps.map((_, k) => `<i class="${k === i ? "on" : ""}"></i>`).join("")}</div>
    <div class="actions" style="margin:0"><button class="btn" id="tn">${i < steps.length - 1 ? "Next" : "Deal me in"}</button><button class="btn ghost" id="tx">Skip</button></div></div>`;
    $("#tn", el).onclick = () => { if (++i >= steps.length) close(); else draw(); }; $("#tx", el).onclick = close; $("#tn", el).focus(); };
  const close = () => { el.remove(); if (S.view !== "home") go("home"); };
  draw();
}

/* ---------- boot ---------- */
say("<p>Morning, Jordan. Four cards on the table, guessed from your week. Tap one, or tell me what you're after.</p>");
say(`<p>Your left knee is still marked delicate, so none of these jump or lunge.</p>`);
hints(["shorter, and no jumping", "hotel, 30 min", "something easy", "my shoulder hurts"]);
render(true);
</script>
