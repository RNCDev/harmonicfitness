<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sweatcast: Three zones</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Figtree:ital,wght@0,400..800;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --base:#E3E8DF;         /* steel: the room */
  --sheet:#F7F9F4;        /* the panel's page */
  --ink:#1B2A1E;          /* text */
  --ink-2:#4C5D4F;        /* secondary text */
  --ink-3:#869488;        /* faint */
  --rule:#C9D3C6;
  --tok:#0E6A5C;          /* every editable word */
  --tok-tint:#CFEBE4;
  --tok-on:#FFFFFF;
  --engine:#7A4A8F;       /* clauses sweatcast writes itself */
  --engine-tint:#ECE0F1;
  --warn:#8A5C00;
  --warn-tint:#F3E5C3;
  --stop:#A42235;
  --stop-tint:#F6DADE;
  --ok:#3D7A1F;
  --chat:#D8DFD3;
  --shadow:0 18px 40px -22px rgba(19,32,42,.45);
  --display:"Zilla Slab", Rockwell, Georgia, serif;
  --body:"Figtree", system-ui, sans-serif;
  --r-tok:.32em;
  --r-sheet:22px;
  /* layout: one 12-column grid shared by the band and the split below */
  --gut:clamp(24px,2vw,40px);     /* column gap */
  --edge:clamp(20px,2.4vw,48px);  /* outer right margin */
  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:24px;--s6:32px;--s7:48px;
  --cA:5;   /* grid line where the chat ends and the centre begins */
  --cB:13;  /* grid line where the centre ends */
  --pr:var(--edge); /* centre's right padding */
  --band-size:clamp(24px,1.1vw + 14px,40px);
}
@media (prefers-color-scheme: dark){
  :root{
    --base:#0F1612;
    --sheet:#17211B;
    --ink:#E6EFE7;
    --ink-2:#A9B9AC;
    --ink-3:#6B7C6E;
    --rule:#26342B;
    --tok:#5FD3B8;
    --tok-tint:#173A32;
    --tok-on:#0F1612;
    --engine:#CFA3E0;
    --engine-tint:#2E2236;
    --warn:#F1B95A;
    --warn-tint:#392A10;
    --stop:#FF8796;
    --stop-tint:#42161D;
    --ok:#9BDB7A;
    --chat:#0B110D;
    --shadow:0 18px 40px -22px rgba(0,0,0,.8);
  }
}
@media (min-width:1200px){ :root{--cA:4} }
@media (min-width:1700px){ :root{--cB:10;--pr:0px} }
@media (min-width:2000px){ :root{--cA:3} }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--base);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tok);outline-offset:3px;border-radius:6px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- frame: band on top, split below ---------- */
.app{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:var(--gut);grid-template-rows:auto minmax(0,1fr);height:100vh;height:100dvh}
.band{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:subgrid;background:var(--sheet);border-bottom:1px solid var(--rule);position:relative;z-index:20}
.chat{grid-column:1/var(--cA);grid-row:2;background:var(--chat);display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.panel{grid-column:var(--cA)/var(--cB);grid-row:2;min-height:0;overflow-y:auto;padding:var(--s6) var(--pr) 120px 0;container-type:inline-size}
.ctx{grid-column:var(--cB)/-1;grid-row:2;min-height:0;overflow-y:auto;padding:var(--s6) var(--edge) var(--s6) var(--s5);border-left:1px solid var(--rule);display:none}
@media (min-width:1700px){ .ctx{display:block} .ctx-toggle,.ctx-inline{display:none!important} }

/* ---------- the band ---------- */
.band-left{grid-column:1/var(--cA);padding:var(--s5) var(--s5) var(--s5) var(--s5);display:flex;flex-direction:column;gap:var(--s2);min-width:0}
.mark{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1}
.mark span{color:var(--tok)}
.where{font-family:var(--display);font-size:17px;font-weight:600;color:var(--ink);margin-top:var(--s3)}
.lede{font-size:14px;color:var(--ink-2);margin:0}
.band-left .back{margin:0}
.ctx-toggle{margin-top:auto;align-self:flex-start;font-size:13px;font-weight:700;color:var(--tok);border:1px solid var(--rule);border-radius:999px;padding:4px 12px;background:var(--base)}
.ctx-toggle:hover{border-color:var(--tok)}
.band-main{grid-column:var(--cA)/-1;display:flex;align-items:center;gap:var(--s6);padding:var(--s6) var(--edge) var(--s6) 0;min-width:0}
.band-sent{flex:1;min-width:0}
.band-go{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:var(--s2);text-align:right;max-width:220px}
.band-go .meta{font-size:13px}
.ask{font-family:var(--display);font-weight:700;font-size:calc(var(--band-size) * 1.25);letter-spacing:-.03em;line-height:1.05;margin:0}
.pct{font-family:var(--display);font-weight:700;font-size:calc(var(--band-size) * 1.2);color:var(--tok);line-height:1;font-variant-numeric:tabular-nums}

/* ---------- chat ---------- */
.chat-head{display:none;align-items:center;gap:10px;padding:18px 20px 12px}
.chat-log{flex:1;overflow-y:auto;padding:var(--s5) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s3)}
.m{max-width:94%;font-size:15px;line-height:1.45}
.m.a{background:var(--sheet);padding:10px 14px;border-radius:4px 16px 16px 16px;align-self:flex-start}
.m.u{align-self:flex-end;background:var(--ink);color:var(--sheet);padding:9px 14px;border-radius:16px 16px 4px 16px}
.m.note{font-size:13px;color:var(--ink-3);align-self:center;text-align:center;max-width:100%}
.m .diff{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.m .diff span{font-size:13px;border-radius:8px;padding:2px 8px;background:var(--base);border:1px solid var(--rule)}
.m .diff s{color:var(--ink-3)}
.m .diff b{color:var(--tok)}
.m.stop{box-shadow:inset 3px 0 0 var(--stop)}
.mc{margin-top:10px;background:var(--base);border:1px solid var(--rule);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.mc b{font-family:var(--display);font-size:16px;font-weight:700;line-height:1.2}
.mc small{font-size:13px;color:var(--ink-2)}
.mc .rib{display:flex;height:8px;gap:2px}
.mc .rib i{border-radius:3px}
.mc button{justify-self:start;font-weight:700;color:var(--tok);font-size:14px}
.mc.stopc{border-color:var(--stop);background:var(--stop-tint)}
.mc.stopc b{color:var(--stop)}
.chat-in{padding:12px 14px 16px;border-top:1px solid var(--rule)}
.say{display:flex;gap:8px;background:var(--sheet);border-radius:18px;padding:6px 6px 6px 14px;box-shadow:var(--shadow)}
.say input{flex:1;border:0;background:none;outline:none;min-width:0;font-size:16px}
.say button{background:var(--ink);color:var(--sheet);border-radius:13px;padding:8px 14px;font-weight:700;font-size:14px}
.hints{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.hints button{font-size:13px;color:var(--ink-2);border:1px solid var(--rule);border-radius:999px;padding:3px 10px}
.hints button:hover{color:var(--tok);border-color:var(--tok)}

/* ---------- the sentence ---------- */
.sentence{font-family:var(--display);font-weight:500;font-size:var(--band-size);line-height:1.36;letter-spacing:-.015em;margin:0;text-wrap:pretty}
.sentence.small{font-size:clamp(21px,.8vw + 12px,30px)}
.tok{font-family:inherit;font-weight:700;color:var(--tok);border-bottom:.09em dashed currentColor;border-radius:0;padding:0 .04em;line-height:1.1;display:inline-block;transition:background .2s,color .2s;position:relative;white-space:nowrap}
.tok:hover{background:var(--tok-tint)}
.tok.set{background:var(--tok);color:var(--tok-on);border-bottom-color:transparent;border-radius:var(--r-tok);padding:0 .22em}
.tok.open{outline:3px solid var(--tok);outline-offset:2px;border-radius:var(--r-tok)}
.tok.warn{color:var(--warn);border-bottom-color:var(--warn)}
.tok.warn.set{background:var(--warn);color:var(--sheet)}
.tok.flash{animation:flash .9s ease}
.tok.flash .v{display:inline-block;animation:roll .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes roll{from{transform:translateY(.55em);opacity:0}to{transform:none;opacity:1}}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--tok)}30%{box-shadow:0 0 0 .22em var(--tok-tint)}100%{box-shadow:0 0 0 0 transparent}}
.tok.chip{font-size:.92em}
.tok.chip .x{font-weight:400;opacity:.6;margin-left:.15em;font-size:.8em}
.tok.add{color:var(--ink-3);border-bottom-style:dotted;font-weight:500}
.engine{color:var(--engine);font-weight:500;display:inline;animation:roll .5s ease}
.engine.stop{color:var(--stop)}
.legend{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2);margin:0}
.legend i{font-style:normal;font-family:var(--display);font-weight:700;color:var(--tok)}
.legend .g{border-bottom:2px dashed var(--tok)}
.legend .s{background:var(--tok);color:var(--tok-on);padding:0 5px;border-radius:5px}
.legend .e{color:var(--engine)}

/* Go */
.go-row{display:flex;align-items:center;gap:18px;margin-top:var(--s5);flex-wrap:wrap}
.go{font-family:var(--display);font-weight:700;font-size:22px;background:var(--tok);color:var(--tok-on);border-radius:999px;padding:14px 34px;box-shadow:var(--shadow);transition:transform .15s;white-space:nowrap}
.go:hover{transform:translateY(-2px)}
.go:active{transform:none}
.go[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.go.alt{background:none;color:var(--tok);box-shadow:inset 0 0 0 2px var(--tok)}
.quiet{color:var(--ink-2);font-size:15px;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule)}
.quiet:hover{color:var(--tok);text-decoration-color:var(--tok)}
.meta{font-size:14px;color:var(--ink-2)}
.side-h{font-family:var(--display);font-size:16px;font-weight:700;margin:0 0 var(--s2)}

/* centre: main + aside when the centre is wide */
.duo{display:grid;gap:var(--s6)}
@container (min-width:820px){ .duo{grid-template-columns:minmax(0,2fr) minmax(220px,1fr);align-items:start} }

/* recent sentences */
.recent{display:flex;flex-direction:column;gap:var(--s2)}
.recent button{text-align:left;font-family:var(--display);font-size:16px;color:var(--ink-2);padding:var(--s2) 0;border-bottom:1px solid var(--rule);line-height:1.35}
.recent button:hover{color:var(--tok)}
.recent button b{font-weight:700;color:var(--ink)}

/* ---------- home ---------- */
.doors{display:grid;grid-template-columns:1fr;border-top:1px solid var(--rule)}
@container (min-width:620px){ .doors{grid-template-columns:1fr 1fr;column-gap:var(--s6)} }
.door{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 18px;text-align:left;padding:var(--s5) 4px;border-bottom:1px solid var(--rule);transition:padding .2s}
.door:hover{padding-left:14px}
.door .t{font-family:var(--display);font-size:clamp(22px,.7vw + 14px,30px);font-weight:500;letter-spacing:-.02em;line-height:1.2}
.door .t em{font-style:normal;color:var(--ink-3);font-weight:400}
.door:hover .t{color:var(--tok)}
.door .d{grid-column:1;font-size:14px;color:var(--ink-2)}
.door .k{grid-row:1/3;grid-column:2;font-size:13px;color:var(--ink-3)}
.door.primary .t{font-weight:700}
.react{display:flex;gap:6px;flex-wrap:wrap}
.react button{border:1px solid var(--rule);border-radius:999px;padding:6px 12px;font-size:14px;background:var(--base)}
.react button:hover,.react button.on{border-color:var(--tok);color:var(--tok)}

/* ---------- your context ---------- */
.cx-list{display:flex;flex-direction:column;gap:var(--s5)}
.cx{display:block;width:100%;text-align:left;padding:var(--s4);border-radius:16px;background:var(--sheet);transition:box-shadow .2s}
.cx:hover{box-shadow:inset 0 0 0 1.5px var(--tok)}
.cx-l{font-size:13px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px;margin-bottom:2px}
.cx-l .ed{color:var(--tok);font-weight:700}
.cx-v{font-family:var(--display);font-size:20px;font-weight:700;line-height:1.2;letter-spacing:-.01em}
.cx-s{font-size:14px;color:var(--ink-2);margin-top:2px}
.cx-row{display:flex;gap:var(--s3);align-items:center}
.cx-sess{display:flex;flex-direction:column}
.cx-sess button{text-align:left;padding:var(--s2) 0;border-top:1px solid var(--rule);font-size:14px;color:var(--ink-2)}
.cx-sess button:first-child{border-top:0}
.cx-sess button b{font-family:var(--display);font-size:16px;color:var(--ink);display:block}
.cx-sess button:hover b{color:var(--tok)}
.cx-box{padding:var(--s4);border-radius:16px;background:var(--sheet)}
.cx-box .react{margin-top:var(--s3)}
.ctx-inline{margin-top:var(--s7)}
.ctx-inline .cx-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--s4)}
.ctx-scrim{display:none}

/* ---------- plan preview ---------- */
.plan{background:var(--sheet);border-radius:var(--r-sheet);padding:22px 24px 10px;box-shadow:var(--shadow)}
.plan.dim{opacity:.6;box-shadow:none}
.plan-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.plan-head h2{font-family:var(--display);font-size:20px;margin:0;font-weight:700;letter-spacing:-.01em}
.ribbon{display:flex;height:34px;margin:16px 0 4px;gap:3px}
.ribbon div{border-radius:6px;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;overflow:hidden;white-space:nowrap;transition:flex-grow .5s cubic-bezier(.3,.8,.3,1)}
.b-warm{background:var(--tok-tint);color:var(--tok)}
.b-work{background:var(--tok);color:var(--tok-on)}
.b-fin{background:var(--engine);color:var(--sheet)}
.b-cool{background:var(--rule);color:var(--ink-2)}
.ribbon-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-bottom:8px}
table.rows{width:100%;border-collapse:collapse;font-size:15px}
.rows th{text-align:left;font-weight:400;color:var(--ink-3);font-size:13px;padding:8px 8px 6px 0;border-bottom:1px solid var(--rule)}
.rows td{padding:11px 8px 11px 0;border-bottom:1px solid var(--rule);vertical-align:top}
.rows tr:last-child td{border-bottom:0}
.rows td:first-child{font-family:var(--display);font-weight:700;white-space:nowrap}
.rows td.sec{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
.rows th:last-child{text-align:right}
.rows .mv{display:block}
.rows .dose{color:var(--ink-2);font-size:14px}
.changed-row{animation:rowflash 1.2s ease}
@keyframes rowflash{0%{background:var(--tok-tint)}100%{background:transparent}}
.foot{font-size:14px;color:var(--ink-2);padding:10px 0 12px;border-top:1px solid var(--rule)}

/* ---------- picker ---------- */
.pop{position:fixed;z-index:60;background:var(--sheet);border-radius:16px;box-shadow:0 24px 60px -16px rgba(0,0,0,.45),0 0 0 1px var(--rule);width:min(300px,calc(100vw - 32px));padding:10px;display:none;max-height:min(420px,70vh);overflow:auto}
.pop.show{display:block;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.pop .why{font-size:12px;color:var(--ink-3);padding:4px 8px 8px}
.pop .opt{display:flex;justify-content:space-between;width:100%;text-align:left;padding:9px 10px;border-radius:10px;font-size:16px;gap:10px}
.pop .opt:hover,.pop .opt:focus-visible{background:var(--tok-tint);outline:none}
.pop .opt.cur{font-weight:700;color:var(--tok)}
.pop .opt small{color:var(--ink-3);font-size:13px;font-weight:400}
.pop .opt.danger{color:var(--stop)}
.pop .free{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid var(--rule);margin-top:6px}
.pop .free input{flex:1;min-width:0;border:1px solid var(--rule);border-radius:10px;padding:7px 10px;background:var(--base)}
.pop .free button{background:var(--tok);color:var(--tok-on);border-radius:10px;padding:0 12px;font-weight:700}
.scrim{display:none}

/* ---------- render ---------- */
.frozen{position:relative}
.receipt .tok{border-bottom-color:transparent;cursor:default}
.receipt .tok:hover{background:none}
.frozen .sentence{color:var(--ink-3)}
.frozen .sentence .tok{color:var(--ink-3);border-color:transparent;background:none;padding:0}
.inkfill{position:absolute;inset:0;clip-path:inset(0 calc(100% - var(--p,0%)) 0 0);transition:clip-path .6s linear;pointer-events:none}
.inkfill .sentence,.inkfill .sentence .tok{color:var(--ink)}
.inkfill .sentence .tok{color:var(--tok)}
.stages{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
.stage{background:var(--sheet);border-radius:14px;padding:14px;min-height:118px;opacity:.55;transition:opacity .3s}
.stage.now,.stage.done{opacity:1}
.stage h3{margin:0 0 4px;font-family:var(--display);font-size:17px;display:flex;align-items:center;gap:8px}
.stage .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink-3);flex:none}
.stage.now .dot{border-color:var(--tok);border-top-color:transparent;animation:spin .8s linear infinite}
.stage.done .dot{background:var(--ok);border-color:var(--ok)}
@keyframes spin{to{transform:rotate(360deg)}}
.stage p{margin:0;font-size:13px;color:var(--ink-2)}
.leave{margin:var(--s5) 0 var(--s6);font-size:15px;color:var(--ink-2)}

/* ---------- player ---------- */
.player{background:var(--ink);color:var(--sheet);border-radius:var(--r-sheet);padding:24px 28px;box-shadow:var(--shadow)}
.player h2{font-family:var(--display);margin:0;font-size:26px;letter-spacing:-.02em}
.player .sub{color:var(--ink-3);font-size:14px;margin:2px 0 18px}
.pl-row{display:flex;align-items:center;gap:16px}
.play{width:64px;height:64px;border-radius:50%;background:var(--tok);color:var(--tok-on);display:grid;place-items:center;flex:none}
.play svg{width:24px;height:24px}
.track{flex:1;min-width:0}
.bar{position:relative;height:40px}
.bar .seg{position:absolute;top:12px;height:16px;border-radius:4px;opacity:.35}
.bar .head{position:absolute;top:4px;width:2px;height:32px;background:var(--sheet);transition:left .25s linear}
.bar .fill{position:absolute;top:12px;left:0;height:16px;background:var(--sheet);opacity:.18;border-radius:4px;transition:width .25s linear}
.times{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.chap{font-size:14px;margin-top:6px}
.pl-actions{display:flex;gap:12px;align-items:center;margin-top:20px;flex-wrap:wrap}
.dl{background:var(--sheet);color:var(--ink);border-radius:999px;padding:10px 20px;font-weight:700}
.expire{font-size:14px;color:var(--ink-3)}
@media (prefers-color-scheme: dark){
  .player{background:#070C09;color:var(--ink)}
  .bar .head{background:var(--ink)}
  .bar .fill{background:var(--ink)}
  .dl{background:var(--ink);color:var(--base)}
}

/* ---------- coaches ---------- */
.stable{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:var(--s3);margin:0 0 var(--s6)}
.cc{background:var(--sheet);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:6px;border:2px solid transparent}
.cc.cur{border-color:var(--tok)}
.cc b{font-family:var(--display);font-size:17px}
.cc small{color:var(--ink-2);font-size:13px;line-height:1.35;flex:1}
.cc .r{display:flex;justify-content:space-between;align-items:center}
.mini{width:32px;height:32px;border-radius:50%;background:var(--tok-tint);color:var(--tok);display:grid;place-items:center;flex:none}
.mini svg{width:13px;height:13px}
.mini.on{background:var(--tok);color:var(--tok-on)}
.cc .use{font-size:13px;color:var(--tok);font-weight:700}
.cands{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.cand{background:var(--sheet);border-radius:18px;padding:16px;border:2px solid transparent;text-align:left;display:flex;flex-direction:column;gap:10px;transition:border-color .2s,transform .2s}
.cand.pick{border-color:var(--tok);transform:translateY(-3px)}
.cand .L{font-family:var(--display);font-weight:700;font-size:34px;line-height:1}
.wave{display:flex;align-items:center;gap:2px;height:36px}
.wave i{flex:1;background:var(--ink-3);border-radius:2px;transition:background .2s}
.cand.playing .wave i{background:var(--tok);animation:bob .7s ease-in-out infinite alternate}
@keyframes bob{to{transform:scaleY(.4)}}
.cand .cost{font-size:13px;color:var(--ink-2)}
.cand .acts{display:flex;justify-content:space-between;align-items:center}
.cand .choose{font-size:14px;font-weight:700;color:var(--tok)}
.loading-line{font-size:15px;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.loading-line .dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--tok);border-top-color:transparent;animation:spin .8s linear infinite}
.namebox{display:inline-block;min-width:4ch;border:0;border-bottom:.09em solid var(--tok);background:none;color:var(--tok);font-weight:700;font-family:inherit;font-size:inherit;letter-spacing:inherit;outline:none;padding:0;width:7ch}
.done-card{margin-top:var(--s5);background:var(--sheet);border-radius:var(--r-sheet);padding:20px;box-shadow:var(--shadow)}
.done-card h2{font-family:var(--display);margin:0 0 4px}
.empty{font-size:15px;color:var(--ink-2);border:1.5px dashed var(--rule);border-radius:16px;padding:var(--s5)}

/* ---------- prefs ---------- */
.para{display:flex;flex-direction:column;gap:22px;max-width:36em}
.para .sentence{font-size:clamp(22px,.9vw + 13px,32px)}
.checked{font-size:15px;display:flex;gap:10px;align-items:center;color:var(--ok);justify-content:flex-end}

/* ---------- hurt ---------- */
.flags{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--s4)}
.flag{border:1.5px solid var(--rule);border-radius:999px;padding:8px 14px;font-size:15px;background:var(--sheet)}
.flag[aria-pressed="true"]{border-color:var(--stop);color:var(--stop);background:var(--stop-tint);font-weight:700}
.flag.none[aria-pressed="true"]{border-color:var(--ok);color:var(--ok);background:var(--sheet)}
.stopcard{margin-top:var(--s6);border-radius:var(--r-sheet);padding:22px;background:var(--stop-tint);color:var(--ink);border-left:6px solid var(--stop);max-width:52em}
.stopcard h2{font-family:var(--display);margin:0 0 8px;color:var(--stop);font-size:26px;letter-spacing:-.02em}
.stopcard p{margin:0 0 10px;max-width:60ch}
.small-h{font-family:var(--display);font-size:20px;margin:0 0 4px;font-weight:700}

/* ---------- analytics ---------- */
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;align-items:end;height:160px}
.weeks div{background:var(--tok);border-radius:6px 6px 2px 2px;position:relative}
.weeks div.lo{background:var(--tok-tint)}
.weeks-l{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;font-size:12px;color:var(--ink-3);margin-top:4px;text-align:center}
.pats{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;font-size:15px}
.pats .track2{height:10px;background:var(--rule);border-radius:5px;overflow:hidden}
.pats .track2 i{display:block;height:100%;background:var(--tok);border-radius:5px}
.pats .track2 i.lo{background:var(--warn)}
.pats span:last-child{color:var(--ink-2);font-variant-numeric:tabular-nums}

/* ---------- tour ---------- */
.tour{display:grid;grid-template-columns:1fr;gap:0 var(--s6)}
@container (min-width:620px){ .tour{grid-template-columns:1fr 1fr} }
.tour-step{display:grid;grid-template-columns:44px 1fr;gap:4px 14px;padding:var(--s5) 0;border-bottom:1px solid var(--rule)}
.tour-step .n{font-family:var(--display);font-weight:700;font-size:30px;color:var(--tok);line-height:1}
.tour-step h3{margin:0;font-family:var(--display);font-size:21px}
.tour-step p{grid-column:2;margin:0;color:var(--ink-2);max-width:62ch}

/* ---------- misc ---------- */
.back{font-size:14px;color:var(--ink-2);display:inline-flex;gap:6px;align-items:center;align-self:flex-start}
.back:hover{color:var(--tok)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:var(--ink);color:var(--sheet);padding:10px 18px;border-radius:12px;font-size:14px;z-index:80;transition:transform .3s;max-width:calc(100vw - 32px)}
.toast.show{transform:translateX(-50%)}
.corner{position:fixed;bottom:10px;right:12px;z-index:90;font-size:11px;background:var(--ink);color:var(--sheet);padding:3px 9px;border-radius:999px;opacity:.82;pointer-events:none}
.view{animation:viewin .35s ease}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.block+.block{margin-top:var(--s6)}

/* ---------- below 1700: context is a drawer ---------- */
@media (max-width:1699px){
  .ctx{display:block;position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:70;background:var(--base);border-left:1px solid var(--rule);box-shadow:-20px 0 50px -20px rgba(0,0,0,.4);transform:translateX(105%);transition:transform .25s ease;visibility:hidden;padding:var(--s5)}
  .ctx.open{transform:none;visibility:visible}
  .ctx-scrim.show{display:block;position:fixed;inset:0;z-index:65;background:rgba(0,0,0,.28)}
  .ctx-close{display:inline-block!important}
}
.ctx-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s4)}
.ctx-top h2{font-family:var(--display);font-size:20px;margin:0}
.ctx-close{display:none;font-size:14px;color:var(--ink-2)}

/* ---------- phone ---------- */
.chat-toggle{display:none}
@media (max-width:820px){
  .app{display:block;height:auto}
  .band{position:sticky;top:0;display:block;box-shadow:0 10px 24px -18px rgba(0,0,0,.5)}
  .band-left{flex-direction:row;align-items:center;padding:10px 16px 0;gap:12px}
  .band-left .mark{font-size:17px;margin-right:auto}
  .band-left .where,.band-left .lede{display:none}
  .ctx-toggle{margin:0;font-size:12px;padding:3px 10px}
  .band-main{padding:8px 16px 12px;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
  .band-sent{flex-basis:100%}
  .sentence{font-size:19px;line-height:1.38}
  .ask{font-size:24px}
  .band-go{flex-direction:row-reverse;align-items:center;max-width:none;width:100%;justify-content:space-between;text-align:left}
  .go{font-size:17px;padding:9px 22px}
  .pct{font-size:24px}
  .panel{overflow:visible;padding:var(--s5) 16px 170px}
  .chat{position:fixed;left:0;right:0;bottom:0;z-index:40;border-right:0;border-top:1px solid var(--rule);max-height:76vh;border-radius:22px 22px 0 0;box-shadow:0 -14px 40px -20px rgba(0,0,0,.4)}
  .chat-head{display:flex;padding:10px 16px 4px}
  .chat-head .mark{font-size:15px}
  .chat-log{display:none;padding:6px 16px 10px}
  .chat.expanded .chat-log{display:flex;max-height:52vh}
  .chat:not(.expanded) .last-line{display:block}
  .last-line{display:none;font-size:14px;color:var(--ink-2);padding:0 16px 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chat-toggle{display:block;margin-left:auto;font-size:13px;color:var(--tok);font-weight:700}
  .chat-in{padding:8px 12px 12px;border-top:0}
  .hints{flex-wrap:nowrap;overflow-x:auto;margin-top:8px}
  .hints button{flex:none}
  .stages{grid-template-columns:1fr 1fr}
  .pop{left:0!important;right:0;bottom:0;top:auto!important;width:100%;border-radius:20px 20px 0 0;max-height:62vh;padding:14px 12px 22px}
  .scrim.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:55}
  .door .k{display:none}
  .plan{padding:18px 16px 8px}
  .corner{position:static;display:table;margin:6px auto;font-size:10px}
  .stable{grid-template-columns:1fr 1fr}
}
@media (min-width:821px){ .last-line{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="corner">ui-6 · Three zones</div>

<div class="app">
  <header class="band" id="band" aria-label="Today's sentence">
    <div class="band-left" id="bandLeft"></div>
    <div class="band-main" id="bandMain"></div>
  </header>

  <aside class="chat" id="chat" aria-label="Chat with sweatcast">
    <div class="chat-head">
      <div class="mark">Chat</div>
      <button class="chat-toggle" id="chatToggle" aria-expanded="false">Show chat</button>
    </div>
    <div class="last-line" id="lastLine"></div>
    <div class="chat-log" id="log" aria-live="polite"></div>
    <div class="chat-in">
      <form class="say" id="sayForm">
        <label class="sr" for="say">Say it</label>
        <input id="say" autocomplete="off" placeholder="Say it your way: “make it 30, go easy on my knee”">
        <button type="submit">Send</button>
      </form>
      <div class="hints" id="hints"></div>
    </div>
  </aside>

  <main class="panel" id="panelWrap">
    <div id="panel"></div>
  </main>

  <aside class="ctx" id="ctx" aria-label="Your context"></aside>
</div>

<div class="ctx-scrim" id="ctxScrim"></div>
<div class="scrim" id="scrim"></div>
<div class="pop" id="pop" role="dialog" aria-label="Choose a word"></div>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ================= data ================= */
const COACHES = [
  {name:"Coach Reed", blurb:"Low, unhurried, dry humour. Counts only when it matters."},
  {name:"Coach Ellis", blurb:"Bright and precise; says why each move is there."},
  {name:"Coach Nolan", blurb:"Easy-going, warm; good company in the rests."},
  {name:"Coach Owen", blurb:"Crisp and brisk; keeps the clock honest."}
];
const T = {
  minutes:{why:"Your usual length, from your training notes", opts:[10,15,20,25,30,45].map(n=>({v:n,l:n+"-minute"}))},
  goal:{why:"Strength is due: your last session was conditioning", opts:[
    {v:"strength",l:"strength"},{v:"conditioning",l:"conditioning"},{v:"general fitness",l:"general fitness"},{v:"mobility",l:"mobility and breathing"}]},
  kit:{why:"Your first kit. You've used it the last three times", opts:[
    {v:"hotel room",l:"hotel room",s:"bands, a mat"},{v:"home",l:"home",s:"two kettlebells, a mat"},{v:"bodyweight",l:"bodyweight",s:"nothing at all"},{v:"hotel gym",l:"hotel gym",s:"dumbbells to 20 kg, a bike"}]},
  coach:{why:"The coach you used last", opts:COACHES.map(c=>({v:c.name,l:c.name,s:c.blurb.split(";")[0].split(",")[0]})).concat([{v:"__new",l:"Someone new…",s:"make a coach"}])},
  limb:{why:"Your only limit in your health notes", opts:[{v:"left knee",l:"left knee"},{v:"nothing",l:"nothing",s:"I'm fine everywhere"}]},
  limbState:{why:"Unchanged unless you say so", opts:[
    {v:"the same",l:"the same"},{v:"better",l:"better"},{v:"worse",l:"worse",s:"treat it as delicate today"},{v:"__hurt",l:"something's wrong…",s:"open Something hurts",cls:"danger"}]},
  feel:{why:"Normal unless you say otherwise", opts:[
    {v:"normal",l:"normal"},{v:"low",l:"low",s:"tired, short on sleep, stressed"},{v:"fresh",l:"fresh",s:"last one felt easy"},{v:"beaten up",l:"beaten up",s:"last one was too hard"}]}
};
const KIT_HAS = {"hotel room":"Three bands, light to heavy, and a mat","home":"Kettlebells, 12 and 16 kg, and a mat","bodyweight":"Nothing at all","hotel gym":"Dumbbells from 2 to 20 kg and a bike"};
const RECENT = [
  {day:"Tue",p:{minutes:25,goal:"strength",kit:"hotel room"},fb:"a"},
  {day:"Sat",p:{minutes:30,goal:"conditioning",kit:"home"},fb:"b"},
  {day:"Thu",p:{minutes:15,goal:"mobility",kit:"bodyweight"},fb:null,said:"about right"}
];
const S = {
  view:"home", shown:null,
  w:{minutes:25,goal:"strength",kit:"hotel room",coach:"Coach Reed",limb:"left knee",limbState:"the same",feel:"normal"},
  set:new Set(), flash:new Set(), prevRows:"",
  coach:{sound:"warm",who:"woman in her 40s",talk:"patient physio",energy:"steady",never:"shouts"},
  coachSet:new Set(),
  prefs:{level:"novice",love:["kettlebells","intervals"],skip:["burpees"],rests:["science","football","puzzles"],length:25,days:"three"},
  hurt:{area:"left knee",what:"aches",since:"since yesterday",how:"mild",keep:"just for today",flags:new Set()},
  hurtSet:new Set(),
  fb:{a:null,b:null},
  render:{stage:-1,p:0}, play:{on:false,t:0,timer:null}
};
const label = (key,v)=>{const o=(T[key]?.opts||[]).find(o=>o.v===v);return o?o.l:String(v)};
const cap = s=>String(s).replace(/^./,c=>c.toUpperCase());

/* ================= helpers ================= */
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const panel = $("#panel"), log = $("#log"), bandLeft=$("#bandLeft"), bandMain=$("#bandMain"), ctxEl=$("#ctx");
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600)}
function say(who,html,cls=""){
  const d=document.createElement("div");d.className="m "+who+" "+cls;d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight;
  if(who==="a"){ const c=d.cloneNode(true);c.querySelectorAll(".mc,.diff").forEach(x=>x.remove()); $("#lastLine").textContent=c.textContent; }
}
function tok(scope,key,val,opts={}){
  const isSet=(scope==="w"?S.set:scope==="coach"?S.coachSet:scope==="hurt"?S.hurtSet:new Set()).has(key)||opts.set;
  const fl=S.flash.has(scope+"."+key);
  const cls=["tok",isSet?"set":"",fl?"flash":"",opts.cls||""].join(" ");
  return `<button class="${cls}" data-tok="${scope}" data-key="${key}" aria-haspopup="dialog" aria-label="${esc(key)}: ${esc(val)}. Change"><span class="v">${esc(val)}</span></button>`;
}
function go(view){S.view=view;closePop();closeCtx();render();$("#panelWrap").scrollTop=0;window.scrollTo(0,0);setHints()}
const play = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>`;
const pause = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>`;

/* ================= plan model ================= */
function plan(){
  const w=S.w, total=w.minutes*60;
  const share = {strength:[.18,.58,.12,.12],conditioning:[.16,.54,.18,.12],"general fitness":[.18,.56,.14,.12],mobility:[.2,.6,0,.2]}[w.goal];
  let sec = share.map(f=>Math.round(total*f/15)*15);
  sec[1]+= total-sec.reduce((a,b)=>a+b,0);
  const knee = w.limb==="left knee" && w.limbState==="worse";
  const low = w.feel==="low"||w.feel==="beaten up", fresh=w.feel==="fresh";
  const kb = w.kit==="home", gym=w.kit==="hotel gym", bw=w.kit==="bodyweight";
  const load = kb?"kettlebell ":gym?"dumbbell ":bw?"":"band ";
  const sets = (w.minutes>=30?4:3) - (low?1:0) + (fresh?1:0);
  let rows;
  if(w.goal==="mobility"){
    rows=[["Warm-up","Cat-cow, thoracic rotations","slow, 8 each"],
          ["Flow","World's greatest stretch, 90/90 hips, "+(knee?"supported hip flexor stretch":"deep squat hold"),"3 rounds, 45 s each"],
          ["Finisher","—","—"],
          ["Cool-down","Box breathing, legs up the wall","4-4-4-4"]];
  } else {
    const lower = knee? "Glute bridge" : kb?"Goblet squat":gym?"Dumbbell split squat":bw?"Tempo squat":"Banded squat";
    const hinge = knee? (kb?"Kettlebell deadlift, short range":"Band good morning") : kb?"Kettlebell swing":gym?"Dumbbell Romanian deadlift":"Hip hinge, band";
    const push = bw||!gym?"Incline push-up":"Dumbbell floor press";
    const pull = kb?"Single-arm row":gym?"Dumbbell row":bw?"Towel row":"Banded row";
    const fin = w.goal==="conditioning"? (knee?"Seated punches, 30 on 30 off":"Shadow boxing, 30 on 30 off") : (knee?"Dead bug and side plank":"Plank to downward dog");
    rows=[["Warm-up","Marching, arm circles, "+(knee?"bridges":"bodyweight squats"),"easy, building"],
          ["Work",[lower,hinge,push,pull].join(", "),(w.goal==="conditioning"?`${sets} rounds, 40 s on, 20 s off`:`${sets} sets of 8 to 10, `+load+(low?"lighter":"two in the tank"))],
          ["Finisher",fin, w.goal==="conditioning"?"6 rounds":"3 rounds, 30 s"],
          ["Cool-down","Hamstring stretch, child's pose, slow breathing","held, 40 s each"]];
  }
  return rows.map((r,i)=>({block:r[0],mv:r[1],dose:r[2],sec:sec[i]})).filter(r=>r.sec>0);
}
const fmt = s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
const BCLS={"Warm-up":"b-warm","Work":"b-work","Flow":"b-work","Finisher":"b-fin","Cool-down":"b-cool"};
const BCOL={"Warm-up":"var(--tok-tint)","Work":"var(--tok)","Flow":"var(--tok)","Finisher":"var(--engine)","Cool-down":"var(--rule)"};
function planHTML(changed,dim){
  const rows=plan(), total=S.w.minutes*60;
  return `<section class="plan ${dim?"dim":""}" aria-label="Plan preview">
      <div class="plan-head"><h2>${dim?"The plan it's writing to":"The plan, so far"}</h2><span class="meta">${S.w.minutes} minutes, ${esc(S.w.kit)}</span></div>
      <div class="ribbon">${rows.map(r=>`<div class="${BCLS[r.block]}" style="flex-grow:${r.sec}" title="${r.block} ${fmt(r.sec)}">${r.block}</div>`).join("")}</div>
      <div class="ribbon-scale"><span>0:00</span><span>${fmt(total)}</span></div>
      <table class="rows"><thead><tr><th>Block</th><th>Movements and dose</th><th>Time</th></tr></thead><tbody>
      ${rows.map((r,i)=>`<tr class="${changed&&JSON.stringify(changed[i])!==JSON.stringify(r)?"changed-row":""}"><td>${r.block}</td><td class="mvcol"><span class="mv">${esc(r.mv)}</span><span class="dose">${esc(r.dose)}</span></td><td class="sec">${fmt(r.sec)}</td></tr>`).join("")}
      </tbody></table>
      <div class="foot">Rests carry today's weather, a science short and one football story. Every movement comes from your safe menu.</div>
    </section>`;
}
function miniRibbon(){const rows=plan();return `<div class="rib" aria-hidden="true">${rows.map(r=>`<i style="flex-grow:${r.sec};background:${BCOL[r.block]}"></i>`).join("")}</div>`}

/* ================= your context ================= */
function ctxHTML(){
  const w=S.w, c=COACHES.find(x=>x.name===w.coach);
  const blurb=c?c.blurb:"Your own coach";
  const lim = w.limb==="nothing" ? "Nothing on the list" : `${cap(w.limb)}, ${w.limbState==="worse"?"delicate today":"delicate"}`;
  const limS = w.limb==="nothing" ? "Tell me if that changes." : w.limbState==="worse"?"Worse today: no lunges, no jumping, nothing deep.":w.limbState==="better"?"Better. It stays delicate for a week.":"Lighter, shorter range, no impact.";
  const fbDone = S.fb.a&&S.fb.b;
  return `<div class="cx-list">
    <div class="cx" role="group" aria-label="Coach">
      <div class="cx-l"><span>Coach</span><button class="ed" data-act="coach">Change</button></div>
      <div class="cx-row"><button class="mini ${S.sample===w.coach?"on":""}" data-act="sample" data-n="${esc(w.coach)}" aria-label="Hear ${esc(w.coach)}">${S.sample===w.coach?pause:play}</button>
      <div><div class="cx-v">${esc(w.coach)}</div><div class="cx-s">${esc(blurb)}</div></div></div>
    </div>
    <button class="cx" data-act="hurt"><span class="cx-l"><span>Today's limits</span><span class="ed">Edit</span></span><span class="cx-v" style="display:block">${esc(lim)}</span><span class="cx-s" style="display:block">${esc(limS)}</span></button>
    <button class="cx" data-act="kit"><span class="cx-l"><span>Kit</span><span class="ed">Edit</span></span><span class="cx-v" style="display:block">${esc(cap(w.kit))}</span><span class="cx-s" style="display:block">${esc(KIT_HAS[w.kit])}</span></button>
    <div class="cx-box"><div class="cx-l"><span>Last three</span><span>tap to repeat</span></div>
      <div class="cx-sess">${RECENT.map((r,i)=>`<button data-act="again" data-i="${i}"><b>${cap(r.p.goal)} ${r.p.minutes}</b>${r.day}, ${esc(r.p.kit)}, ${r.fb&&!S.fb[r.fb]?"no feedback yet":r.fb?esc(S.fb[r.fb]==="x"?"feedback in":S.fb[r.fb]):esc(r.said)}</button>`).join("")}</div>
    </div>
    ${fbDone?"":`<div class="cx-box"><div class="cx-v" style="font-size:17px">Feedback on 2 older workouts?</div><div class="cx-s">Tuesday's strength 25 and Saturday's conditioning 30.</div>
      <div class="react"><button data-act="fbq" data-v="About right for both">About right</button><button data-act="fbq" data-v="Both ran long">Too long</button><button data-act="feedback">Tell me more</button></div></div>`}
  </div>`;
}
function openCtx(){ctxEl.classList.add("open");$("#ctxScrim").classList.add("show");const b=ctxEl.querySelector("button");b&&b.focus()}
function closeCtx(){if(!ctxEl.classList.contains("open"))return;ctxEl.classList.remove("open");$("#ctxScrim").classList.remove("show")}

/* ================= views: each gives the band and the centre ================= */
function vHome(){
  const w=S.w;
  return {where:null,
    band:`<h1 class="ask">What do you want to do today?</h1>`,
    go:`<button class="go" data-act="go">Make my usual</button><span class="meta">${w.minutes}-minute ${esc(label("goal",w.goal))}, ${esc(w.kit)}, ${esc(w.coach)}</span>`,
    body:`<div class="doors">
      <button class="door primary" data-act="build"><span class="t">Build a workout <em>like Tuesday's, but…</em></span><span class="d">Your usual, written out as one sentence. Change any word.</span><span class="k">one tap to go</span></button>
      <button class="door" data-act="hurt"><span class="t">Something hurts</span><span class="d">A quick update that keeps today's workout safe.</span><span class="k">30 seconds</span></button>
      <button class="door" data-act="prefs"><span class="t">Edit my stuff</span><span class="d">What you love, what you skip, what fills the rests.</span><span class="k">a paragraph</span></button>

function engineClause(){

const pop=$("#pop"), scrim=$("#scrim"); let popCtx=null;
function defsFor(scope,key){
  if(scope==="w")return T[key];
  if(scope==="coach")return CT[key];
  if(scope==="hurt")return HT[key];
  if(scope==="prefs")return PT[key];
  if(scope==="st")return {why:"Range",opts:["4 weeks","8 weeks","this year"].map(v=>({v,l:v}))};
  if(scope==="list")return PT[key];
}
function openPop(el){
  const scope=el.dataset.tok,key=el.dataset.key,d=defsFor(scope,key); if(!d)return;
  document.querySelectorAll(".tok.open").forEach(e=>e.classList.remove("open"));
  el.classList.add("open"); popCtx={scope,key,i:+el.dataset.i,el};
  let cur = scope==="w"?S.w[key]:scope==="coach"?S.coach[key]:scope==="hurt"?S.hurt[key]:scope==="prefs"?S.prefs[key]:null;
  let html=`<div class="why">${esc(d.why)}</div>`;
  if(scope==="list"){
    const arr=S.prefs[key], i=popCtx.i;
    if(i>=0) html+=`<button class="opt danger" data-pick="__remove">Remove “${esc(arr[i])}”</button>`;
    html+=d.sug.filter(s=>!arr.includes(s)).map(s=>`<button class="opt" data-pick="${esc(s)}">${i>=0?"Swap for ":"Add "}${esc(s)}</button>`).join("");
    html+=`<form class="free" data-free><input placeholder="Something else" aria-label="Something else"><button>${i>=0?"Swap":"Add"}</button></form>`;
  } else {
    if(scope==="prefs"&&key==="length")cur=S.prefs.length;
    html+=d.opts.map(o=>`<button class="opt ${o.cls||""} ${String(o.v)===String(cur)?"cur":""}" data-pick="${esc(o.v)}">${esc(o.l)}${o.s?`<small>${esc(o.s)}</small>`:""}</button>`).join("");
    if(["talk","who","sound","area"].includes(key))html+=`<form class="free" data-free><input placeholder="In your words" aria-label="In your words"><button>Use</button></form>`;
  }
  pop.innerHTML=html; pop.classList.add("show"); scrim.classList.add("show");
  const r=el.getBoundingClientRect();
  pop.style.left=Math.max(16,Math.min(r.left,innerWidth-pop.offsetWidth-16))+"px";
  const below=r.bottom+8, h=pop.offsetHeight;
  pop.style.top=(below+h>innerHeight-8?Math.max(8,r.top-h-8):below)+"px";
  (pop.querySelector(".opt.cur")||pop.querySelector(".opt,input")).focus();
}
function closePop(){pop.classList.remove("show");scrim.classList.remove("show");document.querySelectorAll(".tok.open").forEach(e=>e.classList.remove("open"));if(popCtx&&popCtx.el&&document.body.contains(popCtx.el))popCtx.el.focus();popCtx=null}
function pick(v){
  const {scope,key,i}=popCtx; closePop();
  if(scope==="w"){
    if(v==="__new"){say("a","Let's make you a coach. Change any word in the sentence up top, then Audition.");return go("coach")}
    if(v==="__hurt"){S.hurt.area=S.w.limb==="nothing"?"left knee":S.w.limb;say("a","Tell me what's going on. Four words.");return go("hurt")}
    setW({[key]:key==="minutes"?+v:v},"tap");
  } else if(scope==="coach"){S.coach[key]=v;S.coachSet.add(key);S.flash.add("coach."+key);if(S.aud&&S.aud.state)S.aud={};render();}
  else if(scope==="hurt"){S.hurt[key]=v;S.hurtSet.add(key);S.flash.add("hurt."+key);render();}
  else if(scope==="prefs"){S.prefs[key]=key==="length"?+v:v;(S.prefSet=S.prefSet||new Set()).add(key);S.flash.add("prefs."+key);S.prefsDirty=1;S.prefsSaved=0;render();}
  else if(scope==="list"){
    const arr=S.prefs[key];
    if(v==="__remove")arr.splice(i,1); else if(i>=0)arr[i]=v; else if(v&&!arr.includes(v))arr.push(v);
    S.prefsDirty=1;S.prefsSaved=0;render();
  } else if(scope==="st"){toast("Mockup: range changes the numbers.")}
}
pop.addEventListener("click",e=>{const b=e.target.closest("[data-pick]");if(b)pick(b.dataset.pick)});
pop.addEventListener("submit",e=>{e.preventDefault();const v=pop.querySelector("input").value.trim();if(v)pick(v)});
pop.addEventListener("keydown",e=>{
  if(e.key==="Escape")closePop();
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){const o=[...pop.querySelectorAll(".opt")];const k=o.indexOf(document.activeElement);if(k>-1){e.preventDefault();o[(k+(e.key==="ArrowDown"?1:-1)+o.length)%o.length].focus()}}
});
scrim.addEventListener("click",closePop);
document.addEventListener("click",e=>{if(pop.classList.contains("show")&&!pop.contains(e.target)&&!e.target.closest(".tok"))closePop()});

/* ================= workout state changes ================= */
const NAMES={minutes:"length",goal:"goal",kit:"kit",coach:"coach",limb:"limit",limbState:"knee",feel:"feeling"};
function setW(changes,src){
  const diffs=[];
  for(const [k,v] of Object.entries(changes)){
    if(S.w[k]===v){S.set.add(k);continue}
    diffs.push([k,label(k,S.w[k]),label(k,v)]); S.w[k]=v; S.set.add(k); S.flash.add("w."+k);
  }
  if(S.view!=="build"){S.view="build";$("#panelWrap").scrollTop=0}
  closeCtx(); render(); setHints();
  if(src==="tap"&&diffs.length) say("note",diffs.map(d=>`You set ${NAMES[d[0]]} to ${esc(d[2])}`).join(", "));
  return diffs;
}

/* ================= chat parsing ================= */
function parse(text){
  const t=text.toLowerCase(), c={};
  const n=t.match(/\b(10|15|20|25|30|45)\b/); if(n)c.minutes=+n[1];
  if(/\bquick\b/.test(t))c.minutes=15;
  if(/strength/.test(t))c.goal="strength";
  if(/condition|cardio|sweat|hiit/.test(t))c.goal="conditioning";
  if(/mobil|stretch|breath/.test(t))c.goal="mobility";
  if(/general/.test(t))c.goal="general fitness";
  if(/hotel gym/.test(t))c.kit="hotel gym"; else if(/hotel/.test(t))c.kit="hotel room";
  if(/\bhome\b|kettlebell/.test(t))c.kit="home";
  if(/bodyweight|no kit|nothing to use/.test(t))c.kit="bodyweight";
  for(const co of COACHES)if(t.includes(co.name.split(" ")[1].toLowerCase()))c.coach=co.name;
  if(/knee/.test(t)){
    c.limb="left knee";
    if(/worse|easy on|sore|hurts|bad|careful/.test(t))c.limbState="worse";
    else if(/better|fine|good/.test(t))c.limbState="better";
  }
  if(/tired|slept badly|exhausted|stressed|go easy|easy day|low/.test(t)&&!/easy on/.test(t))c.feel="low";
  if(/fresh|strong|too easy/.test(t))c.feel="fresh";
  if(/too hard|wrecked|beaten/.test(t))c.feel="beaten up";
  return c;
}
function intent(t){
  t=t.toLowerCase();
  if(/new coach|make .*coach|design .*coach|different voice/.test(t))return "coach";
  if(/swelling|can't (put|bear) weight|numb|gives way|giving way/.test(t))return "redflag";
  if(/\b(hurts?|injur|pain|tweaked|pulled)\b/.test(t)&&!/knee/.test(t))return "hurt";
  if(/prefer|settings|edit my|my stuff|profile|skip burpees|i love|interests/.test(t))return "prefs";
  if(/analytic|history|stats|how am i doing/.test(t))return "stats";
  if(/feedback/.test(t))return "feedback";
  if(/show me around|tour|how does/.test(t))return "tour";
  if(/^(go|just go|do it)\b/.test(t.trim()))return "go";
  return null;
}
$("#sayForm").addEventListener("submit",e=>{
  e.preventDefault(); const inp=$("#say"), text=inp.value.trim(); if(!text)return; inp.value="";
  say("u",esc(text)); handle(text);
});
function handle(text){
  const it=intent(text);
  if(it==="redflag"){
    S.hurt.flags=new Set();
    const t=text.toLowerCase();
    if(/swelling/.test(t))S.hurt.flags.add("1"); if(/weight/.test(t))S.hurt.flags.add("0"); if(/numb|tingl/.test(t))S.hurt.flags.add("2"); if(/gives way|giving way/.test(t))S.hurt.flags.add("3");
    if(/knee/.test(t))S.hurt.area="left knee";
    S.redSaid=1;
    say("a",`That one's a stop sign. Please read the card before anything else.<div class="mc stopc"><b>Let's not train on this today</b><small>See a doctor or physiotherapist before you load it again.</small><button data-act="hurt">Read it</button></div>`,"stop");
    return go("hurt");
  }
  if(it&&it!=="go"){
    const m={coach:"Here's your stable. Change any word in the sentence up top and I'll audition voices.",hurt:"Tell me where, in four words. I'll keep today's workout around it.",prefs:"Here's you, in a paragraph. Change any word.",stats:"Here's the last eight weeks.",feedback:"Two workouts you haven't told me about.",tour:"Here's the one-minute version."}[it];
    say("a",m); return go(it);
  }
  if(S.view==="coach"){
    const t=text.toLowerCase(), c={};
    if(/woman|female|her/.test(t))c.who=/30/.test(t)?"woman in her 30s":/old/.test(t)?"older woman":"woman in her 40s";
    if(/\bman\b|male|\bhis\b/.test(t))c.who=/30/.test(t)?"man in his 30s":/old/.test(t)?"older man":"man in his 50s";
    for(const s of CT.sound.opts)if(t.includes(s.v))c.sound=s.v;
    for(const s of CT.energy.opts)if(t.includes(s.v))c.energy=s.v;
    if(/physio/.test(t))c.talk="patient physio"; if(/friend/.test(t))c.talk="old friend"; if(/yoga/.test(t))c.talk="yoga teacher";
    const ks=Object.keys(c), before={...S.coach};
    if(ks.length){ks.forEach(k=>{S.coach[k]=c[k];S.coachSet.add(k);S.flash.add("coach."+k)});render();
      say("a",`Rewrote ${ks.length===1?"one word":ks.length+" words"}. Audition when it reads right.<div class="diff">${ks.map(k=>`<span>${k}: <s>${esc(before[k])}</s> <b>${esc(c[k])}</b></span>`).join("")}</div>`);}
    else say("a","I can change how they sound, who they are, how they coach or their energy. Try “older, calmer”.");
    return;
  }
  const c=parse(text);
  if(Object.keys(c).length){
    const diffs=setW(c,"chat");
    const g = it==="go";
    if(diffs.length) say("a",`Done. ${g?"Starting now.":"Tap Go when it reads right."}<div class="diff">${diffs.map(d=>`<span>${NAMES[d[0]]}: <s>${esc(d[1])}</s> <b>${esc(d[2])}</b></span>`).join("")}</div>`);
    else say("a",g?"Starting now.":"That's already what it says. Tap Go when you're ready.");
    if(c.limbState==="worse")setTimeout(()=>say("a","Is it worse for today only, or should I write it into your health notes? Today only, unless you say otherwise."),500);
    if(g)setTimeout(startRender,500);
    return;
  }
  if(it==="go"){ if(S.view!=="build"){go("build")} setTimeout(startRender,300); say("a","Starting now. Same sentence as it stands."); return;}
  say("a","I didn't catch a change there. Try a length, a goal, a kit, a coach, or how you feel. Or tap any blue word.");
}

/* ================= hints ================= */
function setHints(){
  const h={home:["build me a quick one","my back hurts","I want a new coach"],
    build:["make it 30 and go easy on my knee","hotel gym, Ellis","slept badly","just go"],
    coach:["older, calmer","a man in his 30s","more lively"],
    prefs:["show me around"],hurt:["it's swelling fast"],render:[],done:["build me another"],feedback:[],stats:[],tour:["build me a quick one"]}[S.view]||[];
  $("#hints").innerHTML=h.map(x=>`<button data-hint="${esc(x)}">${esc(x)}</button>`).join("");
}
$("#hints").addEventListener("click",e=>{const b=e.target.closest("[data-hint]");if(!b)return;say("u",esc(b.dataset.hint));handle(b.dataset.hint)});

/* ================= render simulation ================= */
function startRender(){
  const card=`<div class="mc"><b>${esc(cap(label("goal",S.w.goal)))} ${S.w.minutes}, ${esc(S.w.kit)}</b>${miniRibbon()}<small>With ${esc(S.w.coach)}. ${plan().length} blocks, every movement on your safe menu.</small></div>`;
  if(S.w.limbState==="worse")say("a",`Knee stays delicate today: ${esc(plan().find(r=>r.block==="Work")?.mv||"")}. Writing now.${card}`);
  else say("a",`Plan's set. ${S.set.size?"":"Your usual, as you'd expect. "}Writing now; you can leave and come back.${card}`);
  if(!S.privacySaid){say("a","Before the first voice render: the script goes to your coach's voice service, and your profile and health notes go to your language model. Both on your own keys.");S.privacySaid=1}
  S.render={stage:0,p:0,sub:""}; go("render");
  const subs=[["Weather fetched","Three stories picked","Quiz written"],["Opening written","Work block coached","Rests filled"],["All movements on your menu","Lint passed","Timing: 24:41 of 25:00"],["Paragraph 12 of 46","Paragraph 31 of 46","Encoding the MP3"]];
  let step=0;const total=12;
  clearInterval(S.rt);
  S.rt=setInterval(()=>{
    step++; const st=Math.min(3,Math.floor((step-1)/3)); S.render.stage=st; S.render.sub=subs[st][(step-1)%3]; S.render.p=Math.round(step/total*100);
    if(S.view==="render")render();
    if(step>=total){clearInterval(S.rt);setTimeout(()=>{S.render.stage=4;
      say("a",`Ready. ${esc(S.w.coach)}'s waiting for you. The MP3 is kept for 24 hours.<div class="mc"><b>${esc(cap(label("goal",S.w.goal)))} ${S.w.minutes}, ${esc(S.w.kit)}</b><small>${fmt(S.w.minutes*60)} with ${esc(S.w.coach)}</small><button data-act="listen">Open the player</button></div>`);
      S.play.t=0;go("done")},700)}
  },650);
}

/* ================= actions (band, centre, context and chat cards) ================= */
function onAct(e){
  const t=e.target.closest(".tok[data-tok]"); if(t){ if(t.classList.contains("open"))return closePop(); openPop(t); return }
  const a=e.target.closest("[data-act]"); if(!a)return; const act=a.dataset.act;
  switch(act){
    case "home": stopPlay(); closeCtx(); return go("home");
    case "build": say("a","Here's your usual, written out up top. Change any blue word, or tell me."); return go("build");
    case "hurt": if(S.view!=="hurt")say("a","Tell me where, in four words."); return go("hurt");
    case "prefs": return go("prefs");
    case "coach": return go("coach");
    case "stats": return go("stats");
    case "tour": return go("tour");
    case "feedback": return go("feedback");
    case "kit": closeCtx(); return go("prefs");
    case "ctx": return ctxEl.classList.contains("open")?closeCtx():openCtx();
    case "ctx-close": return closeCtx();
    case "listen": return go("done");
    case "again":{ setW(RECENT[+a.dataset.i].p,"tap"); return; }
    case "go": return startRender();
    case "play": return togglePlay();
    case "dl": return toast("Mockup: the download would start here.");
    case "fbq": S.fb={a:"x",b:"x"}; say("u",esc(a.dataset.v)); say("a","Noted under feedback. Thanks."); return render();
    case "fb": S.fb[a.dataset.k]=a.dataset.v; return render();
    case "fb-send": say("a",`Got it: Tuesday ${esc(S.fb.a)}, Saturday ${esc(S.fb.b)}. ${/long/.test(S.fb.a+S.fb.b)?"I'll keep the rests shorter.":"I'll keep doing that."}`); return go("home");
    case "sample": S.sample=S.sample===a.dataset.n?null:a.dataset.n; render(); if(S.sample)setTimeout(()=>{S.sample=null;render()},3500); return;
    case "switch": S.w.coach=a.dataset.n; S.set.add("coach"); say("note",`Next workout: ${esc(a.dataset.n)}`); return render();
    case "audition": S.aud={state:"loading"}; render(); say("a","Auditioning. Only the description goes out; about a cent a service.");
      setTimeout(()=>{S.aud={state:"ready"};if(S.view==="coach")render();say("a","Four candidates, A to D, in the middle. Listen and pick by ear.")},2200); return;
    case "cand-play": S.aud.playing=S.aud.playing===a.dataset.l?null:a.dataset.l; render(); return;
    case "cand-pick": S.aud.pick=a.dataset.l; S.aud.state="name"; S.aud.playing=null; render(); setTimeout(()=>{const n=$("#cname");n&&n.focus();n&&n.select()},50); return;
    case "retry": S.aud={}; render(); return;
    case "keep":{ const n=($("#cname").value.trim()||"Wren"); if(COACHES.some(c=>c.name==="Coach "+n)){toast("That name's taken. Pick another.");return}
      const L=S.aud.pick; S.mine="Coach "+n; S.aud={state:"kept"};
      say("a",`Candidate ${esc(L)} it is.<div class="mc"><b>${esc(S.mine)}</b><small>${esc(S.coach.sound)}, ${esc(S.coach.who)}; talks like a ${esc(S.coach.talk)}.</small><button data-act="use-mine">Build a workout with them</button></div>`); return render(); }
    case "use-mine": if(!T.coach.opts.some(o=>o.v===S.mine))T.coach.opts.splice(-1,0,{v:S.mine,l:S.mine,s:"your own"}); S.w.coach=S.mine; S.set.add("coach"); S.flash.add("w.coach"); return go("build");
    case "save-prefs": S.prefsSaved=1;S.prefsDirty=0; say("a","Saved and checked. Nothing to fix."); return render();
    case "toast": return toast(a.dataset.v);
    case "flag":{const f=a.dataset.f, fl=S.hurt.flags;
      if(f==="none"){fl.clear();fl.add("none")} else {fl.delete("none"); fl.has(f)?fl.delete(f):fl.add(f)}
      if([...fl].some(x=>x!=="none")&&!S.redSaid){say("a","That's a red flag. I'll stop here: please see a clinician before training on it.","stop");S.redSaid=1}
      return render();}
    case "flag-clear": S.hurt.flags=new Set(); S.redSaid=0; return render();
    case "hurt-save": case "hurt-only":{
      const h=S.hurt, lvl=h.how==="bad"||h.what==="is sharp when loaded"?"off-limits":"delicate";
      say("a",`Saved: ${esc(h.area)}, ${lvl}, ${esc(h.keep)}.${h.keep!=="just for today"?" Written to your health notes.":""}`);
      if(act==="hurt-save"){ if(h.area==="left knee"){S.w.limb="left knee";S.w.limbState="worse";S.set.add("limbState");S.flash.add("w.limbState")} return go("build"); }
      return go("home");}
    case "fix-hinge": S.w.goal="strength"; S.set.add("goal"); say("a","Next one leans on hinges. It's in the sentence."); return go("build");
  }
}
[bandMain,bandLeft,panel,ctxEl,log].forEach(el=>el.addEventListener("click",onAct));
panel.addEventListener("keydown",e=>{ if(e.target.id==="cname"&&e.key==="Enter"){e.preventDefault();panel.querySelector('[data-act="keep"]').click()} });
$("#ctxScrim").addEventListener("click",closeCtx);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!pop.classList.contains("show"))closeCtx()});

/* ================= player ================= */
function togglePlay(){
  S.play.on=!S.play.on;
  clearInterval(S.play.timer);
  if(S.play.on)S.play.timer=setInterval(()=>{S.play.t=Math.min(S.w.minutes*60,S.play.t+15);if(S.play.t>=S.w.minutes*60)stopPlay();if(S.view==="done")render()},250);
  render();
}
function stopPlay(){S.play.on=false;clearInterval(S.play.timer)}

/* ================= phone chat sheet ================= */
$("#chatToggle").addEventListener("click",()=>{const c=$("#chat"),x=c.classList.toggle("expanded");$("#chatToggle").textContent=x?"Hide chat":"Show chat";$("#chatToggle").setAttribute("aria-expanded",x);if(x)log.scrollTop=log.scrollHeight});

/* ================= boot ================= */
say("a","Morning, Jordan. Pick a door, or just tell me what you want. “25 minutes, hotel, just go” works.");
render(); setHints();
</script>
