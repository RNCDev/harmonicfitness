# HarmonicFitness's settings for this listener: the setup stage, how audio is made, a web build's ceiling, where finished MP3s go, and the speaking rate. The tools read them; setup writes them.
schema = 6
# "quick" until the second half of setup is done (interests, feeds, delivery, your own coach): until then ./harmonicfitness check lists what's left as notes. Say "finish setting me up" to do it.
setup = "quick"
# The audio routes to try, in order (local, fish, elevenlabs, gemini or inworld), when the coach doesn't settle it: a local coach always renders on this computer, and a web coach always speaks through its own service, with its key in me/.env.
render = ["local"]
# Where finished MP3s go: a folder that syncs to your phone. ~ is your home folder and * matches anything (any Google account). Once the copy is there the local MP3 is removed; empty keeps MP3s in me/workouts/. A list gives one folder per computer; each copies to those it has.
deliver_to = ""
# A rough speaking rate (./harmonicfitness get wpm prints it); builds use each coach's measured pace.
words_per_minute = 165
# "pulse" plays a soft tick each second through any quiet of two seconds or more, so a long hold sounds like a clock rather than a dropped earbud, and the coach may leave up to twenty seconds of quiet (eight without it). "off", or unset, plays none.
bed = "off"
