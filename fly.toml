# The web client on Fly.io: the root Dockerfile's one image runs as two process groups, web (the API and
# client, behind Fly's proxy) and worker (the jobs), told apart by HARMONICFITNESS_ROLE (web/entrypoint.sh).
# Secrets (fly secrets): DATABASE_URL (the shared managed Postgres cluster's direct address, not PgBouncer:
# the worker LISTENs), HARMONICFITNESS_MASTER_KEY, HARMONICFITNESS_BASE_URL, HARMONICFITNESS_PROVIDERS.
# Deploy: fly deploy --build-arg GIT_COMMIT_SHA=$(git rev-parse --short HEAD)   (web/README.md, Deploy)

app = "harmonicfitness"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"

[processes]
  web = "env HARMONICFITNESS_ROLE=web sh /app/web/entrypoint.sh"
  worker = "env HARMONICFITNESS_ROLE=worker sh /app/web/entrypoint.sh"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

# A job runs the engine (and ffmpeg) beside the worker: 1 GB each.
[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["web", "worker"]
