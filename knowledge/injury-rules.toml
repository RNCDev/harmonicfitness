# Injury rules: what each body area bans, phase by phase.
#
# Tools read this file through tools/catalog.py; Claude reads the reasons in knowledge/injury-playbook.md,
# under the heading each area's `playbook` names. Every phase lists its full bans, not changes from the
# phase before, and a later phase never bans more tags than an earlier one.
#   ban               tags from knowledge/movements.toml; a movement with any of them is out
#   ban_injured_side  tags that are out on the injured side only (a sided movement is listed "healthy side
#                     only"; a movement that isn't sided is left out)
#   ban_ids           movements the tags miss
#   caution           movement id = the condition it's allowed under, spoken in the setup cue
#   include           rehab movements to add in this phase, listed even if one of their tags is banned here
#   advance_when      what the listener should be able to do before the next phase (empty for return)
#   sources           where the reasons and criteria come from; the playbook says what each one shows
# The rules narrow the choice, never widen it. A clinician's rules in the listener's health file always
# win, and so does anything stricter there. Most bans are conservative judgment, not a study's rule.
format = 1
phases = ["protect", "restore", "rebuild", "return"]

# Ankle --------------------------------------------------------------------------------------------

[areas.ankle]
playbook = "Ankle"

[areas.ankle.protect]
ban = ["impact", "standing", "single-leg-stance", "ankle-push", "ankle-bend", "lateral"]
ban_injured_side = []
ban_ids = [
  "kettlebell-swing", "farmer-carry", "suitcase-carry",
  "bike-seated-sprint", "bike-standing-sprint", "air-bike-sprint", "bike-standing-climb",
  "bike-easy-spin", "bike-steady", "bike-cadence-surge", "air-bike-steady",
  "seated-ankle-alphabet", "seated-ankle-circles", "band-ankle-eversion", "band-ankle-inversion",
  "band-ankle-dorsiflexion", "towel-scrunch",
  "childs-pose", "half-kneeling-kettlebell-press", "half-kneeling-hip-flexor-stretch", "ninety-ninety-hip-switch",
  "side-plank", "single-leg-glute-bridge", "barbell-hip-thrust", "towel-hamstring-curl",
  "lying-dumbbell-hamstring-curl", "pike-push-up", "renegade-row", "bench-dip",
]
caution = { glute-bridge = "Both feet down, only if pain-free.", pillow-squeeze-bridge = "Both feet down, only if pain-free.", dumbbell-glute-bridge = "Both feet down, light, only if pain-free.", hip-thrust = "Both feet down, light, only if pain-free.", side-plank-from-the-knee = "From the knee, so the ankle takes no weight.", push-up = "From the knees, so the ankle takes no weight.", forearm-plank = "From the knees, so the ankle takes no weight.", leg-extension = "Pad above the ankle, light, only if pain-free.", leg-curl-machine = "Pad above the ankle, light, only if pain-free." }
include = []
advance_when = ["The ankle no longer hurts at rest, and the swelling is going down.", "Walks short distances at home without limping."]
sources = ["https://pubmed.ncbi.nlm.nih.gov/29514819/", "https://pubmed.ncbi.nlm.nih.gov/28053200/"]

[areas.ankle.restore]
ban = ["impact", "standing", "single-leg-stance", "ankle-push", "ankle-bend", "lateral"]
ban_injured_side = []
ban_ids = [
  "kettlebell-swing", "farmer-carry", "suitcase-carry",
  "bike-seated-sprint", "bike-standing-sprint", "air-bike-sprint", "bike-standing-climb",
  "band-ankle-inversion", "childs-pose", "barbell-hip-thrust",
]
caution = { glute-bridge = "Both feet down.", box-squat = "Supported, pain-free.", side-plank = "Only with the healthy ankle underneath. Use the knee version on the injured side.", bike-easy-spin = "Light resistance, heel or midfoot centred on the pedal.", bike-steady = "Light resistance, heel or midfoot centred on the pedal.", bike-cadence-surge = "Light resistance, heel or midfoot centred on the pedal.", air-bike-steady = "Light resistance, heel or midfoot centred on the pedal." }
include = ["seated-ankle-alphabet", "seated-ankle-circles", "band-ankle-dorsiflexion", "band-ankle-eversion", "band-ankle-plantar-flexion", "towel-scrunch", "box-squat"]
advance_when = ["Walks normally, without a limp, through a whole day.", "Traces the alphabet with the foot, seated, with little or no pain.", "No new swelling the morning after a session."]
sources = ["https://pubmed.ncbi.nlm.nih.gov/29514819/", "https://pubmed.ncbi.nlm.nih.gov/28053200/"]

[areas.ankle.rebuild]
ban = ["impact", "ankle-push", "single-leg-stance", "lateral"]
ban_injured_side = []
ban_ids = ["kettlebell-swing", "bike-seated-sprint", "bike-standing-sprint", "air-bike-sprint", "bike-standing-climb"]
caution = { seated-calf-raise = "Both feet together, light, pain-free.", single-leg-balance = "Fingertips on the wall at first.", split-squat = "Injured leg behind, only if comfortable.", bike-easy-spin = "Seated, moderate resistance at most.", bike-steady = "Seated, moderate resistance at most.", bike-cadence-surge = "Seated, moderate resistance at most.", air-bike-steady = "Seated, moderate effort at most." }
include = ["single-leg-balance", "seated-calf-raise", "split-squat", "band-ankle-plantar-flexion", "band-ankle-inversion", "band-ankle-eversion", "band-ankle-dorsiflexion"]
advance_when = ["Balances on the injured leg, without a hand on the wall, about as long as on the other leg.", "Does calf raises on both feet, then on the injured foot alone, without pain.", "No pain through a normal day, and no swelling the morning after training."]
sources = ["https://pubmed.ncbi.nlm.nih.gov/28053200/", "https://pubmed.ncbi.nlm.nih.gov/34158354/"]

[areas.ankle.return]
ban = []
ban_injured_side = []
ban_ids = []
caution = {}
include = ["single-leg-balance"]
advance_when = []
sources = ["https://pubmed.ncbi.nlm.nih.gov/34158354/", "https://pubmed.ncbi.nlm.nih.gov/28053200/", "https://pubmed.ncbi.nlm.nih.gov/29514819/"]

