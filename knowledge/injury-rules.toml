advance_when = ["Hinges with a light weight without pain, during or the next morning.", "Sits and stands through a normal day without the pain building."]
sources = ["https://www.nice.org.uk/guidance/ng59/chapter/Recommendations"]

[areas."lower back".return]
ban = []
ban_injured_side = []
ban_ids = []
caution = {}
include = []
advance_when = []
