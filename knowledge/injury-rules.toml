playbook = "Elbow"

[areas.elbow.protect]
ban = ["grip", "hanging", "wrist-load", "shoulder-end-range", "overhead"]
ban_injured_side = []
ban_ids = [
  "biceps-curl", "hammer-curl", "seated-dumbbell-curl", "cable-curl", "triceps-pushdown", "seated-triceps-kickback",
  "overhead-triceps-extension", "floor-press", "dumbbell-bench-press", "bench-press", "incline-bench-press",
  "incline-dumbbell-press", "machine-chest-press", "band-chest-press", "single-arm-cable-press",
  "bent-over-row", "seated-bent-over-row", "chest-supported-row", "band-row", "seated-cable-row",
  "lateral-raise", "seated-lateral-raise", "rear-delt-fly", "face-pull", "cable-pull-through",
  "seated-shadow-boxing", "seated-speed-bag", "shadow-boxing", "sled-push", "air-bike-steady",
]
caution = { goblet-squat = "Hold the weight close, elbows relaxed. Skip it if the elbow complains.", band-pull-apart = "Light band, loose grip, pain-free.", band-external-rotation = "Light band, loose grip, pain-free.", pallof-press = "Light band, loose grip, pain-free." }
include = []
advance_when = ["No elbow pain at rest.", "Lifts a full cup and turns a door handle without sharp pain."]
sources = ["https://blogs.bmj.com/bjsm/2019/04/26/soft-tissue-injuries-simply-need-peace-love/", "https://pubmed.ncbi.nlm.nih.gov/36453071/"]

[areas.elbow.restore]
ban = ["grip", "hanging", "wrist-load", "shoulder-end-range"]
ban_injured_side = []
ban_ids = ["biceps-curl", "hammer-curl", "seated-dumbbell-curl", "cable-curl", "triceps-pushdown", "seated-triceps-kickback", "overhead-triceps-extension", "bench-press", "incline-bench-press", "seated-shadow-boxing", "seated-speed-bag", "seated-overhead-punches", "shadow-boxing"]
caution = { floor-press = "Light, pain-free.", dumbbell-bench-press = "Light, pain-free.", chest-supported-row = "Light, pain-free.", band-row = "Light band, pain-free.", seated-shoulder-press = "Light, pain-free." }
include = []
advance_when = ["Grips and lifts light things through the day without pain.", "Light presses and rows leave no elbow pain the next morning."]
sources = ["https://blogs.bmj.com/bjsm/2019/04/26/soft-tissue-injuries-simply-need-peace-love/", "https://pubmed.ncbi.nlm.nih.gov/36453071/"]

[areas.elbow.rebuild]
ban = ["grip", "hanging"]
ban_injured_side = []
ban_ids = ["seated-shadow-boxing", "seated-speed-bag", "seated-overhead-punches", "shadow-boxing"]
caution = { biceps-curl = "Light, slow on the way down.", hammer-curl = "Light, slow on the way down.", triceps-pushdown = "Light, pain-free.", push-up = "Pain-free only." }
include = []
advance_when = ["Grip on the injured side is close to the other side, without pain.", "Curls and presses with a moderate weight leave no pain the next day."]
sources = ["https://pubmed.ncbi.nlm.nih.gov/36453071/"]

[areas.elbow.return]
ban = []
ban_injured_side = []
ban_ids = []
caution = {}
include = []
advance_when = []
sources = ["https://pubmed.ncbi.nlm.nih.gov/36453071/"]
