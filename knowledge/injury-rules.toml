ban_injured_side = []
ban_ids = ["overhead-press", "thruster", "overhead-triceps-extension", "kettlebell-halo", "half-kneeling-kettlebell-press", "turkish-get-up", "forearm-plank"]
caution = { dead-bug = "Small range. The low back stays quiet.", bird-dog = "Slow, only if pain-free.", side-plank = "Only if pain-free. From the knee if not.", side-plank-from-the-knee = "Only if pain-free.", glute-bridge = "Only if pain-free.", chest-supported-row = "Chest stays on the bench.", seated-shoulder-press = "Back supported against the bench.", dumbbell-pullover = "Light. Ribs down, the low back stays on the bench.", leg-press = "Moderate depth. The low back stays flat on the pad." }
include = []
