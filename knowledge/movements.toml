# The movement catalog (format 2): every movement a session can use, in one vocabulary.
#
# The fixed lists come first (patterns, muscles, areas, flags), then equipment, kit presets and each
# [[movement]]. Tools read this file through tools/catalog.py; `./sweatcast test` checks it.
# A movement says which movement patterns it trains, which muscles, and how much it loads each joint
# area (`loads`, 0 to 3, from none to heavy; `support`, the same for the resting side of a one-sided
# movement), plus flags for position and quality, its intensity, level and timing. An entry is a
# draft until it carries every field; drafts are checked lightly and never planned from.
# `setup` and `cues` are spoken: words only, no digits, symbols or brackets (knowledge/tts-rules.md).
format = 2   # the catalog's own format; the context schema is separate

patterns = ["squat", "hinge", "lunge", "horizontal-push", "vertical-push", "horizontal-pull", "vertical-pull",
            "carry", "rotation", "anti-rotation", "anti-extension", "locomotion", "balance", "arms", "hips",
            "mobility", "breathing", "skill"]

muscles = ["quads", "hamstrings", "glutes", "adductors", "abductors", "calves", "chest", "back", "lats",
           "shoulders", "biceps", "triceps", "forearms", "core", "neck"]

areas = ["foot", "ankle", "calf", "knee", "hamstring", "hip", "groin", "low-back", "rib", "shoulder", "elbow",
         "wrist", "neck"]

flags = ["impact", "single-leg", "kneeling", "floor", "lying-side", "hanging", "overhead", "spine-flexion",
         "spine-twist", "lateral", "fast", "grip"]

[equipment]   # floor and wall are always available, so they aren't listed
dumbbells = { aliases = ["dumbbell", "dumbbells", "adjustable dumbbells", "free weights"], about = "fixed or adjustable dumbbells" }
kettlebell = { aliases = ["kettlebell", "kettlebells", "kettle bell"], about = "one or more kettlebells" }
bench = { aliases = ["bench", "weight bench", "flat bench", "adjustable bench", "incline bench"], about = "a flat or adjustable bench" }
band = { aliases = ["band", "bands", "resistance band", "resistance bands", "loop band", "mini band", "tube band"], about = "resistance bands, long or loop" }
mat = { aliases = ["mat", "yoga mat", "exercise mat", "floor mat"], about = "an exercise mat" }
chair = { aliases = ["chair", "sturdy chair", "dining chair"], about = "a sturdy chair without wheels" }
towel = { aliases = ["towel", "bath towel", "hand towel"], about = "a towel, for rows around a door handle or slides on a hard floor" }
foam-roller = { aliases = ["foam roller", "roller"], about = "a foam roller" }
strap = { aliases = ["strap", "yoga strap", "stretching strap", "stretch strap"], about = "a stretching strap" }
bike = { aliases = ["bike", "exercise bike", "stationary bike", "spin bike", "indoor bike", "upright bike", "recumbent bike"], about = "a stationary bike, upright or recumbent" }
rower = { aliases = ["rower", "rowing machine", "rowing erg"], about = "a rowing machine" }
cable = { aliases = ["cable", "cables", "cable machine", "cable station", "pulley"], about = "a cable station with adjustable pulleys" }
machines = { aliases = ["machine", "machines", "weight machines", "selectorized machines", "plate-loaded machines"], about = "weight machines: leg press, leg extension and curl, chest press, pulldown and the like" }
barbell = { aliases = ["barbell", "barbells", "olympic bar", "weight plates"], about = "a barbell with plates" }
rack = { aliases = ["rack", "squat rack", "power rack", "squat stands"], about = "a squat rack or stands for the barbell" }
ski-erg = { aliases = ["ski erg", "ski machine", "ski ergometer"], about = "a ski ergometer" }
air-bike = { aliases = ["air bike", "fan bike"], about = "a fan-resistance bike that works the arms and legs" }
sled = { aliases = ["sled", "push sled", "drag sled"], about = "a push or drag sled" }
treadmill = { aliases = ["treadmill", "running machine"], about = "a treadmill" }
elliptical = { aliases = ["elliptical", "elliptical trainer", "cross trainer"], about = "an elliptical trainer" }
stair-climber = { aliases = ["stair climber", "stair machine", "stair stepper"], about = "a stair climber" }
stick-and-ball = { aliases = ["stick and ball", "dryland ball", "stickhandling ball"], about = "a stick and a dryland ball for stickhandling drills" }

[presets.bodyweight]
equipment = []

[presets.hotel-room]
equipment = ["chair", "towel"]

[presets.hotel-gym]
equipment = ["dumbbells", "bench", "treadmill", "elliptical", "bike", "mat"]

[presets.full-gym]   # everything but the stick and ball
equipment = ["dumbbells", "kettlebell", "bench", "band", "mat", "chair", "towel", "foam-roller", "strap",
             "bike", "rower", "cable", "machines", "barbell", "rack", "ski-erg", "air-bike", "sled",
             "treadmill", "elliptical", "stair-climber"]

