# The movement catalog (format 3): every movement a session can use, in one vocabulary.
#
# The fixed lists come first (patterns, muscles, areas, flags), then equipment, kit presets and each
# [[movement]]. Tools read this file through tools/catalog.py; `./harmonicfitness test` checks it.
# A movement says which movement patterns it trains, which muscles, and how much it loads each joint
# area (`loads`, 0 to 3, from none to heavy; `support`, the same for the resting side of a one-sided
# movement), plus flags for position and quality, its intensity, level and timing. An entry is a
# draft until it carries every field; drafts are checked lightly and never planned from.
# `setup` and `cues` are spoken: words only, no digits, symbols or brackets (knowledge/tts-rules.md).
#
# How to annotate an entry (set `draft = false` only when every field is filled):
# - `patterns`: the first is the primary one, what the session builder matches a slot on. `arms` is
#   upper-body isolation, `hips` hip and other lower-body isolation (calf raise, leg extension).
# - `loads` rates the working side: 3 for the joint the movement is about under load (bodyweight
#   counts: an air squat is knee 3), 2 for a joint bending deep or bearing weight, 1 for a joint that
#   stabilises, nothing for the rest. When unsure, rate up: a delicate area excludes loads of 2 or
#   more, an off-limits one any load at all, so an underrated load is the dangerous mistake. A knee
#   on the floor, or a forearm under a plank, bears weight: 2.
# - `support` (sided entries only) rates the resting or stance side the same way: the back leg of a
#   split squat, the planted hand of a one-arm row.
# - `flags`: floor for anything down on the floor, kneeling, lying-side, single-leg (lunges and other
#   one-leg-dominant work), overhead, grip (carries, rows, deadlifts, pulldowns), impact and fast
#   (jumping and sprinting; fast alone for swings, punches and surges), spine-flexion, spine-twist,
#   lateral (side-to-side travel), hanging.
# - `effort` (conditioning entries only, and every one of them): easy for a warm-up pace you could talk
#   through (marching, an easy spin, a walk), moderate for a steady push of five or six out of ten
#   (a steady ride, jumping jacks, an incline walk), hard for efforts of seven and up (sprints, climbs,
#   high knees, swings). Interval work never takes an easy entry; warm-ups never take a hard one.
# - `level`, the least experience it suits: novice for bodyweight and simple moves, plus the loaded
#   ones a beginner is taught first, such as the goblet squat, kettlebell deadlift, hip thrust, floor
#   press, supported rows, seated press, machine press, pulldown and leg press, and carries;
#   experienced for loaded compound lifts and intervals, and for a bodyweight move with an easier
#   novice version (push-up, whose novice version is the incline push-up); advanced for barbell
#   lifts, swings, sprints and single-leg loaded work.
# - `seconds_per_rep`: 3 for controlled strength reps, 2 for fast or small reps, 4 for slow eccentrics.
# - `hold_seconds`: 30 for planks, carries, stretches and hard cardio efforts, 60 for easy cardio
#   blocks and breathing, 20 for sprints, 45 for skill drills.
# - `transition_seconds`: 10 for bodyweight (and a chair or towel) and for the next block on a cardio
#   machine, 15 for dumbbells, kettlebells or bands, 25 for barbell or strength machines.
# - Coaching, for a listener who can't see a demonstration or a mirror (spoken, like `setup` and `cues`;
#   optional on a draft, expected on a finished entry): `rep`, what one rep is (and whether reps count
#   per side), or for a timed entry what is held and what ends it, with a talk test on conditioning;
#   `feel`, where it should be felt and where not; `faults`, one to three common mistakes, each with the
#   cue that fixes it, safety first. `./harmonicfitness brief` prints them for every movement on today's menu,
#   and `./harmonicfitness movements --about <ids>` for any.
# - `[limit_cues]` (after the kit presets), one table per area in `areas`, each with `off-limits` and
#   `delicate`: one to three spoken lines a coach says while that limit is active, generic and
#   practical (where the head, the resting foot or the arm goes, how to get to and from the floor).
#   `{side}` in a line stands for the limit's side, left or right, or "injured" (off limits) or "sore"
#   (delicate) when the limit is on both sides; it is the only brace a line may hold.
#   `./harmonicfitness brief` prints the lines for each limit active today.
# - `[unlisted]` (before the limit cues): names of real movements the catalog doesn't hold, which the
#   build refuses in a script; never a name or alias of an entry.
format = 3   # the catalog's own format; the context schema is separate

patterns = ["squat", "hinge", "lunge", "horizontal-push", "vertical-push", "horizontal-pull", "vertical-pull",
            "carry", "rotation", "anti-rotation", "anti-extension", "locomotion", "balance", "arms", "hips",
            "mobility", "breathing", "skill"]

muscles = ["quads", "hamstrings", "glutes", "adductors", "abductors", "calves", "chest", "back", "lats",
           "shoulders", "biceps", "triceps", "forearms", "core", "neck"]

areas = ["foot", "ankle", "calf", "knee", "hamstring", "hip", "groin", "low-back", "rib", "shoulder", "elbow",
         "wrist", "neck"]

flags = ["impact", "single-leg", "kneeling", "floor", "lying-side", "hanging", "overhead", "spine-flexion",
         "spine-twist", "lateral", "fast", "grip"]

[equipment]   # floor and wall are always available, so they aren't listed
dumbbells = { aliases = ["dumbbell", "dumbbells", "adjustable dumbbells", "free weights"], about = "fixed or adjustable dumbbells" }
kettlebell = { aliases = ["kettlebell", "kettlebells", "kettle bell"], about = "one or more kettlebells" }
bench = { aliases = ["bench", "weight bench", "flat bench", "adjustable bench", "incline bench"], about = "a flat or adjustable bench" }
band = { aliases = ["band", "bands", "resistance band", "resistance bands", "loop band", "mini band", "tube band"], about = "resistance bands, long or loop" }
mat = { aliases = ["mat", "yoga mat", "exercise mat", "floor mat"], about = "an exercise mat" }
chair = { aliases = ["chair", "sturdy chair", "dining chair"], about = "a sturdy chair without wheels" }
towel = { aliases = ["towel", "bath towel", "hand towel"], about = "a towel, for rows around a door handle or slides on a hard floor" }
foam-roller = { aliases = ["foam roller", "roller"], about = "a foam roller" }
strap = { aliases = ["strap", "yoga strap", "stretching strap", "stretch strap"], about = "a stretching strap" }
bike = { aliases = ["bike", "exercise bike", "stationary bike", "spin bike", "indoor bike", "upright bike", "recumbent bike"], about = "a stationary bike, upright or recumbent" }
rower = { aliases = ["rower", "rowing machine", "rowing erg"], about = "a rowing machine" }
cable = { aliases = ["cable", "cables", "cable machine", "cable station", "pulley"], about = "a cable station with adjustable pulleys" }
machines = { aliases = ["machine", "machines", "weight machines", "selectorized machines", "plate-loaded machines"], about = "weight machines: leg press, leg extension and curl, chest press, pulldown and the like" }
barbell = { aliases = ["barbell", "barbells", "olympic bar", "weight plates"], about = "a barbell with plates" }
rack = { aliases = ["rack", "squat rack", "power rack", "squat stands"], about = "a squat rack or stands for the barbell" }
ski-erg = { aliases = ["ski erg", "ski machine", "ski ergometer"], about = "a ski ergometer" }
air-bike = { aliases = ["air bike", "fan bike"], about = "a fan-resistance bike that works the arms and legs" }
sled = { aliases = ["sled", "push sled", "drag sled"], about = "a push or drag sled" }
treadmill = { aliases = ["treadmill", "running machine"], about = "a treadmill" }
elliptical = { aliases = ["elliptical", "elliptical trainer", "cross trainer"], about = "an elliptical trainer" }
stair-climber = { aliases = ["stair climber", "stair machine", "stair stepper"], about = "a stair climber" }
stick-and-ball = { aliases = ["stick and ball", "dryland ball", "stickhandling ball"], about = "a stick and a dryland ball for stickhandling drills" }

[presets.bodyweight]
equipment = []

[presets.hotel-room]
equipment = ["chair", "towel"]

[presets.hotel-gym]
equipment = ["dumbbells", "bench", "treadmill", "elliptical", "bike", "mat"]

[presets.full-gym]   # everything but the stick and ball
equipment = ["dumbbells", "kettlebell", "bench", "band", "mat", "chair", "towel", "foam-roller", "strap",
             "bike", "rower", "cable", "machines", "barbell", "rack", "ski-erg", "air-bike", "sled",
             "treadmill", "elliptical", "stair-climber"]

# Unlisted: real movements the catalog doesn't hold (yet: a catalog entry needs sourced research), so
# they are never on a menu. The build's menu scan refuses each one said in a script ("pistol squats"),
# except a bare "lunges" after a declared lunge, which is its short form. Never a name or alias of an
# entry here (the load refuses that). Singular and plural both match ("lunges" catches "a lunge").
[unlisted]
names = ["pistol squat", "pistols", "forward lunge", "walking lunge", "side lunge", "lateral lunge", "lunges"]

# Limit cues: what a coach says while a limit is active, for each area and level, one to three lines.
# `./harmonicfitness brief` prints them for each limit today. `{side}` becomes the limit's side (left or
# right), or "injured" (off limits) or "sore" (delicate) for a limit on both sides or none.

[limit_cues.foot]
off-limits = ["Keep the {side} foot off the floor and out of every push, resting on its heel or lifted clear.",
              "Get to and from the floor with your hands and hips doing the work, never pushing through the {side} foot.",
              "On a bench, rest the {side} heel on the bench or the floor without pressing, and leave the drive to your hands and hips."]
delicate = ["Keep the {side} foot flat and quiet. No hopping, bouncing or springing off the toes.",
            "Let your hands do the work getting up and down, with the {side} foot resting lightly."]

[limit_cues.ankle]
off-limits = ["Nothing standing today. Every station is seated or lying, and the {side} foot rests, never pushing.",
              "To get to and from the floor, sit on the bench or a chair first, then lower yourself with your hands, keeping the {side} foot clear.",
              "Lying or seated, rest the {side} heel with the ankle relaxed, not pointed or rolled, and keep that foot out of any drive."]
delicate = ["Keep the {side} foot flat and steady. No hopping, bouncing or quick footwork.",
            "Step, don't jump, between stations, and keep your stances short and stable.",
            "If the {side} ankle twinges, sit down and take the seated version."]

[limit_cues.calf]
off-limits = ["No rising onto the toes and no driving off the {side} foot.",
              "Keep the {side} heel down or the leg resting, and get up and down with your hands, not by pointing that foot."]
delicate = ["Keep the {side} heel down and the pace smooth, no springing off the toes.",
            "Take shorter steps and less incline if the {side} calf tightens."]

[limit_cues.knee]
off-limits = ["Keep the {side} knee out of the work. It rests straight or gently bent, with no weight through it.",
              "Don't kneel on the {side} knee. Take the lying or seated version instead.",
              "To get up from the floor, roll to your side and use your hands, not a push through the {side} knee."]
delicate = ["Keep the {side} knee tracking over the toes, and stop each bend before any pinch.",
            "Go only as deep as stays comfortable, and slow on the way down.",
            "Put a folded towel under the {side} knee if you kneel."]

[limit_cues.hamstring]
off-limits = ["Nothing that stretches or loads the back of the {side} thigh. No hinging forward and no long-leg reaches.",
              "Keep the {side} knee softly bent whenever that leg is out straight."]
delicate = ["Hinge only as far as a mild pull at the back of the {side} thigh, never a sharp one.",
            "No fast kicks or sprinting. Keep the leg work slow and smooth."]

[limit_cues.hip]
off-limits = ["Keep the {side} hip out of the work, with no deep bends and no one-leg weight on that side.",
              "To get down or up, roll onto your side and use your hands, without twisting through the hips."]
delicate = ["Stay in a range that feels easy at the front and side of the {side} hip, and stop short of any pinch.",
            "Keep your stances moderate, never wide or very deep."]

[limit_cues.groin]
off-limits = ["No side lunges or wide stances, and no legs spread apart. Keep the knees about hip width.",
              "Bring the legs together before you get up or down, and move the {side} leg slowly."]
delicate = ["Keep the feet about hip width, never wide, and the knees in line with the toes.",
            "No quick side steps, and stop any stretch at the first pull in the inner thigh."]

[limit_cues.low-back]
off-limits = ["Brace gently before every rep and keep the spine long and still. No rounding and no twisting.",
              "To get up from lying down, bend the knees, roll onto your side and push up with your hands.",
              "Lift nothing from the floor. Set the weights up where you'll use them."]
delicate = ["Brace before each rep and keep a neutral spine, the ribs stacked over the hips.",
            "Roll to your side to get up from the floor, and stop any rep that pinches the back."]

[limit_cues.rib]
off-limits = ["Breathe easily all the way through. No holding the breath and no hard bracing.",
              "No twisting, and no lying on the {side} side.",
              "Get up by rolling away from the {side} side and pushing up with your hands."]
delicate = ["Breathe out on the effort and never hold your breath.",
            "Keep any twist small and slow, and stop at the first catch in the ribs."]

[limit_cues.shoulder]
off-limits = ["Keep the {side} arm out of the work, resting by your side or in your lap.",
              "Get up and down without putting any weight through the {side} arm."]
delicate = ["Keep the {side} elbow below shoulder height, with no reaching overhead.",
            "Set the shoulder blades down and back before each rep, and stop at any pinch at the front of the shoulder."]

[limit_cues.elbow]
off-limits = ["Keep the {side} arm out of the work, with no gripping, pushing or pulling through it.",
              "Don't lean on the {side} elbow or hand to get up or down."]
delicate = ["Keep the {side} elbow soft, never snapping straight, and hold the weight with a light grip.",
            "Stop any rep that sends pain along the forearm."]

[limit_cues.wrist]
off-limits = ["No weight through the {side} hand. Keep that hand off the floor and out of every grip.",
              "Get up and down without pushing through the {side} hand."]
delicate = ["Keep the {side} wrist straight, in line with the forearm, not bent back.",
            "On the floor, make a fist or drop to the forearm if the {side} wrist complains."]

[limit_cues.neck]
off-limits = ["Keep the head still and in line with the spine, eyes on one spot, no nodding or turning.",
              "Lying on your back, leave the head resting on the floor. Don't lift it to look.",
              "Bent over or on all fours, look at the floor just ahead of you, not up and not tucked."]
delicate = ["Keep the head in line with the spine. Bent over, eyes on the floor a little ahead, and lying down, head resting.",
            "Don't pull on the head, and keep the chin gently tucked, not jutting forward.",
            "Relax the jaw and keep the shoulders away from the ears."]

