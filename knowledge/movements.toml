[presets.bodyweight]
equipment = []

[presets.hotel-room]
equipment = ["chair", "towel"]

[presets.hotel-gym]
equipment = ["dumbbells", "bench", "treadmill", "elliptical", "bike", "mat"]

[presets.full-gym]   # everything but the stick and ball, the stairs and the outdoors
equipment = ["dumbbells", "kettlebell", "bench", "band", "mini-band", "mat", "chair", "towel", "foam-roller", "strap",
             "bike", "rower", "cable", "machines", "barbell", "rack", "smith-machine", "ski-erg", "air-bike", "sled",
             "treadmill", "elliptical", "stair-climber", "pull-up-bar", "dip-station", "suspension-trainer",
             "medicine-ball", "slam-ball", "box", "sliders", "stability-ball", "ab-wheel", "battle-ropes",
             "landmine", "trap-bar", "jump-rope", "ankle-weights", "balance-pad", "push-up-handles", "weight-vest"]
# Unlisted: real movements the catalog doesn't hold, so they are never on a menu: some not yet researched (a
# catalog entry needs sourced research), others left out on purpose for a listener coached by ear alone, with no
# one watching (Olympic lifts, kipping and swinging on a bar, full head circles, double unders). The build's menu scan refuses each one said in a script ("pistol squats"),
# except a bare "lunges" after a declared lunge, which is its short form. Never a name or alias of an
# entry here (the load refuses that). Singular and plural both match ("lunges" catches "a lunge").
[unlisted]
names = ["pistol squat", "pistols", "lunges", "neck circles", "sissy squat", "dragon flag", "muscle-up",
         "kipping pull-up", "butterfly pull-up", "power clean", "hang clean", "barbell snatch", "kettlebell snatch",
         "clean and jerk", "jefferson curl", "behind-the-neck press", "upright row", "double under"]

# Limit cues: what a coach says while a limit is active, for each area and level, one to three lines.
# `./harmonicfitness brief` prints them for each limit today. `{side}` becomes the limit's side (left or
# right), or "injured" (off limits) or "sore" (delicate) for a limit on both sides or none.

[limit_cues.foot]
off-limits = ["Keep the {side} foot off the floor and out of every push, resting on its heel or lifted clear.",
              "Get to and from the floor with your hands and hips doing the work, never pushing through the {side} foot.",
              "On a bench, rest the {side} heel on the bench or the floor without pressing, and leave the drive to your hands and hips."]
delicate = ["Keep the {side} foot flat and quiet. No hopping, bouncing or springing off the toes.",
            "Let your hands do the work getting up and down, with the {side} foot resting lightly."]

[limit_cues.ankle]
off-limits = ["Nothing standing today. Every station is seated or lying, and the {side} foot rests, never pushing.",
              "To get to and from the floor, sit on the bench or a chair first, then lower yourself with your hands, keeping the {side} foot clear.",
              "Lying or seated, rest the {side} heel with the ankle relaxed, not pointed or rolled, and keep that foot out of any drive."]
delicate = ["Keep the {side} foot flat and steady. No hopping, bouncing or quick footwork.",
            "Step, don't jump, between stations, and keep your stances short and stable.",
            "If the {side} ankle twinges, sit down and take the seated version."]

[limit_cues.calf]
off-limits = ["No rising onto the toes and no driving off the {side} foot.",
              "Keep the {side} heel down or the leg resting, and get up and down with your hands, not by pointing that foot."]
delicate = ["Keep the {side} heel down and the pace smooth, no springing off the toes.",
            "Take shorter steps and less incline if the {side} calf tightens."]

[limit_cues.knee]
off-limits = ["Keep the {side} knee out of the work. It rests straight or gently bent, with no weight through it.",
              "Don't kneel on the {side} knee. Take the lying or seated version instead.",
              "To get up from the floor, roll to your side and use your hands, not a push through the {side} knee."]
delicate = ["Keep the {side} knee tracking over the toes, and stop each bend before any pinch.",
            "Go only as deep as stays comfortable, and slow on the way down.",
            "Put a folded towel under the {side} knee if you kneel."]

[limit_cues.hamstring]
off-limits = ["Nothing that stretches or loads the back of the {side} thigh. No hinging forward and no long-leg reaches.",
              "Keep the {side} knee softly bent whenever that leg is out straight."]
delicate = ["Hinge only as far as a mild pull at the back of the {side} thigh, never a sharp one.",
            "No fast kicks or sprinting. Keep the leg work slow and smooth."]

[limit_cues.hip]
off-limits = ["Keep the {side} hip out of the work, with no deep bends and no one-leg weight on that side.",
              "To get down or up, roll onto your side and use your hands, without twisting through the hips."]
delicate = ["Stay in a range that feels easy at the front and side of the {side} hip, and stop short of any pinch.",
            "Keep your stances moderate, never wide or very deep."]

[limit_cues.groin]
off-limits = ["No side lunges or wide stances, and no legs spread apart. Keep the knees about hip width.",
              "Bring the legs together before you get up or down, and move the {side} leg slowly."]
delicate = ["Keep the feet about hip width, never wide, and the knees in line with the toes.",
            "No quick side steps, and stop any stretch at the first pull in the inner thigh."]

[limit_cues.low-back]
off-limits = ["Brace gently before every rep and keep the spine long and still. No rounding and no twisting.",
              "To get up from lying down, bend the knees, roll onto your side and push up with your hands.",
              "Lift nothing from the floor. Set the weights up where you'll use them."]
delicate = ["Brace before each rep and keep a neutral spine, the ribs stacked over the hips.",
            "Roll to your side to get up from the floor, and stop any rep that pinches the back."]

[limit_cues.rib]
off-limits = ["Breathe easily all the way through. No holding the breath and no hard bracing.",
              "No twisting, and no lying on the {side} side.",
              "Get up by rolling away from the {side} side and pushing up with your hands."]
delicate = ["Breathe out on the effort and never hold your breath.",
            "Keep any twist small and slow, and stop at the first catch in the ribs."]

[limit_cues.shoulder]
off-limits = ["Keep the {side} arm out of the work, resting by your side or in your lap.",
              "Get up and down without putting any weight through the {side} arm."]
delicate = ["Keep the {side} elbow below shoulder height, with no reaching overhead.",
            "Set the shoulder blades down and back before each rep, and stop at any pinch at the front of the shoulder."]

[limit_cues.elbow]
off-limits = ["Keep the {side} arm out of the work, with no gripping, pushing or pulling through it.",
              "Don't lean on the {side} elbow or hand to get up or down."]
delicate = ["Keep the {side} elbow soft, never snapping straight, and hold the weight with a light grip.",
            "Stop any rep that sends pain along the forearm."]

[limit_cues.wrist]
off-limits = ["No weight through the {side} hand. Keep that hand off the floor and out of every grip.",
              "Get up and down without pushing through the {side} hand."]
delicate = ["Keep the {side} wrist straight, in line with the forearm, not bent back.",
            "On the floor, make a fist or drop to the forearm if the {side} wrist complains."]

[limit_cues.neck]
off-limits = ["Keep the head still and in line with the spine, eyes on one spot, no nodding or turning.",
              "Lying on your back, leave the head resting on the floor. Don't lift it to look.",
              "Bent over or on all fours, look at the floor just ahead of you, not up and not tucked."]
delicate = ["Keep the head in line with the spine. Bent over, eyes on the floor a little ahead, and lying down, head resting.",
            "Don't pull on the head, and keep the chin gently tucked, not jutting forward.",
            "Relax the jaw and keep the shoulders away from the ears."]

