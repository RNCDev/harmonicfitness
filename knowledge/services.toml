# The web voice services HarmonicFitness can design coaches on and render with, each with the listener's own
# key in me/.env. Read only through tools/cloud.py (cloud.services()): this file is the one list of them,
# in order, and a route is "local" or one of these. A new service is a section here and tools/services/<id>.py.
#
# Prices change: every rate here is approximate, checked on the date below from each service's
# pricing page, and shown to the listener as approximate. A release updates them.
# tried_live: whether someone has run the service live. Until then setup, the readiness check and the
# docs label it "not yet tried live".
#
# key_var, key_page: the key's name in me/.env, and where the listener gets one.
# billing_page: where the listener sees what's left on the account (the web app's Settings links to it).
# unit: what the service bills by (characters, or UTF-8 bytes for Fish).
# usd_per_million: dollars per million billed units, by model.
# design_usd: what one voice design costs (absent: the service doesn't publish it).
# concurrency: requests at once, under the lowest paid plan's limit.
# max_chars: the most characters one request may carry (0: no documented limit).
# candidates: how many voices an audition asks this service for (lettered in this file's order).
# note: a caveat shown beside the service.

rates_checked = "2026-10-25"

[fish]
name = "Fish Audio"
url = "https://api.fish.audio"
key_var = "FISH_AUDIO_API_KEY"
key_page = "https://fish.audio/app/api-keys/"
billing_page = "https://fish.audio/app/billing/"
default_model = "s2.1-pro"
models = { "s2.1-pro" = "Fish's current model", "s2-pro" = "the previous model" }
unit = "bytes"
usd_per_million = { "s2.1-pro" = 15, "s2-pro" = 15 }
design_usd = 0.01            # about $0.01 a voice-design request
concurrency = 5
max_chars = 0
candidates = 2
tried_live = true

[elevenlabs]
name = "ElevenLabs"
url = "https://api.elevenlabs.io"
key_var = "ELEVENLABS_API_KEY"
key_page = "https://elevenlabs.io/app/settings/api-keys"
billing_page = "https://elevenlabs.io/app/subscription"
default_model = "eleven_v4"
models = { "eleven_v4" = "the more natural voice (about $1.60 a 20,000-character workout)", "eleven_v4_turbo" = "faster and cheaper (about $0.80 a workout)" }
unit = "characters"
usd_per_million = { "eleven_v4" = 80, "eleven_v4_turbo" = 40 }
concurrency = 2
max_chars = 10000
candidates = 3
note = "not yet tried on a Free account; Free keeps 3 voices and a monthly allowance"
tried_live = true

[gemini]
name = "Gemini"
url = "https://generativelanguage.googleapis.com"
key_var = "GEMINI_API_KEY"
key_page = "https://aistudio.google.com/apikey"
billing_page = "https://aistudio.google.com/billing"
default_model = "gemini-3.8-flash-tts"
models = { "gemini-3.8-flash-tts" = "Gemini's current speech model", "gemini-3.8-flash-lite-tts" = "cheaper, a little less natural" }
unit = "characters"
# gemini-3.8-flash-tts: the effective rate from $0.27 per 20,000 characters; it doubles to 27 from 2027-01-01
usd_per_million = { "gemini-3.8-flash-tts" = 13.5, "gemini-3.8-flash-lite-tts" = 9 }
design_usd = 0.01            # about $0.01 a voice design (spec decision 2, 2026-10-25)
concurrency = 2
max_chars = 0
candidates = 1
tried_live = true

[inworld]
name = "Inworld"
url = "https://api.inworld.ai"
key_var = "INWORLD_API_KEY"
key_page = "https://platform.inworld.ai/api-keys"
billing_page = "https://platform.inworld.ai/billing"
default_model = "inworld-tts-2"
models = { "inworld-tts-2" = "Inworld's current speech model", "inworld-tts-2-flash" = "faster and cheaper" }
unit = "characters"
usd_per_million = { "inworld-tts-2" = 25, "inworld-tts-2-flash" = 15 }
concurrency = 5
max_chars = 2000
candidates = 2
tried_live = true
