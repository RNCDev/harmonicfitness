# Session methods and dose rules (format 2), read only through tools/sessions.py.
#
# A method is the shape of a session's main work: how its time is shared between warm-up, work,
# an optional finisher and cool-down; which movement patterns fill its slots, in order; and the
# kind of work (sets, pairs, rounds, intervals or holds). The dose tables give each intensity's
# ranges by level. Every number says where it comes from: `# source:` names an opened source with
# its URL, `# house default:` is a planning choice with its reason. Sources are those cited in
# knowledge/programming.md and in docs/research/2026-10-21-session-structure-notes.md, nothing else.
#
# Shares are fractions of the session's minutes; each `seconds = [least, most]` clamps them.
# Block shares split what is left for the work and sum to one.

format = 2

goals = ["strength", "general", "targeted", "conditioning", "mobility", "skill"]

# Strength methods -------------------------------------------------------------------------------

[methods.straight-sets]
about = "One movement at a time, every set of it with rest between, then the next movement."
goals = ["strength", "targeted", "general"]
minutes = [25, 60]   # house default: from the research note's synthesis table, a proposal, not a finding
levels = ["novice", "experienced", "advanced"]
warmup = { share = 0.15, seconds = [120, 360] }     # house default: short and specific, as Iversen advises; no opened source scales it with length
cooldown = { share = 0.10, seconds = [120, 300] }   # house default: slow breathing to close; no opened source gives a length
finisher = { share = 0.10, seconds = [90, 300], from_minutes = 25 }   # house default: the finisher is house policy in programming.md
work = "sets"
# Multi-joint lower and upper patterns first, as HPRC's summary of the NSCA order puts them
# https://www.hprc-online.org/physical-fitness/training-performance/choosing-right-exercises-optimize-your-resistance-training

[methods.paired-sets]
about = "Two movements in turn, a push with a pull or an upper with a lower, so one side rests while the other works."
goals = ["strength", "targeted", "general"]
minutes = [20, 60]   # house default: pairing roughly halves session time, after Iversen https://pmc.ncbi.nlm.nih.gov/articles/PMC8449772, so it starts shorter than straight sets
levels = ["novice", "experienced", "advanced"]
warmup = { share = 0.15, seconds = [120, 360] }     # house default: short and specific, as Iversen advises; no opened source scales it with length
cooldown = { share = 0.10, seconds = [120, 300] }   # house default: slow breathing to close; no opened source gives a length
finisher = { share = 0.10, seconds = [90, 300], from_minutes = 25 }   # house default: the finisher is house policy in programming.md
work = "pairs"

[methods.circuit]
about = "A short loop of movements, one after another with little rest, repeated for a few rounds."
goals = ["general", "strength", "conditioning"]   # conditioning last: the conditioning methods fit it better
minutes = [10, 45]   # house default: the research note's table says fifteen; lowered to ten so a ten-minute snack has a method
levels = ["novice", "experienced", "advanced"]
warmup = { share = 0.15, seconds = [120, 360] }     # house default: short and specific, as Iversen advises; no opened source scales it with length
cooldown = { share = 0.10, seconds = [120, 300] }   # house default: slow breathing to close; no opened source gives a length
work = "rounds"   # rounds come from the strength dose's sets
rest_seconds = [45, 90]   # house default: the rest between rounds, short as a circuit's "little rest" asks; the strength dose's rest is for straight sets
# Upper and lower alternate, push with pull, after HPRC's summary
# https://www.hprc-online.org/physical-fitness/training-performance/choosing-right-exercises-optimize-your-resistance-training

# Conditioning methods ---------------------------------------------------------------------------

[methods.intervals]
about = "Hard efforts with easy recovery between them, a few rounds, paced by the coach."
goals = ["conditioning"]
minutes = [10, 45]   # house default: from the research note's synthesis table, a proposal, not a finding; Gillen's sessions ran ten minutes https://pubmed.ncbi.nlm.nih.gov/27115137/
levels = ["novice", "experienced", "advanced"]
warmup = { share = 0.15, seconds = [120, 360] }     # house default: an easy lead-in; no opened source scales it with length
cooldown = { share = 0.10, seconds = [120, 300] }   # house default: easy then slow breathing; no opened source gives a length
work = "intervals"

[methods.tabata]
about = "Twenty seconds hard, ten seconds easy, eight rounds, about four minutes in all."
goals = ["conditioning"]
minutes = [10, 30]   # house default: one or a few four minute blocks fit a short session
levels = ["experienced", "advanced"]   # house default: all-out efforts are kept for listeners who already train; Gillen's sedentary group is not read as support either way
warmup = { share = 0.15, seconds = [120, 360] }     # house default: an easy lead-in; no opened source scales it with length
cooldown = { share = 0.10, seconds = [120, 300] }   # house default: easy then slow breathing; no opened source gives a length
work = "intervals"

[methods.bike-intervals]
about = "Thirty seconds hard on the bike, then a long easy spin, five times."
goals = ["conditioning"]
minutes = [15, 45]   # house default: five efforts with long easy spins need at least a quarter hour with warm-up and cool-down
levels = ["novice", "experienced", "advanced"]
warmup = { share = 0.15, seconds = [120, 360] }     # house default: an easy spin; no opened source scales it with length
cooldown = { share = 0.10, seconds = [120, 300] }   # house default: easy spin then slow breathing; no opened source gives a length
work = "intervals"
needs = ["bike|air-bike"]
# Short hard efforts with long easy spins between, after Gillen's twenty second sprints within a ten minute
# session https://pubmed.ncbi.nlm.nih.gov/27115137/

# Mobility and skill methods ---------------------------------------------------------------------

[methods.flow]
about = "Slow holds and easy range work, ending with calm breathing."
goals = ["mobility"]
minutes = [15, 45]   # house default: from the research note's synthesis table, a proposal, not a finding
levels = ["novice", "experienced", "advanced"]
warmup = { share = 0.15, seconds = [120, 360] }     # house default: easy movement first; no opened source scales it with length
cooldown = { share = 0.10, seconds = [120, 300] }   # house default: slow breathing to close; no opened source gives a length
work = "holds"

[methods.skill]
about = "Drill rounds that build a skill, then a short block of supporting strength."
goals = ["skill"]
minutes = [15, 45]   # house default: a quarter hour of drills at least, up to a long session
levels = ["novice", "experienced", "advanced"]
warmup = { share = 0.15, seconds = [120, 360] }     # house default: short and specific, as Iversen advises; no opened source scales it with length
cooldown = { share = 0.10, seconds = [120, 300] }   # house default: slow breathing to close; no opened source gives a length
work = "rounds"

# All-out sprints ---------------------------------------------------------------------------------
# A hard timed effort of `most_seconds` or less is an all-out sprint, and rests at least `rest_ratio`
# times its work; the brief says so to the writer (programming.md has the sources).

[all_out]
most_seconds = 20   # house default: a hard timed entry this short or shorter is an all-out sprint, as the catalog's sprint holds are
rest_ratio = 4      # source: programming.md, Rest between intervals: all-out efforts of ten to thirty seconds get at least four times their length in easy movement; Gillen rested six times https://pubmed.ncbi.nlm.nih.gov/27115137/ and Bogdanis found the fuel half back after about a minute https://pmc.ncbi.nlm.nih.gov/articles/PMC1157744

# Dose ---------------------------------------------------------------------------------------------
# Each value is [least, most]. Iversen https://pmc.ncbi.nlm.nih.gov/articles/PMC8449772 and the
# American College of Sports Medicine https://pubmed.ncbi.nlm.nih.gov/19204579/ as programming.md cites them.

[dose.strength.novice]
sets = [2, 3]                      # house default: few sets while technique settles
reps = [8, 12]                     # source: inside Iversen's six to fifteen https://pmc.ncbi.nlm.nih.gov/articles/PMC8449772
rest_seconds = [60, 90]            # source: one to two minutes is enough for untrained people, Iversen https://pmc.ncbi.nlm.nih.gov/articles/PMC8449772
hard_sets_per_session = [6, 12]    # house default: programming.md's session arithmetic, about two minutes a set, not a study

[dose.strength.experienced]
sets = [3, 4]                      # house default: a step up from novice
reps = [6, 10]                     # source: inside Iversen's six to fifteen https://pmc.ncbi.nlm.nih.gov/articles/PMC8449772
rest_seconds = [90, 120]           # source: one to two minutes for muscle work, ACSM https://pubmed.ncbi.nlm.nih.gov/19204579/
hard_sets_per_session = [10, 16]   # house default: programming.md's session arithmetic, about two minutes a set, not a study
bodyweight_reps = [10, 15]         # house default: a movement with no load needs more reps to be hard; inside Iversen's six to fifteen https://pmc.ncbi.nlm.nih.gov/articles/PMC8449772

[dose.strength.advanced]
sets = [3, 5]                      # house default: a step up from experienced
reps = [4, 8]                      # house default: below Iversen's six for heavier sets; home kit rarely allows it
rest_seconds = [120, 180]          # source: trained people probably need two minutes or more, Iversen https://pmc.ncbi.nlm.nih.gov/articles/PMC8449772; the upper bound is a house default
hard_sets_per_session = [12, 20]   # house default: programming.md's session arithmetic, about twenty at forty five minutes
bodyweight_reps = [10, 20]         # house default: a movement with no load needs more reps to be hard; above Iversen's fifteen for trained people, slow on the way down

[dose.conditioning.novice]
work_seconds = [20, 30]            # source: Gillen's efforts lasted twenty seconds https://pubmed.ncbi.nlm.nih.gov/27115137/; the upper bound is a house default
rest_seconds = [40, 60]            # house default: twice the work or more while fitness builds
rounds = [3, 6]                    # house default: Gillen used three efforts https://pubmed.ncbi.nlm.nih.gov/27115137/ at all out; a few more at a lower effort
efforts_per_session = [6, 12]      # house default: total hard efforts in a session; past it the time goes to a steady block, not more efforts

[dose.conditioning.experienced]
work_seconds = [30, 45]            # house default: longer efforts as fitness grows
rest_seconds = [30, 45]            # house default: about equal work and rest
rounds = [4, 8]                    # house default: a step up from novice; four lets a capped session hold more movements
efforts_per_session = [8, 16]      # house default: total hard efforts in a session; past it the time goes to a steady block, not more efforts

[dose.conditioning.advanced]
work_seconds = [30, 60]            # house default: longer efforts as fitness grows
rest_seconds = [15, 30]            # house default: less rest than work
rounds = [4, 10]                   # house default: a step up from experienced; four lets a capped session hold more movements
efforts_per_session = [10, 20]     # house default: total hard efforts in a session; past it the time goes to a steady block, not more efforts

[dose.mobility.novice]
hold_seconds = [30, 60]            # house default: programming.md lists mobility hold length as not searched
rounds = [2, 3]                    # house default: a few passes, no opened source

[dose.mobility.experienced]
hold_seconds = [30, 60]            # house default: programming.md lists mobility hold length as not searched
rounds = [2, 3]                    # house default: a few passes, no opened source

[dose.mobility.advanced]
hold_seconds = [30, 60]            # house default: programming.md lists mobility hold length as not searched
rounds = [2, 3]                    # house default: a few passes, no opened source

[dose.skill.novice]
drill_seconds = [45, 60]           # house default: long enough for a few clean tries, no opened source
rounds = [4, 8]                    # house default: rounds that get harder, no opened source

[dose.skill.experienced]
drill_seconds = [45, 60]           # house default: long enough for a few clean tries, no opened source
rounds = [4, 8]                    # house default: rounds that get harder, no opened source

[dose.skill.advanced]
drill_seconds = [45, 60]           # house default: long enough for a few clean tries, no opened source
rounds = [4, 8]                    # house default: rounds that get harder, no opened source
