name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the privacy check reads every pushed commit
      # The project's own environment, from uv.lock, as ./sweatcast setup makes it (no local voice engine):
      # Python from .python-version, and the ffmpeg that imageio-ffmpeg brings, so the encode tests run.
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --locked
      # The tests need no models or network, and no personal context: they run on me.example/ and
      # tests/fixtures/, with SWEATCAST_HOME pointed at an absent folder.
      - run: ./sweatcast test -v
      - name: Nothing personal in the files
        run: |
          PATTERN="$(grep -v '^#' tools/hooks/private-paths | grep -v '^[[:space:]]*$' | head -1)"
          if git ls-files | grep -E "$PATTERN" | grep -Ev '^me\.example/'; then
            echo "Personal context belongs in me/, which is git-ignored."; exit 1
          fi
      - name: Nothing personal in the pushed commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          # Only the new commits: history already pushed is a separate matter.
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="origin/main..HEAD"   # a new branch
          fi
          tools/hooks/check-private.sh "$RANGE"
