name: tests
# Branches and pull requests, not tags: a release's tag points at a commit main has already tested.
on:
  push:
    branches: ["**"]
  pull_request:
# A newer push to a branch cancels the run it replaces. On main each commit is its own group, so nothing waits or
# is cancelled while a deploy may be under way.
concurrency:
  group: tests-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
# The privacy checks run first and gate the rest. Then, side by side on Linux: the engine's tests with the
# fresh-clone smoke test, the web server's tests against Postgres, and the browser client's. On main the deploy
# waits for all of them, so a failing test keeps the site as it was. Mac and Windows aren't run here (2026-11-17:
# they tripled the time and a missing Mac runner once held a release for fifteen minutes); the smoke test and the
# suite run on them by hand: sh tools/smoke.sh, ./harmonicfitness test.
jobs:
  privacy:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.changed.outputs.engine }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the privacy check reads every pushed commit
      - name: The commits this push brings
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.base_ref }}
        run: |
          # Only the new commits: history already pushed is a separate matter.
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="origin/$BASE..HEAD"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="origin/main..HEAD"   # a new branch
          fi
          echo "range=$RANGE" >> "$GITHUB_OUTPUT"
      - name: Nothing personal in the files
        run: |
          PATTERN="$(grep -v '^#' tools/hooks/private-paths | grep -v '^[[:space:]]*$' | head -1)"
          if git ls-files | grep -E "$PATTERN" | grep -Ev '^me\.example/'; then
            echo "Personal context belongs in me/, which is git-ignored."; exit 1
          fi
      - name: Nothing personal in the pushed commits
        run: tools/hooks/check-private.sh "${{ steps.range.outputs.range }}"
      - name: Whether the engine changed
        id: changed
        env:
          RANGE: ${{ steps.range.outputs.range }}
        run: |
          # The engine's tests are skipped only when every changed file is the web app's (web/), the changelog,
          # VERSION, or a version line in pyproject.toml or uv.lock. Anything unclear runs them.
          engine=true
          if files="$(git diff --name-only "$RANGE" 2>/dev/null)" && [ -n "$files" ]; then
            others="$(echo "$files" | grep -Ev '^(web/|CHANGELOG\.md$|VERSION$|pyproject\.toml$|uv\.lock$)' || true)"
            lock="$(git diff "$RANGE" -- pyproject.toml uv.lock | grep -E '^[+-][^+-]' | grep -Ev '^[+-]version = ' || true)"
            if [ -z "$others" ] && [ -z "$lock" ]; then engine=false; fi
          fi
          echo "engine=$engine" | tee -a "$GITHUB_OUTPUT"

  engine:
    needs: privacy
    if: needs.privacy.outputs.engine == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --locked
      # a new listener's first minutes: setup, doctor, check, a brief and a lint (no voice, no MP3)
      - run: sh tools/smoke.sh
      # no models, network or personal context: me.example/ and tests/fixtures/, in a temporary home
      - run: ./harmonicfitness test engine

  web:
    needs: privacy
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HARMONICFITNESS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.11.16"
          enable-cache: true
      - run: uv sync --locked --extra web
      - run: ./harmonicfitness test web

  client:
    needs: privacy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/client/package-lock.json
      - run: npm ci && npx tsc --noEmit -p . && npm test

  # The web client on Fly.io, once the privacy checks and the tests pass on main (fly.toml). The engine's tests
  # are skipped when a push changes only web/, the changelog or the version, which counts as passing; always()
  # lets the deploy look at that result instead of being skipped with them. The token is a deploy token for this
  # one app (fly tokens create deploy -a harmonicfitness), the FLY_API_TOKEN secret.
  deploy:
    needs: [privacy, engine, web, client]
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.privacy.result == 'success' && needs.web.result == 'success' && needs.client.result == 'success'
      && (needs.engine.result == 'success' || needs.engine.result == 'skipped')
    runs-on: ubuntu-latest
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: superfly/flyctl-actions/setup-flyctl@1.5
        with:
          version: "0.4.123"
      - run: flyctl deploy --remote-only --build-arg GIT_COMMIT_SHA="${GITHUB_SHA::7}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The live site answers, and it's this commit (its version reads "2026-11-17 (abc1234)")
      - name: The live site runs this commit
        run: |
          for i in $(seq 1 20); do
            if curl -fsS https://harmonicfitness.fly.dev/api/auth | grep -q "(${GITHUB_SHA::7})"; then
              echo "live: ${GITHUB_SHA::7}"; exit 0
            fi
            sleep 6
          done
          echo "the live site isn't serving ${GITHUB_SHA::7} two minutes after the deploy" >&2
          exit 1
