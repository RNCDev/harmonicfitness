# A small synthetic catalog for tests: the full fixed lists and a few movements.
format = 2

patterns = ["squat", "hinge", "lunge", "horizontal-push", "vertical-push", "horizontal-pull", "vertical-pull",
            "carry", "rotation", "anti-rotation", "anti-extension", "locomotion", "balance", "arms", "hips",
            "mobility", "breathing", "skill"]

muscles = ["quads", "hamstrings", "glutes", "adductors", "abductors", "calves", "chest", "back", "lats",
           "shoulders", "biceps", "triceps", "forearms", "core", "neck"]

areas = ["foot", "ankle", "calf", "knee", "hamstring", "hip", "groin", "low-back", "rib", "shoulder", "elbow",
         "wrist", "neck"]

flags = ["impact", "single-leg", "kneeling", "floor", "lying-side", "hanging", "overhead", "spine-flexion",
         "spine-twist", "lateral", "fast", "grip"]

[equipment]
dumbbells = { aliases = ["dumbbell", "dumbbells"], about = "fixed or adjustable dumbbells" }
kettlebell = { aliases = ["kettlebell", "kettlebells"], about = "one or more kettlebells" }
bench = { aliases = ["bench"], about = "a flat or adjustable bench" }
band = { aliases = ["band", "resistance band"], about = "resistance bands" }
mat = { aliases = ["mat", "yoga mat"], about = "an exercise mat" }
chair = { aliases = ["chair"], about = "a sturdy chair" }
towel = { aliases = ["towel"], about = "a bath towel" }
foam-roller = { aliases = ["foam roller"], about = "a foam roller" }
strap = { aliases = ["strap"], about = "a stretching strap" }
bike = { aliases = ["bike", "exercise bike"], about = "a stationary bike" }
rower = { aliases = ["rower", "rowing machine"], about = "a rowing machine" }
cable = { aliases = ["cable", "cables"], about = "a cable station" }
machines = { aliases = ["machine", "machines"], about = "weight machines" }
barbell = { aliases = ["barbell"], about = "a barbell with plates" }
rack = { aliases = ["rack", "squat rack"], about = "a squat rack" }
ski-erg = { aliases = ["ski erg"], about = "a ski ergometer" }
air-bike = { aliases = ["air bike"], about = "a fan-resistance bike" }
sled = { aliases = ["sled"], about = "a push or drag sled" }
treadmill = { aliases = ["treadmill"], about = "a treadmill" }
elliptical = { aliases = ["elliptical"], about = "an elliptical trainer" }
stair-climber = { aliases = ["stair climber"], about = "a stair climber" }
stick-and-ball = { aliases = ["stick and ball"], about = "a massage stick and a ball" }

[presets.bodyweight]
equipment = []

[presets.hotel-room]
equipment = ["chair", "towel"]

[presets.hotel-gym]
equipment = ["dumbbells", "bench", "treadmill", "elliptical", "bike", "mat"]

[presets.full-gym]
equipment = ["dumbbells", "kettlebell", "bench", "band", "mat", "barbell", "rack", "cable", "machines"]

[[movement]]
id = "goblet-squat"
name = "goblet squat"
aliases = ["dumbbell goblet squat", "kettlebell goblet squat"]
needs = ["dumbbells|kettlebell"]
position = "standing"
sided = false
measure = "reps"
patterns = ["squat"]
muscles = ["quads", "glutes"]
loads = { knee = 3, hip = 2, ankle = 2, low-back = 1 }
flags = []
intensity = "strength"
level = "novice"
seconds_per_rep = 3
transition_seconds = 15
setup = "Hold one weight upright at your chest, feet a little wider than your hips."
cues = ["Sit between your heels.", "Elbows inside the knees.", "Chest tall."]
easier = ["air-squat"]
harder = []
draft = false

